<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1726">
<title>Asta Mantra · 3-5-2</title>
<style>
:root{
  --ink:#0E1726; --ink2:#16202F; --card:#1A2637; --line:#26364E;
  --paper:#EDF1F6; --mute:#90A2BA; --dim:#5E7292;
  --grass:#17B26A; --grass-d:#0E6E43;
  --amber:#F2B441; --rose:#E5484D; --sky:#4C9BE8; --violet:#9E7BFF;
  --f1:#F2B441; --f2:#4C9BE8; --f3:#6E819B;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink); color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.35;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
header{
  padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;
  background:linear-gradient(180deg,#101C2E,#0E1726);
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
.hrow{display:flex;align-items:flex-end;gap:14px}
.big{font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.big small{font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:4px}
.hlab{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:2px}
.hright{margin-left:auto;text-align:right}
.hright .v{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.bar{height:7px;border-radius:4px;background:#0A121D;margin-top:10px;display:flex;overflow:hidden;border:1px solid #0A121D}
.bar i{display:block;height:100%}
.hmeta{display:flex;gap:6px;margin-top:7px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.hmeta b{color:var(--paper);font-weight:600}
.pill{background:#0F1A29;border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* ---------- layout ---------- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 30px}
nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:#0C1522;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 0 8px;color:var(--dim);font-size:10.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--grass)}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 0 9px;letter-spacing:.01em}
h2:first-child{margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card + .card{margin-top:10px}
.muted{color:var(--mute)}
.tiny{font-size:12px}

/* ---------- controls ---------- */
.inp{width:100%;background:#0F1A29;border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--paper);outline:none}
.inp:focus{border-color:var(--sky)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#233248;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:15px;font-weight:600}
.btn.full{width:100%}
.btn.go{background:var(--grass);color:#04160C;border-color:transparent}
.btn.warn{background:#2A2130;border-color:#3C3145;color:var(--amber)}
.btn.dan{background:#2B1A1E;border-color:#4A2429;color:var(--rose)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.seg{display:flex;background:#0F1A29;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:#26364E;color:var(--paper)}
.chip{border:1px solid var(--line);background:#0F1A29;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--grass);border-color:transparent;color:#04160C}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lab{font-size:12px;color:var(--dim);margin:0 0 5px}
.field + .field{margin-top:11px}

/* ---------- lista ---------- */
.plist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.p{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid #1F2C40}
.p:last-child{border-bottom:0}
.p .nm{flex:1;min-width:0}
.p .nm b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .nm span{font-size:11.5px;color:var(--dim)}
.rl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:2px 5px;border-radius:5px;background:#0F1A29;border:1px solid var(--line);color:var(--mute);margin-right:3px}
.rl.P{color:var(--amber)} .rl.D{color:var(--sky)} .rl.C{color:var(--grass)} .rl.A{color:var(--rose)}
.fa{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0B1220}
.fa1{background:var(--f1)} .fa2{background:var(--f2)} .fa3{background:var(--f3)}
.qt{font-weight:700;font-size:15px;min-width:34px;text-align:right}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.tag.io{background:rgba(23,178,106,.16);color:var(--grass)}
.tag.altri{background:#22303F;color:var(--dim)}
.tag.ko{background:rgba(229,72,77,.18);color:var(--rose)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rose);flex:0 0 auto}
.slot.full .disc.ko{background:var(--rose);color:#fff;border-color:#fff}
.bch.ko{border-color:rgba(229,72,77,.5)}
.p.taken{opacity:.42}
.p.mine{background:linear-gradient(90deg,rgba(23,178,106,.13),transparent 60%)}
.tbtn{width:38px;height:38px;border-radius:10px;background:#233248;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 auto}
.lock{display:inline-block;background:#0F1A29;border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:3px 4px 0 0;font-size:12px}
.lock b{font-weight:700}
.inp:disabled{opacity:.45}
.empty{text-align:center;color:var(--dim);padding:26px 14px;font-size:14px}

/* ---------- rings ---------- */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rings.sub{gap:12px 8px}
.ring{text-align:center;background:none;border:0;color:inherit;padding:0;width:100%;display:block}
.ring:active{transform:scale(.96)}
.ring.dim{opacity:.4}
.rrow{padding:10px 0;border-bottom:1px solid #1F2C40}
.rrow:last-child{border-bottom:0}
.tapme{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;color:var(--dim);margin-top:10px}
.ring svg{width:100%;max-width:72px;display:block;margin:0 auto}
.ring .lb{font-size:11px;color:var(--mute);margin-top:2px}
.ring .vl{font-size:12px;font-weight:700}

/* ---------- campo ---------- */
.pitch{
  position:relative;width:100%;aspect-ratio:10/13;border-radius:var(--r);overflow:hidden;
  background:
    repeating-linear-gradient(180deg,#12513A 0 7.69%,#0F4834 7.69% 15.38%);
  border:1px solid #1D6247;
}
.pitch .ln{position:absolute;border:1.5px solid rgba(255,255,255,.16)}
.pitch .box{left:22%;width:56%;height:13%;bottom:0;border-bottom:0}
.pitch .box6{left:36%;width:28%;height:6%;bottom:0;border-bottom:0}
.pitch .mid{left:0;width:100%;top:50%;height:0;border-width:0 0 1.5px 0}
.pitch .circ{left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);width:62px;text-align:center;touch-action:manipulation}
.slot .disc{
  width:52px;height:52px;margin:0 auto;border-radius:50%;
  background:rgba(6,26,18,.55);border:2px dashed rgba(255,255,255,.3);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.75)
}
.slot.full .disc{background:var(--paper);border:2px solid #fff;color:#0B1220;border-style:solid}
.slot.full .disc.warn{background:var(--amber)}
.slot .nm2{font-size:10.5px;font-weight:600;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pz{font-size:9.5px;color:rgba(255,255,255,.72)}
.slot.hit .disc{border-color:var(--amber);box-shadow:0 0 0 4px rgba(242,180,65,.35)}
.slot.ok .disc{border-color:var(--grass);box-shadow:0 0 0 3px rgba(23,178,106,.3)}
.tit{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;width:34px;height:3px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden}
.tit i{display:block;height:100%;background:var(--grass)}
.mods{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.mods .chip{flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmpr{padding:9px 0;border-bottom:1px solid #1F2C40}
.cmpr:last-of-type{border-bottom:0}
.cmpr.cur{background:linear-gradient(90deg,rgba(23,178,106,.12),transparent 70%);margin:0 -13px;padding:9px 13px}
.bench{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.bch{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;touch-action:manipulation}
.bch.sel{border-color:var(--grass);background:rgba(23,178,106,.14)}
.bch.used{opacity:.35}
.bch em{font-style:normal;color:var(--dim);font-size:11px;font-weight:600}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);opacity:.95}
body.dragging{cursor:grabbing}

/* ---------- piano ---------- */
.pbar{height:8px;border-radius:5px;background:#0F1A29;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:5px}
.line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.line b{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#0F1A29;border:1px solid var(--line);border-radius:10px;padding:9px}
.mini .k{font-size:11px;color:var(--dim)}
.mini .v{font-size:19px;font-weight:700;letter-spacing:-.4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,9,16,.6);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--ink2);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:#33455F;margin:6px auto 12px}
.sh-title{font-size:19px;font-weight:700;letter-spacing:-.3px}
.stepper{display:flex;align-items:center;gap:8px;margin:12px 0}
.stepper button{width:52px;height:52px;border-radius:14px;background:#233248;border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper .val{flex:1;text-align:center;font-size:44px;font-weight:700;letter-spacing:-2px}
.simul{background:#0F1A29;border:1px solid var(--line);border-radius:12px;padding:11px;margin:4px 0 12px}
.simul .line{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translate(-50%,14px);
  background:#233248;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;
  z-index:200;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:rgba(242,180,65,.12);border:1px solid rgba(242,180,65,.35);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
textarea.inp{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- calcoli ---------- */
const byId=id=>S.players.find(p=>p.id===id);
const macroOf=p=>MACRO[p.ruoli[0]]||'C';
const mine=()=>S.players.filter(p=>p.stato==='io');
function L(){ // giocatori previsti per reparto: contati sulle caselle del piano
  const o={P:0,D:0,C:0,A:0};
  (S.caselle||[]).forEach(x=>o[macroOfRole(x.r)]++);
  if(!(S.caselle||[]).length) return Object.assign({},S.limits);
  return o;
}
function calc(){
  const own=mine(), spent=own.reduce((s,p)=>s+(+p.prezzo||0),0);
  const lim=L(), tot=lim.P+lim.D+lim.C+lim.A;
  const left=Math.max(0,tot-own.length), rem=S.budget-spent;
  const per={};
  for(const m of ['P','D','C','A']){
    const l=own.filter(p=>macroOf(p)===m);
    per[m]={n:l.length,lim:lim[m],sp:l.reduce((s,p)=>s+(+p.prezzo||0),0),
            tit:l.length?Math.round(l.reduce((s,p)=>s+(+p.tit||0),0)/l.length):0};
  }
  return {own,spent,rem,tot,left,per,lim,max:left>0?Math.max(0,rem-(left-1)):0,avg:left>0?Math.floor(rem/left):0};
}

/* ============================================================
   PIANO A CASELLE — una casella per posizione, con il suo prezzo.
   Quando compri, la casella si occupa e si blocca sul prezzo pagato.
   ============================================================ */
const COMBO=['Dc/B','M/C','E/W','C/T','W/T','W/A','T/A','T/A/Pc','A/Pc'];
const ROLEOPTS=RUOLI.concat(COMBO);
const PESO={Por:.6,Dd:.9,Ds:.9,Dc:.9,B:.8,E:1.1,M:1.1,C:1.7,T:1.9,W:1.9,A:2.6,Pc:2.4};
function macroOfRole(r){
  if(MACRO[r])return MACRO[r];
  const T=SLOTTYPES[r]; return T?MACRO[T.ok[0]]:'C';
}
function pesoOf(r){
  if(PESO[r])return PESO[r];
  const T=SLOTTYPES[r]; return T?Math.max(...T.ok.map(x=>PESO[x]||1)):1;
}
function fitPlan(p,r){ // 1 naturale · 2 adattabile · 3 no
  if(RUOLI.includes(r)) return p.ruoli.includes(r)?1:(SLOTTYPES[r]&&p.ruoli.some(x=>SLOTTYPES[r].ad.includes(x))?2:3);
  const T=SLOTTYPES[r]; if(!T)return 3;
  if(p.ruoli.some(x=>T.ok.includes(x)))return 1;
  if(p.ruoli.some(x=>T.ad.includes(x)))return 2;
  return 3;
}
function cas(id){return (S.caselle||[]).find(x=>x.id===id)}
function casOf(pid){return (S.caselle||[]).find(x=>x.pid===pid)}
function planLive(){
  const cs=S.caselle||[];
  const occ=cs.filter(x=>x.pid&&byId(x.pid)&&byId(x.pid).stato==='io');
  const free=cs.filter(x=>!occ.includes(x));
  const speso=occ.reduce((a,x)=>a+(+byId(x.pid).prezzo||0),0);
  const plan=free.reduce((a,x)=>a+(+x.cr||0),0);
  const prev=occ.reduce((a,x)=>a+(+x.cr||0),0);
  return {occ,free,speso,plan,prev,delta:speso-prev};
}
/* casella migliore per un giocatore a un certo prezzo */
function bestCasella(p,price){
  const free=(S.caselle||[]).filter(x=>!x.pid);
  let best=null,bs=1e9;
  for(const lvl of [1,2]){
    for(const x of free){
      if(fitPlan(p,x.r)!==lvl)continue;
      const sc=Math.abs((+x.cr||0)-price);
      if(sc<bs){bs=sc;best=x}
    }
    if(best)return best;
  }
  return null;
}
function newCas(r,cr){return {id:'c'+Math.random().toString(36).slice(2,8),r:r,cr:Math.max(1,Math.round(cr||1)),pid:null,extra:false}}
/* costruisce le caselle dal modulo attivo: 11 titolari + panchina fino al totale */
function genCaselle(target){
  const occ=(S.caselle||[]).filter(x=>x.pid);
  const base=slots().map(x=>x.t);
  const list=[];
  base.forEach(r=>list.push({r,tit:true}));
  let i=0;
  while(list.length<target){ list.push({r:base[i%base.length],tit:false}); i++ }
  // pesi: i titolari valgono di più delle riserve
  const W=list.reduce((a,x)=>a+pesoOf(x.r)*(x.tit?1:.32),0);
  const budget=Math.max(1,S.budget-occ.reduce((a,x)=>a+(+byId(x.pid)?.prezzo||0),0));
  const nuove=list.map(x=>newCas(x.r,Math.max(1,Math.round(budget*pesoOf(x.r)*(x.tit?1:.32)/W))));
  // le caselle già occupate restano: tolgo dalle nuove una posizione uguale
  occ.forEach(o=>{ const j=nuove.findIndex(n=>n.r===o.r); if(j>=0)nuove.splice(j,1); else nuove.pop() });
  S.caselle=occ.concat(nuove);
}
/* spalma la differenza tra crediti veri e piano sulle caselle libere */
function spreadScarto(){
  const c=calc(), pl=planLive();
  if(!pl.free.length)return 0;
  const target=Math.max(0,c.rem), plan=pl.plan;
  const k=plan>0?target/plan:0;
  pl.free.forEach(x=>{ x.cr = plan>0?Math.max(1,Math.round(x.cr*k)):Math.max(1,Math.floor(target/pl.free.length)) });
  let diff=target-pl.free.reduce((a,x)=>a+x.cr,0);
  const ord=pl.free.slice().sort((a,b)=>b.cr-a.cr);
  for(const x of ord){ if(!diff)break; const st=diff>0?1:-1; if(x.cr+st>=1){x.cr+=st;diff-=st} }
  return plan>0?Math.round((k-1)*100):0;
}

function roleStats(r){
  const SL=slots(), cp=CP();
  const need=SL.filter(x=>SLOTTYPES[x.t].ok.includes(r)).length;
  const own=mine().filter(p=>p.ruoli.includes(r)).sort((a,b)=>b.tit-a.tit);
  const inField=SL.filter(x=>cp[x.id]&&byId(cp[x.id]).ruoli.includes(r)&&SLOTTYPES[x.t].ok.includes(r)).length;
  const tit=own.length?Math.round(own.reduce((a,b)=>a+(+b.tit||0),0)/own.length):0;
  const lib=S.players.filter(p=>p.stato==='lib'&&p.ruoli.includes(r)).length;
  return {r,need,own,inField,tit,lib,pos:SL.filter(x=>SLOTTYPES[x.t].ok.includes(r)).map(x=>x.t)};
}
function ringRole(st){
  const col=!st.need?'var(--dim)':st.own.length===0?'var(--rose)':st.own.length>=st.need?'var(--grass)':'var(--amber)';
  return `<div class="ring ${st.need?'':'dim'}">

}

function slotHTML(s){

function fitness(p,s){ // 1 naturale · 2 adattato (malus 1) · 3 non schierabile
  const T=SLOTTYPES[s.t||s];
  if(p.ruoli.some(r=>T.ok.includes(r)))return 1;
  if(p.ruoli.some(r=>T.ad.includes(r)))return 2;
  return 3;
}
function place(pid,slotId){
  const s=slots().find(x=>x.id===slotId), p=byId(pid);
  if(fitness(p,s)===3){toast(p.ruoli.join('/')+' non si può schierare in posizione '+s.t);return false}
  const cp=CP();
  for(const k in cp) if(cp[k]===pid) delete cp[k];
  cp[slotId]=pid; persist(); return true;
}

  });

/* miglior undici possibile per un modulo: matching bipartito (Kuhn) */
function bestXI(mod,players){
  const SL=slots(mod);
  const ps=players.slice().sort((a,b)=>(b.tit-a.tit)||(b.quota-a.quota));
  const matchP={};                       // indice giocatore -> indice slot
  const aug=(si,seen,lvl)=>{
    for(let pi=0;pi<ps.length;pi++){
      if(seen[pi])continue;
      const f=fitness(ps[pi],SL[si]); if(f===3||f>lvl)continue;
      seen[pi]=1;
      if(matchP[pi]===undefined||aug(matchP[pi],seen,lvl)){matchP[pi]=si;return true}
    }
    return false;
  };
  for(let i=0;i<SL.length;i++) aug(i,{},1);
  let taken=new Set(Object.values(matchP));
  for(let i=0;i<SL.length;i++) if(!taken.has(i)&&aug(i,{},2)) taken=new Set(Object.values(matchP));
  const assign={}; let nat=0,ad=0,tit=0;
  for(const pi in matchP){
    const s=SL[matchP[pi]], p=ps[pi];
    assign[s.id]=p.id; tit+=+p.tit||0;
    fitness(p,s)===1?nat++:ad++;
  }
  const n=nat+ad;
  const missing=SL.filter(s=>!assign[s.id]).map(s=>s.t);
  return {assign,nat,ad,n,missing,tit:n?Math.round(tit/n):0};
}

/* ---------- drag con pointer events ---------- */
let dragMoved=false;
function pressDrag(el,pid,fromSlot){
  let t=null,ghost=null,started=false,sx=0,sy=0;
  const stopScroll=e=>{if(started)e.preventDefault()};
  const down=e=>{
    if(e.button&&e.button!==0)return;
    dragMoved=false; sx=e.clientX; sy=e.clientY;
    t=setTimeout(()=>{
      started=true; dragMoved=true;
      const p=byId(pid); if(!p)return;
      ghost=document.createElement('div');
      ghost.className='bch ghost'; ghost.style.left=sx+'px'; ghost.style.top=sy+'px';
      ghost.innerHTML=`<span class="fa fa${p.fascia}">${p.fascia}</span>${esc(short(p.nome))}`;
      document.body.appendChild(ghost); document.body.classList.add('dragging');
      highlight(p);
      if(navigator.vibrate)navigator.vibrate(8);
    },180);
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
    document.addEventListener('touchmove',stopScroll,{passive:false});
  };
  const move=e=>{
    if(!started){ if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){clearTimeout(t);cleanup()} return }
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const sl=under&&under.closest?under.closest('.slot'):null;
    $$('.slot').forEach(x=>{
      const d=x.querySelector('.disc');
      if(d) d.style.transform = (x===sl?'scale(1.16)':'');
    });
  };
  const up=e=>{
    clearTimeout(t);
    if(started){
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const sl=under&&under.closest?under.closest('.slot'):null;
      if(sl){ place(pid,sl.dataset.s); }
      else if(fromSlot){ delete CP()[fromSlot]; persist() }
      cleanup(); sel=null; viewCampo(); return;
    }
    cleanup();
  };
  const cleanup=()=>{
    started=false;
    if(ghost){ghost.remove();ghost=null}
    document.body.classList.remove('dragging');
    $$('.slot').forEach(x=>{x.classList.remove('ok','hit');const d=x.querySelector('.disc');if(d)d.style.transform=''});
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    document.removeEventListener('touchmove',stopScroll,{passive:false});
    setTimeout(()=>dragMoved=false,50);
  };
  el.addEventListener('pointerdown',down);
}

/* ---------- import tabellare (listone ufficiale o righe libere) ---------- */
const HDR={
  nome:['nome','giocatore','calciatore','cognome'],
  squadra:['squadra','team','club'],
  rm:['rm','ruolim','ruolomantra','ruolima','ruoloma','ruoli','ruolo mantra','mantra'],
  rc:['r','ruolo','ruoloclassic'],
  fvmm:['fvmm','fvm m','fvmmantra'], qtam:['qtam','qt a m','qtim'],
  fvm:['fvm'], qta:['qta','qtia','quota','quotazione'],
  tit:['titolarita','tit','titolarità'],
  pv:['pv','partiteavoto','presenze','pg']
};
function normHdr(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function splitRow(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++} else q=!q; continue }
    if(c===sep&&!q){out.push(cur);cur='';continue}
    cur+=c;}
  out.push(cur); return out.map(x=>x.trim());
}
function sepOf(line){
  const c={';':(line.match(/;/g)||[]).length,'\t':(line.match(/\t/g)||[]).length,',':(line.match(/,/g)||[]).length};
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
}
function isRole(x){const v=norm(x); return RUOLI.includes(v)}
function norm(r){
  const s=String(r||'').trim().toLowerCase();
  const map={por:'Por',p:'Por',dd:'Dd',dc:'Dc',ds:'Ds',b:'B',e:'E',m:'M',c:'C',w:'W',t:'T',a:'A',pc:'Pc'};
  return map[s]||String(r||'').trim();
}
function autoFascia(mm,q){const f=S.fasce[mm]||S.fasce.C; if(q>=f[0].cr*0.7)return 1; if(q>=f[1].cr*0.7)return 2; return 3}
function parseTable(txt){
  const lines=txt.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)return null;
  let hi=-1;
  for(let i=0;i<Math.min(8,lines.length);i++){
    const n=normHdr(lines[i]);
    if(n.includes('nome')&&(n.includes('squadra')||n.includes('rm')||n.includes('fvm'))){hi=i;break}
  }
  if(hi<0)return null;
  const sep=sepOf(lines[hi]), head=splitRow(lines[hi],sep).map(normHdr);
  const at=k=>head.findIndex(h=>HDR[k].some(x=>h===normHdr(x)));
  const ix={}; for(const k in HDR) ix[k]=at(k);
  if(ix.nome<0)return null;
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    let c=splitRow(lines[i],sep);
    if(ix.rm>=0&&isRole(c[ix.rm])){                 // ruoli separati dal delimitatore: li riunisco
      let j=ix.rm,rr=[];
      while(j<c.length&&isRole(c[j])){rr.push(norm(c[j]));j++}
      if(rr.length>1)c.splice(ix.rm,rr.length,rr.join('/'));
    }
    const nome=(c[ix.nome]||'').trim(); if(!nome||normHdr(nome)==='nome')continue;
    let ruoli=(ix.rm>=0?c[ix.rm]:'').split(/[\/|;,\-]/).map(norm).filter(x=>RUOLI.includes(x));
    if(!ruoli.length&&ix.rc>=0){const rc={p:['Por'],d:['Dc'],c:['C'],a:['A']}[(c[ix.rc]||'').trim().toLowerCase()]; if(rc)ruoli=rc}
    const num=k=>ix[k]>=0?parseFloat(String(c[ix[k]]).replace(',','.')):NaN;
    const q=[num('fvmm'),num('qtam'),num('fvm'),num('qta')].find(x=>!isNaN(x)&&x>0);
    let tit=num('tit'); if(isNaN(tit)){const pv=num('pv'); if(!isNaN(pv))tit=Math.min(100,Math.round(pv/38*100))}
    rows.push({nome,squadra:ix.squadra>=0?(c[ix.squadra]||'').trim():'',ruoli:ruoli.length?ruoli:['C'],
      quota:q||1,tit:isNaN(tit)?null:tit});
  }
  return rows.length?rows:null;
}
function parseFree(txt){
  const rows=[];
  for(const r of txt.split(/\r?\n/)){
    if(!r.trim())continue;
    const sep=/;/.test(r)?';':/\t/.test(r)?'\t':',';
    const c=r.split(sep).map(x=>x.trim());
    if(c.length<2)continue;
    if(/^nome$/i.test(c[0]))continue;
    const ruoli=(c[2]||'C').split(/[\/|]/).map(norm).filter(x=>RUOLI.includes(x));
    rows.push({nome:c[0],squadra:c[1]||'',ruoli:ruoli.length?ruoli:['C'],
      fascia:Math.min(3,Math.max(1,+c[3]||2)),quota:+c[4]||1,tit:c[5]!==undefined?Math.min(100,+c[5]||60):null});
  }
  return rows.length?rows:null;
}
function applyRows(rows,replace){
  let add=0,upd=0;
  if(replace){S.players=[];S.campi={};S.log=[]}
  const idx={}; S.players.forEach(p=>{idx[keyOf(p.nome,p.squadra)]=p;idx[nrm(p.nome)]=idx[nrm(p.nome)]||p});
  for(const r of rows){
    const ex=idx[keyOf(r.nome,r.squadra)]||idx[nrm(r.nome)];
    if(ex){
      ex.ruoli=r.ruoli; ex.quota=r.quota; if(r.squadra)ex.squadra=r.squadra;
      if(r.tit!==null&&r.tit!==undefined)ex.tit=r.tit;
      upd++;
    }else{
      const mm=MACRO[r.ruoli[0]]||'C';
      const p=mkPlayer({nome:r.nome,squadra:r.squadra,ruoli:r.ruoli,quota:r.quota,
        tit:(r.tit===null||r.tit===undefined)?60:r.tit,fascia:r.fascia||autoFascia(mm,r.quota)});
      S.players.push(p); idx[keyOf(p.nome,p.squadra)]=p; add++;
    }
  }
  return {add,upd};
}
/* archivio nomi: tutto quello che è passato da un import resta consultabile
   anche se poi la lista di lavoro viene sfoltita o sostituita */
function archAdd(rows){
  if(!S.arch)S.arch=[];
  const idx={}; S.arch.forEach((a,i)=>idx[keyOf(a.n,a.s)]=i);
  rows.forEach(r=>{
    if(!r.nome)return;
    const k=keyOf(r.nome,r.squadra), e={n:r.nome,s:r.squadra||'',r:r.ruoli||['C'],q:r.quota||1,t:(r.tit==null?null:r.tit)};
    if(idx[k]!==undefined)S.arch[idx[k]]=e; else {idx[k]=S.arch.length;S.arch.push(e)}
  });
  if(S.arch.length>1500)S.arch=S.arch.slice(-1500);
}
function lookup(q){
  q=nrm(q); if(q.length<2)return [];
  const out=[],seen={};
  S.players.forEach(p=>{
    if(!nrm(p.nome).includes(q))return;
    const k=keyOf(p.nome,p.squadra); if(seen[k])return; seen[k]=1;
    out.push({nome:p.nome,squadra:p.squadra,ruoli:p.ruoli,quota:p.quota,tit:p.tit,ex:p});
  });
  (S.arch||[]).forEach(a=>{
    if(!nrm(a.n).includes(q))return;
    const k=keyOf(a.n,a.s); if(seen[k])return; seen[k]=1;
    out.push({nome:a.n,squadra:a.s,ruoli:a.r,quota:a.q,tit:a.t==null?60:a.t,ex:null});
  });
  return out.slice(0,8);
}
function importText(txt,replace){
  txt=(txt||'').trim(); if(!txt){toast('Non c\'è niente da importare');return}
  if(txt[0]==='{'){
    try{
      const o=JSON.parse(txt); if(!o.players)throw 0;
      if(replace){S=Object.assign(defaults(),o);S.demo=false}
      else{applyRows(o.players.map(p=>({nome:p.nome,squadra:p.squadra,ruoli:p.ruoli,quota:p.quota,tit:p.tit,fascia:p.fascia})),false)}
    }catch(e){toast('JSON non valido');return}
    persist(); renderHeader(); toast('Backup caricato'); go(TAB); return;
  }
  const rows=parseTable(txt)||parseFree(txt);
  if(!rows){toast('Non riconosco il formato: serve una riga di intestazione con Nome e Squadra');return}
  if(replace)S.demo=false;
  archAdd(rows);
  const r=applyRows(rows,replace);
  persist(); renderHeader(); go(TAB);
  toast(r.add+' aggiunti'+(r.upd?' · '+r.upd+' aggiornati':''));
}

/* ---------- indisponibili ---------- */
function matchInj(txt){
  const T=' '+nrm(txt)+' ';
  return S.players.filter(p=>{
    const toks=nrm(p.nome).split(' ').filter(x=>x.length>=4);
    return toks.length&&toks.some(t=>T.includes(' '+t+' '));
  });
}

/* ============================================================
   SHEET: offerta
   ============================================================ */
function bidSheet(p){
  let price=Math.max(1,Math.round(p.quota||1));
  const draw=()=>{
    const c=calc();
    const after=c.rem-price, leftAfter=c.left-1;
    const maxAfter=leftAfter>0?Math.max(0,after-(leftAfter-1)):0;
    const box=bestCasella(p,price), dd=box?price-(+box.cr||0):0;
    const over=price>c.max;
    return `
    <div class="grab"></div>
    <div class="sh-title">${esc(p.nome)}</div>
    <div class="tiny muted" style="margin-top:3px">${rlHTML(p)} ${esc(p.squadra)} · fascia ${p.fascia} · titolarità ${p.tit}% · quota ${fmt(p.quota)}</div>
    ${p.ind?`<div class="banner" style="margin-top:10px">${INDLAB[p.ind]}${p.note?': '+esc(p.note):''}</div>`:''}
    <div class="stepper">
      <button data-d="-5">−5</button><button data-d="-1">−1</button>
      <div class="val num" style="color:${over?'var(--rose)':'var(--paper)'}">${fmt(price)}</div>
      <button data-d="1">+1</button><button data-d="5">+5</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      ${[10,25,50].map(d=>`<button class="btn" data-d="${d}">+${d}</button>`).join('')}
      <button class="btn" data-set="${Math.round(p.quota)}">quota</button>
    </div>
    <div class="simul">
      <div class="line"><span>Se lo prendi, ti restano</span><b class="num" style="color:${after<0?'var(--rose)':'var(--paper)'}">${fmt(after)} cr</b></div>
      <div class="line"><span>Posti ancora vuoti</span><b class="num">${leftAfter}</b></div>
      <div class="line"><span>Nuova offerta massima</span><b class="num">${fmt(maxAfter)}</b></div>
      <div class="line"><span>Media per ogni posto rimasto</span><b class="num">${leftAfter>0?fmt(Math.floor(after/leftAfter)):'—'}</b></div>
      <div class="line" style="margin-top:7px">
        <span>${box?'Andrebbe nella casella '+box.r:'Nessuna casella libera per il suo ruolo'}</span>
        <b class="num">${box?fmt(box.cr)+' previsti':'—'}</b></div>
      ${box?`<div class="line" style="color:${dd>0?'var(--rose)':dd<0?'var(--grass)':'var(--mute)'}">
        <span>Differenza sulla casella</span><b class="num">${dd>0?'+':''}${fmt(dd)}</b></div>`:''}
    </div>
    ${over?`<div class="banner" style="margin-bottom:10px">Sopra il massimo: non ti resterebbe un credito per ogni altro posto da riempire.</div>`:''}
    <button class="btn go full" data-act="io">L'ho preso io a ${fmt(price)}</button>
    <div class="row" style="margin-top:8px">
      <button class="btn" data-act="altri">Preso da altri</button>
      <button class="btn" data-act="x">Chiudi</button>
    </div>`;
  };
  const bind=()=>{
    $$('#sheet [data-d]').forEach(b=>b.addEventListener('click',()=>{price=Math.max(1,price+ +b.dataset.d);upd()}));
    $$('#sheet [data-set]').forEach(b=>b.addEventListener('click',()=>{price=Math.max(1,+b.dataset.set);upd()}));
    $$('#sheet [data-act]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.act;
      if(a==='x'){closeSheet();return}
      assign(p,a==='io',price); closeSheet();
    }));
  };
  const upd=()=>{$('#sheet').innerHTML=draw();bind()};
  openSheet(draw(),bind);
}
function assign(p,mio,price){
  p.stato=mio?'io':'altri'; p.prezzo=price;
  S.log.push({id:p.id,nome:p.nome,prezzo:price,mio,ora:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})});
  let msg=`${short(p.nome)} agli altri`;
  if(mio){
    if(!S.caselle)S.caselle=[];
    let box=casOf(p.id)||bestCasella(p,price);
    if(!box){ box=newCas(p.ruoli[0],price); box.extra=true; S.caselle.push(box) }
    box.pid=p.id;
    const d=price-(+box.cr||0);
    msg=`${short(p.nome)} nella casella ${box.r}: ${d>0?'+':''}${fmt(d)} sul previsto`;
  }
  persist(); renderHeader(); go(TAB); toast(msg);
}
function reset(p){
  p.stato='lib'; p.prezzo=0;
  const box=casOf(p.id);
  if(box){ box.pid=null; if(box.extra) S.caselle=S.caselle.filter(x=>x.id!==box.id) }
  unplace(p.id);
  S.log=S.log.filter(e=>e.id!==p.id);
  persist(); renderHeader(); go(TAB); toast(short(p.nome)+' di nuovo libero');
}
function undo(id){const p=byId(id); if(p)reset(p)}
function unplace(pid){for(const mo in (S.campi||{})){const c=S.campi[mo];for(const k in c) if(c[k]===pid) delete c[k]}}

/* ============================================================
   SHEET: scheda giocatore
   ============================================================ */
function editPlayer(p){
  const isNew=!p;
  const d=p?JSON.parse(JSON.stringify(p)):mkPlayer({});
  const draw=()=>`
    <div class="grab"></div>
    <div class="sh-title">${isNew?'Nuovo giocatore':esc(d.nome)}</div>
    <div class="field" style="margin-top:12px"><div class="lab">Nome${isNew?' — scrivi due lettere e scegli dall\'archivio':''}</div>
      <input class="inp" id="e-n" value="${esc(d.nome)}" autocapitalize="words" autocomplete="off" spellcheck="false">
      <div id="e-sugg"></div>
      ${isNew?`<button class="btn full" id="e-fill" style="margin-top:8px">Compila la scheda dal nome</button>`:''}</div>
    <div class="field"><div class="lab">Squadra</div>
      <input class="inp" id="e-s" value="${esc(d.squadra)}" autocapitalize="words"></div>
    <div class="field"><div class="lab">Ruoli Mantra — il primo decide il reparto</div>
      <div class="chips" id="e-r">${RUOLI.map(r=>`<button class="chip ${d.ruoli.includes(r)?'on':''}" data-r="${r}">${r}</button>`).join('')}</div></div>
    <div class="field"><div class="lab">Fascia di prezzo</div>
      <div class="seg" id="e-f">${[1,2,3].map(f=>`<button data-f="${f}" class="${d.fascia===f?'on':''}">${f} · ${S.fasce[MACRO[d.ruoli[0]]||'C'][f-1].n}</button>`).join('')}</div></div>
    <div class="row">
      <div class="field" style="margin-top:0"><div class="lab">Quotazione o prezzo obiettivo</div>
        <input class="inp num" id="e-q" type="number" inputmode="numeric" value="${d.quota}"></div>
      <div class="field" style="margin-top:0"><div class="lab">Titolarità %</div>
        <input class="inp num" id="e-t" type="number" inputmode="numeric" value="${d.tit}"></div>
    </div>
    <div class="field"><div class="lab">Disponibilità</div>
      <div class="seg" id="e-i">${[['','Disponibile'],['INF','Infortunato'],['SQU','Squalificato'],['DUB','In dubbio']].map(([k,v])=>`<button data-i="${k}" class="${(d.ind||'')===k?'on':''}">${v}</button>`).join('')}</div></div>
    <div class="field"><div class="lab">Note</div><input class="inp" id="e-no" value="${esc(d.note||'')}"></div>
    <button class="btn go full" style="margin-top:14px" id="e-ok">${isNew?'Aggiungi alla lista':'Salva'}</button>
    <div class="row" style="margin-top:8px">
      ${!isNew?`<button class="btn dan" id="e-del">Elimina</button>`:''}
      <button class="btn" id="e-x">Annulla</button>
    </div>`;
  const bind=()=>{
    $$('#e-r .chip').forEach(b=>b.addEventListener('click',()=>{
      const r=b.dataset.r, i=d.ruoli.indexOf(r);
      if(i>=0){ if(d.ruoli.length>1)d.ruoli.splice(i,1) } else d.ruoli.push(r);
      pull(); $('#sheet').innerHTML=draw(); bind();
    }));
    $$('#e-f button').forEach(b=>b.addEventListener('click',()=>{
      d.fascia=+b.dataset.f; pull(); $('#sheet').innerHTML=draw(); bind();
    }));
    $$('#e-i button').forEach(b=>b.addEventListener('click',()=>{
      d.ind=b.dataset.i; pull(); $('#sheet').innerHTML=draw(); bind();
    }));
    $('#e-ok').addEventListener('click',()=>{
      pull();
      if(!d.nome.trim()){toast('Serve almeno il nome');return}
      if(isNew&&!d.squadra&&fill(false))return;   // prima completo dall'archivio, poi salvi
      if(isNew){S.players.push(d)} else {Object.assign(p,d)}
      S.demo=false;
      persist(); renderHeader(); closeSheet(); go(TAB); toast('Salvato');
    });
    $('#e-x').addEventListener('click',closeSheet);
    const nEl=$('#e-n');
    let hits=[];
    const drawSugg=()=>{
      const box=$('#e-sugg'); if(!box)return;
      hits=isNew?lookup(nEl.value):[];
      if(!hits.length){box.innerHTML='';return}
      box.innerHTML=`<div class="plist" style="margin-top:7px">${hits.map((h,i)=>`
        <div class="p" data-sg="${i}">
          <div class="nm"><b>${esc(h.nome)}</b><span>${h.ruoli.map(r=>`<span class="rl ${MACRO[r]}">${r}</span>`).join('')} ${esc(h.squadra)} · tit ${h.tit}%</span></div>
          ${h.ex?`<span class="tag altri">già in lista</span>`:`<div class="qt num">${fmt(h.quota)}</div>`}
        </div>`).join('')}</div>`;
      $$('#e-sugg [data-sg]').forEach(el=>el.addEventListener('click',()=>pick(hits[+el.dataset.sg])));
    };
    const pick=h=>{
      if(h.ex){ editPlayer(h.ex); toast(h.nome+' è già in lista: apro la sua scheda'); return }
      pull();
      d.nome=h.nome; d.squadra=h.squadra; d.ruoli=h.ruoli.slice(); d.quota=h.quota; d.tit=h.tit;
      d.fascia=autoFascia(MACRO[d.ruoli[0]]||'C',d.quota);
      $('#sheet').innerHTML=draw(); bind(); toast('Scheda compilata dall\'archivio');
    };
    const fill=(loud)=>{
      if(!nEl)return false;
      const h=lookup(nEl.value);
      if(h.length){ pick(h[0]); return true }
      if(loud)toast('Nessun nome simile nell\'archivio');
      return false;
    };
    if(nEl&&isNew){
      nEl.addEventListener('input',drawSugg);
      nEl.addEventListener('change',()=>{ if(!d.squadra) fill(false) });
      const fb=$('#e-fill'); if(fb)fb.addEventListener('click',()=>fill(true));
      drawSugg();
    }
    const del=$('#e-del'); if(del)del.addEventListener('click',()=>{
      if(!confirm('Elimino '+p.nome+'?'))return;
      S.players=S.players.filter(x=>x.id!==p.id);
      unplace(p.id);
      persist(); renderHeader(); closeSheet(); go(TAB); toast('Eliminato');
    });
  };
  const pull=()=>{
    d.nome=$('#e-n').value; d.squadra=$('#e-s').value;
    d.quota=Math.max(0,+$('#e-q').value||0); d.tit=Math.min(100,Math.max(0,+$('#e-t').value||0));
    d.note=$('#e-no').value;
  };
  openSheet(draw(),bind);
}

/* ---------- sheet infra ---------- */
function openSheet(html,bind){
  const sh=$('#sheet'); sh.innerHTML=html;
  $('#scrim').classList.add('on'); sh.classList.add('on');
  if(bind)bind();
}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').addEventListener('click',closeSheet);

/* ---------- util ---------- */
const INDLAB={INF:'Infortunato',SQU:'Squalificato',DUB:'In dubbio'};
function indTag(p){return p.ind?`<span class="tag ko">${p.ind}</span>`:''}
function nrm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function keyOf(n,sq){return nrm(n)+'|'+nrm(sq)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function short(n){const p=String(n).split(' ');return p.length>1&&p[0].length>3?p[0][0]+'. '+p.slice(1).join(' '):n}
function initials(n){const p=String(n).trim().split(' ');return (p.length>1?p[0][0]+p[1][0]:p[0].slice(0,2)).toUpperCase()}
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1700)}

/* ---------- router ---------- */
function go(t){
  TAB=t;
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const sc=$('#main').scrollTop;
  ({asta:viewAsta,lista:viewLista,campo:viewCampo,piano:viewPiano,dati:viewDati}[t])();
  $('#main').scrollTop=(t===TAB?sc:0);
  renderHeader();
}
$$('#nav button').forEach(b=>b.addEventListener('click',()=>{$('#main').scrollTop=0;go(b.dataset.t)}));

/* ---------- avvio ---------- */
(async function init(){
  const s=await load();
  if(s&&s.players){ S=Object.assign(defaults(),s) }
  else { S=defaults(); S.demo=false; save() }
  if(!S.caselle||!S.caselle.length){
    genCaselle((S.limits.P+S.limits.D+S.limits.C+S.limits.A)||25);
    mine().forEach(p=>{const b=bestCasella(p,p.prezzo); if(b)b.pid=p.id});
    save();
  }
  go('asta');
})();
</script>
