function endSeason(){
  seasonEnd = false; kitItem('end');
  for (const p of G.players){ ensureHist(p); p.hist.push({s: G.season, club: p.loan==='x' ? p.lo.club : p.ng ? G.club.n + ' NG' : G.club.n, lv: p.loan==='x' ? p.lo.lv : G.lv, pr: p.pr || 0, gl: p.gl || 0, as: p.as || 0}); }
  const L = lvl(), st = standings(), pos = st.findIndex(t => t.id==='me') + 1, n = st.length;
  G.inbox = G.inbox.filter(x => !['renew','offer','fire','phil','plan','ads','naming'].includes(x.t));
  if (L.prize) book('premi', L.prize*(n + 1 - pos));
  for (const p of G.players) if (p.bk > 0){ const a = Math.min(p.bk, p.am); p.bk -= a; book('amm', a); }
  for (const k in G.fac){ const f = G.fac[k]; if (f.own && f.val > 0){ const a = f.val*0.025; f.val -= a; book('ammS', a); } }
  if (G.modVal > 0){ const a = G.modVal*0.08; G.modVal -= a; book('ammS', a); }
  forcedConsolidation();
  G.inbox = G.inbox.filter(x => x.t!=='rientro');
  const tot = () => { const ce = G.fin.ce; return [sum(Object.keys(CE_R).map(k => ce[k] || 0)), sum(Object.keys(CE_C).map(k => ce[k] || 0))]; };
  let [ric, cos] = tot();
  if (ric - cos > 0) book('tasse', (ric - cos)*0.24);
  [ric, cos] = tot();
  const bil = {season: G.season, lv: G.lv, pos, ce: {...G.fin.ce}, ric, cos, ut: ric - cos, cassa: G.fin.cash, diritti: sum(G.players.map(p => p.bk)),
    strutture: facVal(), partecip: satBook(), debiti: debt(), pn: equity(), capIn: G.fin.capIn, tifosi: G.fans.n, abb: G.fans.abb};
  G.bilanci.unshift(bil); if (G.bilanci.length > 30) G.bilanci.pop();
  // promozioni e retrocessioni
  paceWorld(true); mediaSeasonEnd();
  G.ng.lastPos = 0; { const nl = ngLg(); if (nl) G.ng.lastPos = standings(nl).findIndex(t => t.id==='ng') + 1; }
  const prevLv = G.lv;
  let newLv;
  if (TIER[G.lv]){ newLv = worldSeasonEnd(TIER[G.lv], st.map(t => t.id)) ?? 5; }
  else {
    const promo = pos <= L.promo, rel = pos > n - L.rel;
    if (G.lv===5 && promo) G._promotedFromD = true;
    const r = worldSeasonEnd(null, null);
    newLv = r ?? (promo ? G.lv + 1 : rel ? G.lv - 1 : G.lv);
  }
  G.ng.order = null;
  const promo = newLv > prevLv, rel = newLv < prevLv;
  seasonRecord(pos, n, prevLv, newLv, st);
  // giocatori
  G.players.filter(p => p.loan==='x' && p.lo).forEach(p => { p.lo.apps = Math.round(G.md*p.lo.mins*rnd(0.75, 1)); p.lo.goals = p.r==='A' ? Math.round(p.lo.apps*rnd(0.15, 0.45)) : p.r==='C' ? Math.round(p.lo.apps*rnd(0.03, 0.15)) : 0; });
  const coachYoung = G.coach?.pol==='giovani' ? 0.2 : 0, cen = (G.fac.centro.lv*0.08 + mod('palestra')*0.05)*[1, 0.9, 0.7][shareLv('centro')];
  for (const p of G.players){
    p.a++;
    let g;
    if (p.a <= 21) g = (p.p - p.o)*0.28; else if (p.a <= 25) g = (p.p - p.o)*0.18; else if (p.a <= 29) g = rnd(-1, 1.2);
    else if (p.a <= 32) g = -rnd(1, 3); else g = -rnd(2, 5);
    const mins = p.loan==='x' ? (p.lo?.mins || 0.3)*0.4 + normQ(G.staff.gp)*0.05 : p.loan ? 0.25 : Math.min(0.3, p.pr/G.md*0.4);
    if (g > 0) g *= 0.55 + paQ()*0.25 + cen + coachYoung + (G.phil.pol==='giovani' && p.a < 23 ? 0.15 : 0) + mins;
    else g *= 1 - G.fac.centro.lv*0.05;
    p.o = clamp(Math.round(p.o + g), 10, 97); p.p = Math.max(p.p, p.o);
    p.al = clamp(p.al + (p.loan ? 1 : 4) + (p.viv ? 4 : 0), 0, 100);
    p.c--; p.m = 65; p.inj = 0;
    if (p.a >= 36 || (p.a >= 33 && Math.random() < 0.25)) p.ret = true;
  }
  for (const p of G.players){ if (p.promise==='tit' && !p.loan && !p.ng && p.pr < G.md*0.45){ p.m = clamp(p.m - 25, 0, 100); p.list = p.list || Math.random() < 0.5; news(`${p.n} è furioso: gli avevamo promesso il posto da titolare.`, 'neg'); } else if (p.promise==='rot' && !p.loan && p.pr < G.md*0.2){ p.m = clamp(p.m - 12, 0, 100); news(`${p.n} è scontento del poco spazio.`, 'neg'); } }
  loanReport();
  G.players.forEach(p => { if (p.loan==='x'){ p.loan = null; p.lo = null; } });
  const ret = G.players.filter(p => p.ret);
  if (ret.length) news(`Si ritirano: ${ret.map(p => p.n).join(', ')}.`);
  const gone = G.players.filter(p => p.c <= 0 && !p.ret);
  if (gone.length) news(`Contratti scaduti, lasciano la società: ${gone.map(p => p.n).join(', ')}.`);
  ret.forEach(p => { if (p.bk > 0) book('minus', p.bk); });
  G.players = G.players.filter(p => p.c > 0 && !p.ret);
  // vivaio
  const vl = G.fac.vivaio.lv;
  for (const k of G.youth){
    k.a++; k.yrs++;
    k.o = Math.round(Math.min(k.p, k.o + k.p*0.04 + (k.p - k.o)*0.07*(0.35 + rgQ()*0.4 + vl*0.08)*[1, 0.9, 0.75][shareLv('vivaio')]*clamp(fst('istr')/istrNeed(), 0.5, 1)*(1 + Math.max(0, fst('istr') - istrNeed())*0.03)));
    k.al = clamp(k.al + 5 + rgQ()*10 + vl*1.5 + mod('scuola')*3, 0, 100);
  }
  for (const k of G.youth.filter(k => k.a >= 20))
    addItem('promote', 'Resp. settore giovanile', `Fine Primavera: ${k.n}`, `Ha ${k.a} anni ed è cresciuto con noi per ${k.yrs} ${k.yrs===1 ? 'stagione' : 'stagioni'}. Va promosso in prima squadra o lasciato andare.`, {k});
  G.youth = G.youth.filter(k => k.a < 20);
  // contratti commerciali
  for (const k of ['maglia','tecnico']){ const s = G.sponsors[k]; if (s){ s.y--; if (s.y <= 0){ news(`Scaduto lo sponsor ${k==='maglia' ? 'di maglia' : 'tecnico'} ${s.n}.`); G.sponsors[k] = null; } } }
  G.ads.boards.forEach(b => b.y--); G.ads.boards = G.ads.boards.filter(b => b.y > 0);
  if (G.ads.naming){ G.ads.naming.y--; if (G.ads.naming.y <= 0) G.ads.naming = null; }
  // satelliti
  for (const s of G.sats){ const lo = G.players.filter(p => p.loan===s.id).length; s.val = roundFee(s.val*(1 + rnd(-0.06, 0.09) + lo*0.01)); }
  // tifosi
  const F = G.fans;
  if (promo){ F.n = Math.round(F.n*1.2); F.loy = clamp(F.loy + 3, 5, 95); }
  if (rel){ F.n = Math.round(F.n*0.85); F.loy = clamp(F.loy - 5, 5, 95); }
  if (pos <= 3 && !promo) F.n = Math.round(F.n*1.05);
  G.pres.wealth = Math.round(G.pres.wealth + 40000);
  if (TIER[newLv] && equity() < 0){ G.penNext = 3; news('Patrimonio netto negativo: senza ricapitalizzazione prima della nuova stagione arrivano 3 punti di penalizzazione.', 'neg'); }
  G.lv = newLv;
  const summary = {season: G.season, pos, n, promo, rel, prevLv, bil, ngPos: G.ng.lastPos};
  G.season++;
  seasonStart();
  G.lastSummary = summary;
  save(); render();
  /* il riepilogo animato di fine stagione sostituisce la vecchia scheda */
}

// =================== STRUTTURE, EVENTI, SATELLITI, NEXT GEN ===================
function facAction(k, act){
  const f = G.fac[k], d = FAC[k];
  if (act==='up' || act==='down'){
    const nl = f.lv + (act==='up' ? 1 : -1);
    if (nl < 0 || nl > 5) return;
    if (k==='ristoro' && nl > stadLv() + 1){ toast('Prima serve uno stadio più grande'); return; }
    if (f.own || d.own){
      if (act==='down'){ toast('Una struttura di proprietà non si ridimensiona: puoi venderla'); return; }
      const cost = roundFee((d.buy[nl] - d.buy[f.lv])*1.1);
      if (G.fin.cash - cost < -fido()){ toast('Liquidità insufficiente per i lavori'); return; }
      if (!budgetGuard('fac', cost, () => facAction(k, act))) return;
      G.fin.cash -= cost; f.val += cost; f.lv = nl; f.own = true;
      news(`Lavori conclusi: ${d.n.toLowerCase()} ora è “${d.lv[nl]}” (${eur(cost)}).`, 'pos');
    } else {
      f.lv = nl;
      news(`Nuovo contratto d’affitto: ${d.n.toLowerCase()} “${d.lv[nl]}”, ${eur(d.rent[nl])} all’anno.`);
    }
  } else if (act==='buy'){
    const cost = d.buy[f.lv];
    if (G.fin.cash - cost < -fido()){ toast('Liquidità insufficiente per l’acquisto'); return; }
    if (!budgetGuard('fac', cost, () => facAction(k, act))) return;
    G.fin.cash -= cost; f.own = true; f.val = cost;
    news(`Acquistato ${d.n.toLowerCase()} per ${eur(cost)}.`, 'pos');
  } else if (act==='sell'){
    const v = roundFee(f.val*rnd(0.85, 1));
    G.fin.cash += v; if (v >= f.val) book('plus', v - f.val); else book('minus', f.val - v);
    f.own = false; f.val = 0; f.out = false;
    if (d.own){ f.lv = 0; }
    news(`Venduto ${d.n.toLowerCase()} per ${eur(v)}.${d.own ? '' : ' Ora lo usiamo in affitto.'}`);
  } else if (act.startsWith('out')){ f.out = +act.slice(3) || 0; news(f.out ? `${d.n}: ${SHARE[k][f.out].n.toLowerCase()} (+${eur(facIncome(k))} all’anno).` : `${d.n}: torna a uso esclusivo.`); }
  save(); rerenderFac();
}
function doEvent(k){
  const e = EVENTS[k], F = G.fans, L = lvl();
  const cost = r50(e.c*L.s);
  if (G.fin.cash - cost < -fido()){ toast('Liquidità insufficiente'); return; }
  if (!budgetGuard('ev', cost, () => doEvent(k))) return;
  book('eventiC', cost);
  if (e.fans){ F.n = Math.round(F.n*(1 + e.fans*Math.max(0.1, 1 - F.n/L.fanCap))); F.boost += e.fans/6; }
  if (e.loy) F.loy = clamp(F.loy + e.loy, 5, 95);
  let rev = 0;
  if (e.rev){ rev = Math.round(cost*e.rev*(0.6 + F.loy/100)*clamp(fanFactor(), 0.6, 1.5)); book('eventi', rev); }
  if (e.once) F.club = true;
  F.cd[k] = T() + (e.cd || 999);
  if (e.talent && Math.random() < 0.35) talentReport({q: 2, n: 'Open day'}, 'affil');
  news(`${e.n}: ${eur(cost)} di spesa${rev ? ', incasso ' + eur(rev) : ''}.`, 'pos');
  save(); render();
}
function eventAvail(k){
  const e = EVENTS[k];
  if (e.once && G.fans.club) return 'Già fatto';
  if (G.fans.cd[k] && G.fans.cd[k] > T()) return `Di nuovo tra ${G.fans.cd[k] - T()} settimane`;
  if (e.pre && G.week > 3) return 'Solo in preparazione';
  if (e.late && G.week < G.W - 5) return 'Solo a fine stagione';
  if (e.tour && !(G.fac.stadio.own && G.fac.stadio.lv >= 3)) return 'Serve uno stadio di proprietà';
  return '';
}
function buySat(id){
  const o = G.satOffers.find(x => x.id===id); if (!o) return;
  if (G.fin.cash - o.val < -fido()){ toast('Liquidità insufficiente'); return; }
  G.fin.cash -= o.val;
  G.sats.push({id: o.id, n: o.n, c: o.c, lg: o.lg, str: o.str, val: o.val, cost0: o.val, cost: o.cost, tal: o.tal});
  G.satOffers = G.satOffers.filter(x => x!==o);
  news(`Acquistato il club satellite ${o.n} (${o.c}) per ${eur(o.val)}.`, 'pos');
  save(); render();
}
function sellSat(id){
  const s = G.sats.find(x => x.id===id); if (!s) return;
  G.fin.cash += s.val; if (s.val >= s.cost0) book('plus', s.val - s.cost0); else book('minus', s.cost0 - s.val);
  G.players.forEach(p => { if (p.loan===s.id) p.loan = null; });
  G.sats = G.sats.filter(x => x!==s);
  news(`Venduto il club satellite ${s.n} per ${eur(s.val)}.`);
  save(); render();
}
const ngAllowed = () => G.lv >= 7 && G.fac.vivaio.lv >= 3;
function registerNG(){
  if (!ngAllowed() || G.ng.on || G.week > 3) return;
  const fee = 1200000;

function dissolveNG(){

const LSKEY = 'presidente.save.v2', LSKEY1 = 'presidente.save.v1';
let dbRef = null, saveT = null, saving = false, pendingSave = false;
function save(){
  if (!G) return;
  G.savedAt = Date.now();
  const json = JSON.stringify(G);
  try{ localStorage.setItem(LSKEY, json); localStorage.setItem(SLOTK(G.slot ?? 0), json); localStorage.setItem('presidente.last', String(G.slot ?? 0)); }catch(e){}
  clearTimeout(saveT);
  saveT = setTimeout(() => cloudSave(), 1200);
}
async function cloudSave(){
  if (!dbRef || !G) return;
  if (saving){ pendingSave = true; return; }
  saving = true;
  try{ await dbRef.set({savedAt: G.savedAt, json: JSON.stringify(G)}); }catch(e){}
  saving = false;
  if (pendingSave){ pendingSave = false; cloudSave(); }
}
function loadLocal(){
  try{ const s = localStorage.getItem(LSKEY) || localStorage.getItem(LSKEY1); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}
async function initCloud(){
  try{
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'), user = await window.claude.use('user');

        + opt(it.id, 'p36', `Rientro in 36 mesi · rata ${eur(o36.rata)}`, `rate leggere ma interessi ${eur(o36.rata*36 - o36.E)}`)
        + opt(it.id, 'cap', `Ricapitalizzi tu: ${eur(need)}`, `Dal tuo patrimonio (${eur(G.pres.wealth)}): nessun vincolo con la banca`)
        + opt(it.id, 'sell', 'Cessioni concordate', 'Il DS vende al 75% del valore, prima chi non gioca, finché il conto torna in positivo'); break; }
    case 'kit': body = `<div style="display:flex;justify-content:center">${kitSVG()}</div>` + opt(it.id, 'open', 'Personalizza la maglia', 'Colori, disegno e colletto', true) + opt(it.id, 'ok', 'Va bene così', 'Teniamo la maglia attuale'); break;

  return `<div class="card meet ${it.urgent ? 'urgent' : ''}"><div class="from">${esc(it.from)}</div><h3>${esc(it.title)}</h3><div class="small">${esc(it.txt)}</div>${body}${exp}</div>`;

function cashChart(){
  const h = G.fin.hist.slice(-24);
  if (h.length < 2) return '<p class="muted small">Il grafico compare dopo i primi mesi.</p>';
  const W = 320, H = 140, pad = 8, vals = h.map(x => x.c), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
  const X = i => pad + i*(W - pad*2)/(h.length - 1), Y = v => H - pad - (v - mn)*(H - pad*2)/(mx - mn || 1);
  const path = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento della cassa">
    <line x1="${pad}" x2="${W - pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>

    <div class="sub">Ultimi ${h.length} mesi · minimo ${eur(Math.min(...vals))} · massimo ${eur(Math.max(...vals))}</div>`;
}

const TIERLV = {A: 8, B: 7, C: 6};
function mkWL(k){
  const teams = G.world[k].map(blankStats);
  teams.forEach(t => { if (t.id==='ng') t.n = G.club.n + ' Next Gen'; if (t.id==='me') t.n = G.club.n; });
  return {teams, sched: roundRobin(teams.map(t => t.id).sort(() => Math.random() - .5)), lv: TIERLV[k], played: 0};
}
function mkWorldLeagues(){ G.wl = {}; for (const k of ['A','B','C']) if (TIER[G.lv]!==k) G.wl[k] = mkWL(k); }
const leagueOf = k => TIER[G.lv]===k ? G.league : (G.wl || {})[k];
const ngLg = () => G.ng.on && G.wl && G.wl.C ? G.wl.C : null;
function paceWorld(force){
  if (!G.wl) return;
  for (const lg of Object.values(G.wl)){
    const target = force ? lg.sched.length : Math.floor(clamp((G.week - 3)/G.md, 0, 1)*lg.sched.length);
    while (lg.played < target){ lg.played++; playRound(lg, lg.played, lg.teams.some(t => t.id==='ng') ? 'ng' : 'world'); }
  }
}
function findTeamAny(id){ for (const lg of [G.league, ...Object.values(G.wl || {})]){ const t = lg.teams.find(x => x.id===id); if (t) return {t, lg}; } return null; }
function recordGoals(lg, tid, n){
  const out = [];
  if (lg.lv < 6 || !n || tid==='me') return out;
  const k = {8:'A', 7:'B', 6:'C'}[lg.lv], team = teamById(tid, lg);
  let list = tid==='ng' ? G.players.filter(p => p.ng) : rosterOf(team, lg.lv);
  list = list.slice().sort((a, b) => b.o - a.o).slice(0, 14);
  if (!list.length) return out;
  const w = list.map(p => (p.r==='A' ? 5 : p.r==='C' ? 2.2 : p.r==='D' ? 0.6 : 0.02)*Math.pow(Math.max(1, p.o - 60), 2));
  for (let i = 0; i < n; i++){
    let r = Math.random()*sum(w), j = 0; while (j < w.length - 1 && r > w[j]){ r -= w[j]; j++; }
    const p = list[j], key = String(p.id);
    const e = G.scorers[k][key] || (G.scorers[k][key] = {n: p.n, t: team.n, g: 0});
    e.g++; out.push(p.n);
  }
  return out;
}
function worldTransfer(){
  const pool = NAMED.filter(x => !G.takenN.includes(x.nid)).map(x => ({x, p: namedNow(x)})).filter(y => y.p && y.p.o >= 74);
  if (!pool.length) return;
  const w = pool.map(y => Math.pow(y.p.o - 72, 2));
  let r = Math.random()*sum(w), j = 0; while (j < w.length - 1 && r > w[j]){ r -= w[j]; j++; }
  const {x, p} = pool[j], from = namedTeamOf(x);
  const all = ['A','B'].flatMap(k => G.world[k]).filter(t => t.id!=='me' && t.id!=='ng' && t.n!==from);
  const fromT = ['A','B','C'].flatMap(k => G.world[k]).find(t => t.n===from);
  const cands = all.filter(t => t.str >= (fromT ? fromT.str : 75) - 1.5);
  if (!cands.length) return;
  const to = pick(cands), fee = roundFee(valueOf(p)*rnd(0.9, 1.3));
  G.moves[x.nid] = to.n;
  const adj = (name, d) => { for (const lg of [G.league, ...Object.values(G.wl || {})]) { const t = lg.teams.find(y => y.n===name); if (t) t.str += d; } for (const k of ['A','B','C']) { const t = G.world[k].find(y => y.n===name); if (t) t.str += d; } };
  adj(to.n, 0.12); adj(from, -0.12);
  if (Math.random() < 0.6) media('fab', `${p.n} → ${to.n}! Accordo totale con ${from} per ${eur(fee)}. Here we go!`);
  else media(pick(['sky','tmw','gaz']), `Ufficiale: ${p.n} lascia ${from} e firma con ${to.n} (${eur(fee)}).`);
}
function mediaWeek(){
  const A = leagueOf('A');
  if (A && A.lastRound && A.lastRound.length && A.lastWeek!==G.week){
    A.lastWeek = G.week;
    const big = A.lastRound.slice().sort((a, b) => b.s - a.s)[0];
    media('dazm', `${big.h} ${big.gh}–${big.ga} ${big.a}${big.sc.length ? '. In gol: ' + big.sc.join(', ') : ''}.`);
    const goleada = A.lastRound.find(x => Math.abs(x.gh - x.ga) >= 4);
    if (goleada && goleada!==big && Math.random() < 0.6) media('gaz', `Goleada: ${goleada.h} ${goleada.gh}–${goleada.ga} ${goleada.a}.`);
  }
  const md = matchdayOf(G.week);
  if (A && md && md % 4===0){
    const st = standings(A), gap = st[0].pts - st[1].pts;
    media('sky', `Serie A: ${st[0].n} in testa con ${st[0].pts} punti${gap > 0 ? ', +' + gap + ' su ' + st[1].n : ', a pari punti con ' + st[1].n}. In coda soffre ${st[st.length-1].n}.`);
    const top = Object.values(G.scorers.A).sort((a, b) => b.g - a.g)[0];
    if (top && Math.random() < 0.5) media('gaz', `Capocannoniere: ${top.n} (${top.t}) a quota ${top.g}.`);
  }
  if (A && md > 8 && md < G.md - 5 && Math.random() < 0.04){
    const last = standings(A).slice(-4); const t = pick(last);
    media('sky', `Esonero a sorpresa: ${t.n} cambia allenatore per cercare la scossa.`);
    t.str += 0.6;
  }
  if (marketOpen()){
    const n = G.week <= 3 ? ri(1, 3) : ri(0, 2);
    for (let i = 0; i < n; i++) worldTransfer();
    if (Math.random() < 0.35){
      const x = pick(NAMED), p = namedNow(x); if (p && p.o >= 78){ const to = pick(G.world.A.filter(t => t.n!==namedTeamOf(x) && t.id!=='me'));
        media(pick(['tmw','sky']), `Contatti tra ${to.n} e ${namedTeamOf(x)} per ${p.n}: si tratta.`); }
    }
  }
}
function mediaSeasonEnd(){
  const A = leagueOf('A'), B = leagueOf('B');
  if (A){ const st = standings(A); media('sky', `${st[0].n} campione d’Italia con ${st[0].pts} punti! Retrocedono ${st.slice(-3).map(t => t.n).join(', ')}.`); }
  if (B){ const st = standings(B); media('gaz', `Serie B: salgono in A ${st.slice(0, 3).map(t => t.n).join(', ')}.`); }
  const top = Object.values(G.scorers.A || {}).sort((a, b) => b.g - a.g)[0];

}

function chatCmd(cmd){
  if (chatTyping) return;
  const label = (CHAT_MAIN.find(x => x[0]===cmd) || []).at?.(1) || (G.chat.slice().reverse().find(m => m.o)?.o || []).find(x => x[0]===cmd)?.[1] || cmd;
  if (cmd==='goto'){ closeChat(); tab = 'riunioni'; render(); return; }
  meSay(label.replace(/^\S+\s/, m => /\p{Extended_Pictographic}/u.test(m) ? '' : m));
  chatTyping = true; renderChat();
  setTimeout(() => { chatTyping = false; try { dsReply(cmd); } catch(e){ dsSay('Mi scusi presidente, non ho capito.'); } save(); if (chatOpen) renderChat(); }, 650 + Math.random()*500);
}
function startNegInline(pid){ G.neg = {kind: 'buy', round: 0, pid}; negIntro(); }
function replanOpt(){ return marketOpen() ? [['replan','Sì, rifai il piano'],['ok','No, va bene così']] : null; }
function dsReply(cmd){
  const B = G.budget, L = lvl(), step = Math.max(L.salFloor*2, 500);
  const [c, arg, arg2] = cmd.split(':');
  if (c==='n'){ negCmd(arg, arg2); return; }
  if (c==='neg' || c==='trat'){ startTrat(arg); dsSay('Apro la trattativa, presidente.'); return; }
  const sq = squad(), wages = monte();
  switch (c){
    case 'budget':
      dsSay(`Budget acquisti ${eur(B.t)}, tetto ingaggi ${eur(B.w)} (oggi siamo a ${eur(wages)}). In cassa abbiamo ${eur(G.fin.cash)} e un fido di ${eur(fido())}. Cosa facciamo?`, [['bt+','Alza il budget del 25%'],['bt-','Abbassa il budget del 25%'],['bw+','Alza il tetto ingaggi del 15%'],['bw-','Abbassa il tetto ingaggi del 15%']]);
      break;
    case 'bt+': case 'bt-': case 'bw+': case 'bw-': {
      const up = c.endsWith('+'), key = c[1]==='t' ? 't' : 'w';
      const f = key==='t' ? (up ? 1.25 : 0.75) : (up ? 1.15 : 0.85);
      B[key] = Math.max(0, roundFee(up ? Math.max(B[key]*f, B[key] + step) : B[key]*f));
      const risky = key==='t' && B.t > G.fin.cash + fido()*0.5;
      dsSay(`${up ? 'Ricevuto' : 'D’accordo'}: ${key==='t' ? 'budget acquisti' : 'tetto ingaggi'} a ${eur(B[key])}.${risky ? ' Glielo dico onestamente: è più della liquidità che abbiamo, se spendo tutto finiamo sul fido.' : ''}${marketOpen() && pending('plan') ? ' Vuole che rifaccia il piano?' : ''}`, marketOpen() && pending('plan') ? replanOpt() : null);
      break; }
    case 'goal':
      dsSay('Su cosa puntiamo quest’anno?', [['g:promozione','Vertice'],['g:meta','Metà classifica'],['g:salvezza','Salvezza']]); break;
    case 'g':
      B.goal = arg;
      dsSay(arg==='promozione' ? 'Allora si alza l’asticella: cercherò titolari veri, non rincalzi.' : arg==='salvezza' ? 'Capito, prudenza: solo innesti mirati e conti in ordine.' : 'Bene, equilibrio: miglioriamo dove serve senza follie.', replanOpt());
      break;
    case 'plan':
      if (!marketOpen()){ dsSay(`Il mercato è chiuso, riapre ${G.week < winterStart() ? 'alla settimana ' + winterStart() : 'a inizio stagione'}. Intanto tengo d’occhio i nomi. Come lo vuole il prossimo piano?`, [['mode:all','Acquisti e cessioni'],['mode:sell','Solo cessioni'],['mode:buy','Solo acquisti'],['age:young','Solo giovani'],['age:exp','Gente d’esperienza'],['age:any','Nessun vincolo d’età']]); break; }
      dsSay(`Il piano attuale: ${({all:'acquisti e cessioni', sell:'solo cessioni', buy:'solo acquisti'})[B.mode || 'all']}, ${({any:'nessun vincolo d’età', young:'solo giovani', exp:'giocatori esperti'})[B.age || 'any']}. Come lo vuole?`, [['replan','Rifallo da capo'],['mode:all','Acquisti e cessioni'],['mode:sell','Solo cessioni'],['mode:buy','Solo acquisti'],['age:young','Solo giovani'],['age:exp','Gente d’esperienza'],['age:any','Nessun vincolo d’età']]);
      break;
    case 'mode': B.mode = arg; dsSay(arg==='sell' ? 'Va bene, niente acquisti: alleggerisco la rosa.' : arg==='buy' ? 'Ok, non tocco nessuno: penso solo agli acquisti.' : 'Perfetto, lavoro su entrambi i fronti.', replanOpt()); break;
    case 'age': B.age = arg; dsSay(arg==='young' ? 'Solo giovani: cerco ragazzi fino a 23 anni con margini.' : arg==='exp' ? 'Esperienza: gente dai 27 anni in su, pronta subito.' : 'Nessun vincolo, prendo il migliore per il ruolo.', replanOpt()); break;
    case 'replan':
    {
      G.inbox = G.inbox.filter(x => x.t!=='plan');
      const keepSay = SAY; SAY = null; dsPlan(G.week > 3); SAY = keepSay;
      const pl = G.inbox.find(x => x.t==='plan');
      if (!pl){ dsSay(`Ho guardato bene: con tetto ${eur(B.w)} e cartellini ${eur(Math.max(0, B.t - (B.spentT || 0)))} non vedo operazioni utili. Se vuole alzi il budget in Finanze e ci riprovo.`, [['budget','Parliamo di budget'],['ok','Va bene']]); break; }
      const d = pl.d, nb = d.buys.length, ns = d.sells.length, np = (d.promos || []).length, spend = sum(d.buys.map(b => b.f)), wIn = sum(d.buys.map(b => b.s)), wOut = sum(d.sells.map(x => { const p = G.players.find(q => q.id===x.pid); return p ? p.s : 0; }));
      const names = d.buys.slice(0, 3).map(b => { const m = findMarket(b.pid); return m ? m.p.n + ' (' + ROLES[m.p.r].toLowerCase() + ')' : null; }).filter(Boolean);
      dsSay(`Fatto, presidente. ${d.off ? 'Il mercato è chiuso, quindi solo svincolati e cessioni: ' : ''}${nb} ${nb===1 ? 'acquisto' : 'acquisti'}${names.length ? ' (' + names.join(', ') + (nb > 3 ? '…' : '') + ')' : ''}, ${ns} ${ns===1 ? 'uscita' : 'uscite'}${np ? ' e ' + np + ' ragazzi dal vivaio' : ''}. Spendiamo ${eur(spend)} di cartellini e il monte ingaggi passa a ${eur(monte() - wOut + wIn)} su ${eur(B.w)}. Lo vuole vedere?`, [['openplan','Apri il piano'],['planall','Approva tutto'],['ok','Dopo']]);
      break; }
    case 'planall': { const pl = G.inbox.find(x => x.t==='plan'); if (!pl){ dsSay('Non ho piani in sospeso, presidente.'); break; } const n0 = G.players.length; decide(pl.id, 'all'); dsSay(`Eseguito. La rosa ora conta ${G.players.length} giocatori${G.players.length!==n0 ? ` (${G.players.length - n0 >= 0 ? '+' : ''}${G.players.length - n0})` : ''}, monte ingaggi ${eur(monte())}.`); break; }
    case 'ok': dsSay(pick(['Perfetto presidente.','Ricevuto.','Come vuole lei.'])); break;
    case 'find':
      dsSay('Che ruolo le serve?', [['f:P','Portiere'],['f:D','Difensore'],['f:C','Centrocampista'],['f:A','Attaccante']]); break;
    case 'f': {
      if (!marketOpen()){ dsSay('Il mercato è chiuso: le faccio i nomi alla riapertura.'); break; }
      G.chatSkip = G.chatSkip || [];
      const style = G.coach ? G.coach.style : G.phil.style, room = B.w - wages + L.salFloor;
      const c2 = marketList().filter(({p}) => p.r===arg && !G.chatSkip.includes(String(p.id)) && (B.age!=='young' || p.a <= 23) && (B.age!=='exp' || p.a >= 27))
        .map(x => ({...x, f: askPrice(x.p, x.src), s: demandWage(x.p), ev: estO(x.p) + (PREF[style][x.p.prof] ?? -1)}))
        .filter(x => x.f <= Math.max(B.t, 0) && x.s <= room).sort((a, b) => b.ev - a.ev);
      const best = c2[0];
      if (!best){ dsSay(`Con ${eur(B.t)} di budget e questo tetto ingaggi non trovo un ${ROLES[arg].toLowerCase()} che ci migliori. Se vuole alzare il budget, ne riparliamo.`, [['bt+','Alza il budget del 25%'],['bw+','Alza il tetto ingaggi del 15%']]); break; }
      G.chatSkip.push(String(best.p.id));
      const [lo, hi] = estRange(best.p), fit = (PREF[style][best.p.prof] ?? -1) >= 2;
      dsSay(`Ho in mente ${best.p.n}, ${best.p.a} anni, in forza a ${best.p.club}. I nostri osservatori lo valutano ${lo}–${hi}, profilo ${PROFILES[best.p.prof].toLowerCase()}${fit ? ', perfetto per il mister' : ''}. Chiedono ${best.f ? eur(best.f) : 'niente, è svincolato'} e lui vuole ${eur(best.s)} all’anno.`, [['trat:' + best.p.id,'Trattiamo'],['f:' + arg,'Cercane un altro']]);
      break; }
    case 'buy': {
      const m = findMarket(arg);
      if (!m){ dsSay('È già sfumato, presidente.'); break; }
      const f = askPrice(m.p, m.src), n0 = G.players.length;
      buyPlayer(m.p, m.src, f);
      if (G.players.length > n0){ B.spentT = (B.spentT || 0) + f; dsSay(`Chiuso! ${m.p.n} è nostro. Budget residuo ${eur(Math.max(0, B.t - B.spentT))}.`); }
      else dsSay(`Niente da fare: ${G.news[0] ? G.news[0].t : 'la trattativa è saltata.'}`);
      break; }
    case 'squad': {
      const lg = G.league.teams.filter(t => t.id!=='me' && t.id!=='ng'), opp = mean(lg.map(t => t.str)), s = myStrength();
      const style = G.coach ? G.coach.style : G.phil.style, form = FORMS[style];
      const xi = bestXI(), byR = r => xi.filter(p => p.r===r);
      const weak = ['P','D','C','A'].map(r => [r, mean(byR(r).map(p => p.ev))]).filter(x => !isNaN(x[1])).sort((a, b) => a[1] - b[1])[0];
      const fit = sq.filter(p => profFit(p, style) >= 2).length;
      dsSay(`Siamo a ${s.toFixed(0)} di forza contro una media di ${opp.toFixed(0)} in ${L.n}: ${s > opp + 3 ? 'possiamo comandare' : s > opp ? 'siamo nella parte alta' : s > opp - 3 ? 'siamo da metà classifica' : 'rischiamo'}. Il reparto più debole è ${weak ? {P:'la porta', D:'la difesa', C:'il centrocampo', A:'l’attacco'}[weak[0]] : '—'}. Per il ${form.m} del mister abbiamo ${fit} giocatori col profilo giusto su ${sq.length}.`);
      break; }
    case 'coach': {
      const c2 = G.coach;
      if (!c2){ dsSay('Siamo senza allenatore, le ho portato tre nomi: li trovi nelle notifiche.', [['goto','Apri']]); break; }
      const r5 = G.results.slice(-5), pts = sum(r5.map(r => r.gf > r.ga ? 3 : r.gf===r.ga ? 1 : 0));
      dsSay(`${c2.n} ${c2.mood > 65 ? 'è sereno' : c2.mood > 35 ? 'è un po’ teso' : 'è molto nervoso, potrebbe lasciarci'}. ${r5.length ? `Ultime ${r5.length}: ${pts} punti.` : ''} Con la nostra filosofia la sintonia è ${fitScore() >= 2 ? 'ottima' : fitScore() >= 1 ? 'buona' : 'scarsa'}. ${pts <= 3 && r5.length===5 ? 'Se continua così valuterei un cambio.' : 'Per me va confermato.'}`);
      break; }
    case 'young': {
      const kids = G.youth.slice().sort((a, b) => kidPotRange(b)[1] - kidPotRange(a)[1]).slice(0, 3);
      const yp = sq.filter(p => p.a <= 21).sort((a, b) => potRange(b)[1] - potRange(a)[1]).slice(0, 2);
      dsSay(`${kids.length ? 'Nel vivaio: ' + kids.map(k => `${k.n} (${k.a} anni, ${catOf(k.a).n.toLowerCase()}, potenziale ${kidPotRange(k).join('–')})`).join('; ') + '.' : 'Il vivaio è vuoto, servono affiliazioni e un centro giovanile migliore.'} ${yp.length ? 'In prima squadra crescono bene ' + yp.map(p => `${p.n} (${p.a})`).join(' e ') + '.' : ''}`);
      break; }
    case 'sell': {
      const xi = new Set(bestXI().map(p => p.id));
      const out = sq.filter(p => !xi.has(p.id)).sort((a, b) => (a.o - a.s/Math.max(1, L.salFloor)) - (b.o - b.s/Math.max(1, L.salFloor))).slice(0, 3);
      if (!out.length){ dsSay('Non vedo esuberi, la rosa è corta così.'); break; }
      G.chatSell = out.map(p => p.id);
      dsSay(`Io cederei ${out.map(p => `${p.n} (${p.a} anni, ${eur(p.s)}/anno, valore ${eur(valueOf(p))})`).join(', ')}. Non giocano e pesano sul monte ingaggi.`, [['list3','Mettili tra i cedibili'],['ok','Lascia stare']]);
      break; }
    case 'list3': (G.chatSell || []).forEach(id => { const p = G.players.find(x => x.id===id); if (p) p.list = true; }); dsSay('Fatto, li propongo in giro. Le porto le offerte nelle notifiche.'); break;
    default: dsSay('Mi dica, presidente.');
  }
}

function ensureFac(o){
  o.dsDir = Object.assign({}, DIR0, o.dsDir || {}); if (o.staff && o.staff.ds && !o.staff.ds.trait) o.staff.ds.trait = 'equilibrato'; o.budget.fac = o.budget.fac ?? 0; o.budget.ev = o.budget.ev ?? 0;
  if (o.mods) return o;
  o.mods = {}; o.pitch = 60; o.modVal = 0;
  o.fstaff = {giard: o.lv >= 6 ? 3 : o.lv >= 3 ? 2 : 1, fisio: o.lv >= 6 ? 1 : 0, istr: Math.max(1, Math.min(5, Math.ceil((o.youth || []).length/4))), comm: o.lv >= 6 ? 1 : 0, custode: o.lv >= 4 ? 1 : 0};
  if (o.lv >= 6){ o.mods.luci = 2; o.mods.manto = 2; }
  return o;
}
function migrate3(o){
  if (o.v >= 3) return o;
  G = o;
  o.v = 3; o.media = o.media || []; o.chat = o.chat || []; o.chatUnread = 0; o.moves = o.moves || {}; o.takenN = o.takenN || [];
  o.scorers = {A: {}, B: {}, C: {}}; o.era = o.lv >= 6 ? o.season : null;
  o.budget.mode = o.budget.mode || 'all'; o.budget.age = o.budget.age || 'any';
  if (o.ng) delete o.ng.league;
  mkWorldLeagues(); paceWorld(false);
  return o;
}

let SAY = null, typingCtx = null, sheetItem = null;
function tSay(th, f, t, o){ th.push({f, t, w: G.week, s: G.season, o: o || null}); if (th.length > 80) th.shift(); }
function doneItem(id){ const it = G.inbox.find(x => x.id===id); if (it){ it.done = true; it.doneW = G.week; } }
function withItem(it, fn){
  const pS = SAY, pN = G.neg; SAY = it.chat = it.chat || []; G.neg = it.neg || null;
  try { fn(); } finally { if (G.inbox.includes(it)) it.neg = G.neg; SAY = pS; G.neg = pN; }
}
const PLAN_QR = [['budget','Budget'],['goal','Obiettivo'],['plan','Impostazione'],['replan','Rifai il piano']];
function qrHTML(list, ctx){ return `<div class="qr">${list.map(([c, l]) => `<button data-act="reply" data-arg="${ctx}|${c}" ${typingCtx ? 'disabled' : ''}>${l}</button>`).join('')}</div>`; }
function scrollThreads(){ document.querySelectorAll('.thread').forEach(t => { t.scrollTop = t.scrollHeight; }); }
function sheetCard(it){ return `<div class="isheet"><div class="phead"><button class="xbtn" data-act="close" aria-label="Chiudi">✕</button></div>${meetCard(it)}${CHAIN ? queueBar(it) : ''}</div>`; }
// decisioni sul posto: niente salti nelle Riunioni
function nextOpen(afterId){ const q = openQueue(); if (!q.length) return null; const i = q.findIndex(x => x.id===afterId); return i >= 0 ? (q[i + 1] || null) : (q.find(x => !x.read) || q[0]); }
function queueBar(it){
  const q = openQueue(), i = q.findIndex(x => x.id===it.id), nx = i >= 0 ? q[i + 1] : q.find(x => x.id!==it.id);
  if (!nx && i < 0) return '';

}
let CHAIN = false;
function qaccShow(){ const b = document.querySelector('#sheet .qacc'); if (!b) return; const t = document.querySelector('#sheet .opt.pri, #sheet .cand .btn.pri'); b.style.display = t ? '' : 'none'; }
function openItemHere(it, chain = false){
  if (!it) return; CHAIN = chain;
  openModal(`<div class="isheet"><div class="phead"><button class="xbtn" data-act="close" aria-label="Chiudi">✕</button></div>${meetCard(it)}${chain ? queueBar(it) : ''}</div>`, 'tall');
  sheetItem = it.id; it.read = true; G.newItems = 0; save(); render(); scrollThreads(); qaccShow();
}
function inPlace(fn){
  const before = Math.max(0, ...G.inbox.map(x => x.id));
  fn();
  const it = G.inbox.filter(x => x.id > before && !x.done)[0];
  if (it) openItemHere(it); else { save(); render(); }
}

function rerender(){
  render();
  if (sheetItem && !$('modal').classList.contains('hidden')){ const it = G.inbox.find(x => x.id===sheetItem);
    if (!it || it.done){ const nx = CHAIN ? openQueue()[0] : null; if (nx) openItemHere(nx, true); else { closeModal(); toast('Fatto'); } return; }
    $('sheet').innerHTML = sheetCard(it); qaccShow(); }
  scrollThreads();
}
function replyTo(ctx, cmd){
  if (typingCtx) return;
  const isG = ctx==='g', it = isG ? null : G.inbox.find(x => x.id===+ctx);
  if (cmd==='arch'){ G.inbox = G.inbox.filter(x => x!==it); closeModal(); save(); render(); return; }
  const th = isG ? G.chat : it && it.chat; if (!th) return;
  if (cmd==='goto'){ if (it) { $('sheet').innerHTML = sheetCard(it); sheetItem = it.id; scrollThreads(); } return; }
  if (cmd==='arch'){ G.inbox = G.inbox.filter(x => x!==it); closeModal(); save(); render(); return; }
  if (it && (it.t==='staff' || it.t==='coach') && cmd==='n:stop'){ it.chat = []; it.neg = null; save(); rerender(); return; }
  const lastO = th.slice().reverse().find(m => m.o);
  const lab = (lastO && (lastO.o.find(x => x[0]===cmd) || [])[1]) || ((CHAT_MAIN.concat(PLAN_QR)).find(x => x[0]===cmd) || [])[1] || cmd;
  tSay(th, 'me', lab.replace(/^[^\p{L}\p{N}€]+/u, '').trim());
  typingCtx = String(ctx); rerender();
  setTimeout(() => {
    typingCtx = null;
    try {
      if (isG){ SAY = null; dsReply(cmd); }
      else withItem(it, () => { if (cmd.startsWith('n:')){ const [, a, v] = cmd.split(':'); negCmd(a, v); } else dsReply(cmd); });
    } catch(e){ console.error(e); }
    if (it && (it.t==='trat' || it.t==='emerg' || it.t==='loanout') && !it.neg && !it.done) doneItem(it.id);
    save(); rerender();
  }, RM() ? 120 : 320 + Math.random()*260);
}
function startRenew(pid, manual = true){
  const p = G.players.find(x => x.id===+pid); if (!p) return;
  if (!G.staff.ds){ toast('Serve un direttore sportivo'); return; }
  let it = G.inbox.find(x => x.t==='renew' && x.d.pid===p.id && !x.done);
  if (!it){
    const sal = demandWage(p)*rnd(1.02, 1.18), y = p.a < 30 ? ri(2, 4) : ri(1, 2);
    it = addItem('renew', 'Direttore sportivo', `Rinnovo: ${p.n}`, `Contratto attuale: ${eur(p.s)} all’anno, ${yrs(p.c)} ancora${p.cl ? ', clausola ' + eur(p.cl) : ''}.`, {pid: p.id, sal: sal < 1000 ? Math.round(sal/10)*10 : sal < 10000 ? r50(sal) : Math.round(sal/1000)*1000, y}); G.newItems = Math.max(0, G.newItems - 1);
    it.d.op = renewAdvice(p, it.d.sal).txt;
    startItemNeg(it, {kind: 'renew', pid: p.id});
  }
  it.manual = manual; if (!manual) negAuto(it);
  openModal(sheetCard(it)); sheetItem = it.id; scrollThreads(); save(); renderNav();
}
function startTrat(pid, manual = true){
  let it = G.inbox.find(x => x.t==='trat' && String(x.d.pid)===String(pid) && !x.done);
  if (!it){
    const m = findMarket(pid); if (!m) return;
    if (!G.staff.ds){ toast('Serve un direttore sportivo'); return; }
    it = addItem('trat', 'Direttore sportivo', `Trattativa: ${m.p.n}`, `${m.p.club || ''}`, {pid}); G.newItems = Math.max(0, G.newItems - 1);
    startItemNeg(it, {kind: 'buy', pid});
  }
  it.manual = manual; if (!manual) negAuto(it);
  openModal(sheetCard(it)); sheetItem = it.id; scrollThreads(); save(); renderNav();
}

const pAcc = (ratio, bonus = 0) => Math.pow(clamp((ratio - 0.78 + bonus)/0.22, 0, 1), 1.3);
function dsValue(p){ return valueOf({...p, o: Math.round(estO(p))}); }
function startNeg(kind, d){
  if (!G.staff.ds){ toast('Serve un direttore sportivo'); return false; }
  G.neg = {kind, round: 0, ...d};
  chatOpen = true; G.chatUnread = 0;
  $('chat').classList.remove('hidden');
  chatTyping = true; renderChat();
  setTimeout(() => { chatTyping = false; negIntro(); G.chatUnread = 0; save(); if (chatOpen) renderChat(); renderTop(); }, 600);
  return true;
}
const opt3 = (cmd, sug, full, low, sugL, fullL, lowL) => {
  const o = [];
  o.push([cmd + ':' + sug, `${sugL} ${eur(sug)} (consiglio)`]);
  if (full!==sug) o.push([cmd + ':' + full, `${fullL} ${eur(full)}`]);
  if (low < sug) o.push([cmd + ':' + low, `${lowL} ${eur(low)}`]);
  return o;
};
function negIntro(){
  const N = G.neg; if (!N) return;
  if (N.kind==='buy'){
    const m = findMarket(N.pid);
    if (!m){ dsSay('Quel giocatore non è più disponibile.'); G.neg = null; return; }
    const p = m.p, ask = askPrice(p, m.src), dv = dsValue(p), [lo, hi] = estRange(p);
    const style = G.coach ? G.coach.style : G.phil.style, fit = (PREF[style][p.prof] ?? -1);
    N.src = m.src; N.ask = ask; N.name = p.n; N.club = p.club;
    const fitTxt = fit >= 2 ? 'Il profilo è perfetto per il mister.' : fit < 0 ? 'Attenzione: il profilo non è quello che vuole il mister.' : '';
    if (!ask){
      N.stage = 'wage'; N.fee = 0; N.wAsk = demandWage(p);
      const sug = roundFee(N.wAsk*0.9);
      dsSay(`${p.n} (${p.a} anni, ${ROLES[p.r].toLowerCase()}) ${p.free ? 'è svincolato: niente cartellino' : (p.club + ' lo lascia partire senza chiedere nulla')}. Lo valutiamo ${lo}–${hi}. ${fitTxt} Chiede ${eur(N.wAsk)} all’anno: io proverei ${eur(sug)}.`,
        opt3('n:w', sug, N.wAsk, roundFee(N.wAsk*0.8), 'Offri', 'Accetta', 'Offri').concat([['n:stop','Lascia stare']]));
      return;
    }
    N.stage = 'fee';
    const op = ask <= dv*0.9 ? 'è un affare' : ask <= dv*1.15 ? 'il prezzo è giusto' : 'chiedono troppo';
    const sug = roundFee(Math.min(ask, Math.max(dv*0.95, ask*0.8)));
    const clTxt = p.cl ? ` Ha una clausola rescissoria di ${eur(p.cl)}: pagandola il club non può dire di no.` : '';
    dsSay(`Per ${p.n} (${p.a} anni, ${ROLES[p.r].toLowerCase()}) ${p.club} chiede ${eur(ask)}. Per i nostri osservatori ${dv < 300 ? 'vale pochissimo' : 'vale circa ' + eur(dv)} (stima ${lo}–${hi}): ${op}. ${fitTxt}${clTxt} Io partirei da ${eur(sug)}.`,
      opt3('n:f', sug, ask, roundFee(ask*0.72), 'Offri', 'Offri', 'Offri').concat(p.cl ? [['n:cl', `Paga la clausola ${eur(p.cl)}`]] : [], [['n:stop','Lascia stare']]));
  } else if (N.kind==='renew'){
    const p = G.players.find(x => x.id===N.pid); if (!p){ G.neg = null; return; }
    const it = G.inbox.find(x => x.id===N.item);
    N.sal = it ? it.d.sal : demandWage(p); N.y = it ? it.d.y : 2; N.wAsk = N.sal;
    const r = renewAdvice(p, N.sal);
    dsSay(`${p.n} chiede ${eur(N.sal)} all’anno per ${yrs(N.y)} (oggi prende ${eur(p.s)}). ${r.txt}`,
      (r.sug ? opt3('n:w', r.sug, N.sal, roundFee(N.sal*0.8), 'Offri', 'Accetta', 'Offri') : [['n:w:' + N.sal, `Accetta ${eur(N.sal)}`], ['n:w:' + roundFee(N.sal*0.85), `Offri ${eur(N.sal*0.85)}`]]).concat([['n:stop','Lascialo partire']]));
  } else if (N.kind==='offer'){
    const p = G.players.find(x => x.id===N.pid), it = G.inbox.find(x => x.id===N.item);
    if (!p || !it){ G.neg = null; return; }
    N.f = it.d.f; N.club = it.d.club || 'il club';
    const a = offerAdvice(p, N.f);
    dsSay(`${N.club} offre ${eur(N.f)} per ${p.n}. ${a.txt}`, [['n:acc', `Accetta ${eur(N.f)}`], ['n:ask:' + roundFee(N.f*1.2), `Chiedi ${eur(N.f*1.2)}`], ['n:ask:' + roundFee(N.f*1.4), `Chiedi ${eur(N.f*1.4)}`], ['n:stop','Rifiuta']]);
  } else if (N.kind==='staff'){
    const it = G.inbox.find(x => x.id===N.item); const c = it && it.d.c[N.idx];
    if (!c){ G.neg = null; return; }
    N.wAsk = c.s; N.name = c.n;
    const st = staffStars(c), best = Math.max(...it.d.c.map(staffStars));
    const sug = roundFee(c.s*0.88);
    const role = N.role==='coach' ? 'allenatore' : STAFF_ROLES[N.role].toLowerCase();
    dsSay(`${c.n} come ${role}: ${st >= best ? 'per me è la scelta migliore della lista' : 'buono, ma in lista c’è di meglio'}. Chiede ${eur(c.s)} all’anno, io proverei ${eur(sug)}.`,
      opt3('n:w', sug, c.s, roundFee(c.s*0.75), 'Offri', 'Accetta', 'Offri').concat([['n:stop','Annulla']]));
  }
}
function renewAdvice(p, sal){
  const xi = new Set(bestXI().map(x => x.id)), starter = xi.has(p.id), old = p.a >= 31, young = p.a <= 23 && p.p > p.o + 3;
  if (starter && !old) return {txt: 'È un titolare e ha l’età giusta: io lo rinnoverei, magari limando lo stipendio.', sug: roundFee(sal*0.92)};
  if (young) return {txt: `È giovane e può crescere (potenziale ${potRange(p).join('–')}): rinnoverei.`, sug: roundFee(sal*0.92)};
  if (starter && old) return {txt: 'Gioca ancora, ma ha un’età: rinnoverei solo a cifre più basse.', sug: roundFee(sal*0.82)};
  return {txt: 'Gioca poco e pesa sul monte ingaggi: io lo lascerei andare.', sug: 0};
}
function offerAdvice(p, f){
  const v = valueOf(p), xi = new Set(bestXI().map(x => x.id)), starter = xi.has(p.id);
  const q = f >= v*1.15 ? 'È un’offerta molto buona' : f >= v*0.9 ? 'È un’offerta giusta' : 'È un’offerta bassa';
  const imp = starter ? ' È un nostro titolare: se lo vendiamo serve un sostituto.' : ' Non è un titolare.';
  const rec = f >= v*1.15 && !starter ? ' Io accetterei.' : f >= v*1.15 ? ' Io accetterei solo se troviamo il sostituto.' : f >= v*0.9 ? ' Proverei a chiedere qualcosa in più.' : ' Io rifiuterei o chiederei molto di più.';
  return {txt: `${q} (valore stimato ${eur(v)}).${imp}${rec}`};
}
function negCounter(N, offered, ask, cmd, what){
  N.round++;
  if (N.round >= 3 || offered < ask*0.6){ dsSay(`Niente da fare: ${what==='fee' ? 'il club ha chiuso la trattativa' : what==='sale' ? 'si sono ritirati' : 'non c’è accordo'}.`); return false; }
  const c = roundFee(Math.max(offered, (ask + offered)/2 + (ask - offered)*0.1));
  dsSay(`Rifiutano ${eur(offered)}. ${what==='fee' ? 'Il club scende a' : 'La controproposta è'} ${eur(c)}. Che dice?`,
    [[cmd + ':' + c, `Accetta ${eur(c)}`], [cmd + ':' + roundFee((c + offered)/2), `Offri ${eur((c + offered)/2)}`], ['n:stop','Lascia stare']]);
  return c;
}
function askClause(N, p, val){
  N.stage = 'clause'; N.cRef = 0;
  N.cAsk = roundFee(Math.max(val, 1000)*(1.5 + Math.random()*0.6));
  const hi = roundFee(N.cAsk*1.7);
  dsSay(`Accordo sull’ingaggio a ${eur(N.wage)}. Ultimo punto: la clausola rescissoria. Lui la vorrebbe a ${eur(N.cAsk)}${val >= 300 ? ' (valore attuale ' + eur(val) + ')' : ''}. Più è bassa, più è facile che qualcuno la paghi e ce lo porti via.`,
    [['n:c:' + hi, `Proponi ${eur(hi)}`], ['n:c:' + N.cAsk, `Accetta ${eur(N.cAsk)}`], ['n:c:0', 'Nessuna clausola'], ['n:stop', 'Lascia stare']]);
}
function clauseOk(N, v, p){
  const ok = v===N.cAsk || (v===0 ? Math.random() < (p.a >= 29 ? 0.6 : 0.4) : v > N.cAsk ? Math.random() < 0.6 : true);
  if (ok) return true;
  N.cRef = (N.cRef || 0) + 1;
  dsSay(`Su questo non cede: ${v===0 ? 'senza clausola non firma' : 'troppo alta per lui'}. Vuole la clausola a ${eur(N.cAsk)}.`, [['n:c:' + N.cAsk, `Accetta ${eur(N.cAsk)}`], ['n:stop', 'Lascia stare']]);
  return false;
}
function negCmd(a, v){
  const N = G.neg;
  if (!N){ dsSay('Questa trattativa è chiusa, presidente.'); return; }
  v = +v;
  if (a==='stop'){
    if (N.kind==='renew'){ const p = G.players.find(x => x.id===N.pid); if (p && p.c <= 1){ p.noRenew = true; dsSay(`D’accordo: ${p.n} a fine stagione se ne va.`); } else dsSay(`Va bene: ${p ? p.n : 'il giocatore'} resta col contratto attuale.`); doneItem(N.item); }
    else if (N.kind==='offer'){ doneItem(N.item); dsSay('Offerta rifiutata, comunico al club.'); }
    else dsSay('Va bene, lasciamo perdere.');
    G.neg = null; render(); return;
  }
  if (N.kind==='loan' && a==='lo'){
    const p = G.players.find(x => x.id===N.pid), o = N.opts[v];
    if (!p || !o){ G.neg = null; return; }
    if (Math.random() < 0.12 && N.round < 1){ N.round++; dsSay(`${o.club} all’ultimo si è tirata indietro: ha preso un altro giocatore. Scegliamo tra le altre?`, N.opts.map((x, i) => ['n:lo:' + i, x.club]).filter((x, i) => i!==v).concat([['n:stop','Lascia stare']])); N.opts[v] = null; return; }
    p.loan = 'x'; p.ng = false; p.list = false; p.lo = {...o, o0: p.o};
    if (o.fee) book('prestiti', o.fee);
    news(`${p.n} va in prestito a ${o.club}.`);
    dsSay(`Fatto: ${p.n} va a ${o.club} fino a fine stagione. Lo seguo io e a giugno le mando il resoconto.`);
    doneItem(N.item); G.neg = null; render(); return;
  }
  if (N.kind==='buy'){
    const m = findMarket(N.pid); if (!m){ dsSay('Nel frattempo è sfumato.'); G.neg = null; return; }
    const p = m.p;
    if (a==='f'){
      if (v >= N.ask || Math.random() < pAcc(v/N.ask)){
        N.fee = v; N.stage = 'wage';
        const L = lvl(), refuse = p.o > L.ovr + 12 ? 0.6 : TIER[G.lv] ? clamp((p.o - myStrength() - 3)*0.12, 0, 0.85) : 0;
        if (Math.random() < refuse){ dsSay(`${p.club} accetta ${eur(v)}, ma ${p.n} non vuole venire: non ci considera al suo livello.`); dropFromMarket(p, m.src); G.neg = null; return; }
        N.wAsk = demandWage(p);
        const sug = roundFee(N.wAsk*0.9);
        dsSay(`${p.club} accetta ${eur(v)}! Ora il giocatore: chiede ${eur(N.wAsk)} all’anno per ${yrs(Math.max(2, p.c))}. Io proverei ${eur(sug)}.`, opt3('n:w', sug, N.wAsk, roundFee(N.wAsk*0.8), 'Offri', 'Accetta', 'Offri').concat([['n:stop','Lascia stare']]));
      } else { const c = negCounter(N, v, N.ask, 'n:f', 'fee'); if (c===false) G.neg = null; else N.ask = c; }
      return;
    }
    if (a==='w'){
      if (v >= N.wAsk || Math.random() < pAcc(v/N.wAsk)){
        N.wage = v; askClause(N, p, valueOf({...p, c: Math.max(2, p.c)})); return;
      }
      const c = negCounter(N, v, N.wAsk, 'n:w', 'wage'); if (c===false) G.neg = null; else N.wAsk = c;
      return;
    }
    if (a==='cl'){
      if (!p.cl){ dsSay('Non ha clausola, presidente.'); return; }
      if (G.fin.cash - p.cl*1.08 < -fido()){ dsSay(`La clausola è di ${eur(p.cl)}: non abbiamo la liquidità per pagarla.`); return; }
      N.fee = p.cl; N.stage = 'wage'; N.wAsk = roundFee(demandWage(p)*1.05);
      const sug = roundFee(N.wAsk*0.92);
      dsSay(`Paghiamo la clausola di ${eur(p.cl)}: ${p.club} non può opporsi. Ora tutto dipende dal giocatore, che chiede ${eur(N.wAsk)} all’anno. Io proverei ${eur(sug)}.`, opt3('n:w', sug, N.wAsk, roundFee(N.wAsk*0.8), 'Offri', 'Accetta', 'Offri').concat([['n:stop','Lascia stare']]));
      return;
    }
    if (a==='c'){
      if (!clauseOk(N, v, p)) return;
      if (G.fin.cash - N.fee*1.08 < -fido()){ dsSay('C’è l’accordo, ma non abbiamo la liquidità per chiudere. Serve prima fare cassa.'); G.neg = null; return; }
      if (buyPlayer(p, m.src, N.fee, N.wage, true, v || null)){ dsSay(`Chiuso! ${p.n} firma per ${yrs(Math.max(2, p.c))} a ${eur(N.wage)} all’anno${v ? ', clausola ' + eur(v) : ', senza clausola'}.${N.fee ? ' Cartellino ' + eur(N.fee) + '.' : ''}`); G.budget.spentT = (G.budget.spentT || 0) + N.fee; }
      G.neg = null; render(); return;
    }
  }
  if (N.kind==='renew' && a==='c'){
    const p = G.players.find(x => x.id===N.pid); if (!p){ G.neg = null; return; }
    if (!clauseOk(N, v, p)) return;
    p.c = (p.c > 0 ? p.c : 0) + N.y; p.s = N.wage; p.cl = v || null; p.m = clamp(p.m + 6, 0, 100); p.noRenew = false;
    doneItem(N.item);
    dsSay(`Firmato: ${p.n} rinnova per ${yrs(N.y)} a ${eur(N.wage)} all’anno${v ? ', clausola ' + eur(v) : ', senza clausola'}.`); news(`${p.n} rinnova per ${yrs(N.y)}.`, 'pos');
    G.neg = null; render(); return;
  }
  if (N.kind==='renew' && a==='w'){
    const p = G.players.find(x => x.id===N.pid); if (!p){ G.neg = null; return; }
    if (v >= N.wAsk || Math.random() < pAcc(v/N.wAsk, (p.m - 60)/400 + (p.viv ? 0.04 : 0))){
      N.wage = v; askClause(N, p, valueOf({...p, c: p.c + N.y})); return;
    }
    const c = negCounter(N, v, N.wAsk, 'n:w', 'wage');
    if (c===false){ p.noRenew = true; doneItem(N.item); G.neg = null; render(); } else N.wAsk = c;
    return;
  }
  if (N.kind==='offer'){
    const p = G.players.find(x => x.id===N.pid); if (!p){ G.neg = null; return; }
    if (a==='acc'){ sellPlayer(p.id, N.f); doneItem(N.item); dsSay(`Fatto: ${p.n} ceduto per ${eur(N.f)}.`); G.neg = null; render(); return; }
    if (a==='ask'){
      const k = v/N.f;
      if (Math.random() < clamp(1 - (k - 1)*2.2, 0.08, 0.9)){ sellPlayer(p.id, v); doneItem(N.item); dsSay(`Hanno accettato! ${p.n} ceduto per ${eur(v)}.`); G.neg = null; render(); return; }
      N.round++;
      if (N.round >= 2 || Math.random() < 0.4){ doneItem(N.item); dsSay('Si sono ritirati: troppo alto per loro.'); G.neg = null; render(); return; }
      dsSay(`Non arrivano a ${eur(v)}, ma restano fermi a ${eur(N.f)}. Accettiamo?`, [['n:acc', `Accetta ${eur(N.f)}`], ['n:stop','Rifiuta']]);
      return;
    }
  }
  if (N.kind==='staff' && a==='w'){
    const it = G.inbox.find(x => x.id===N.item); const c = it && it.d.c[N.idx];
    if (!c){ G.neg = null; return; }
    if (v >= N.wAsk || Math.random() < pAcc(v/N.wAsk)){
      const hired = {...c, s: v};
      if (N.role==='coach'){ G.coach = hired; G.coach.mood = 70; news(`${hired.n} è il nuovo allenatore (${STYLES[hired.style].toLowerCase()}).`, 'pos'); }
      else hireStaff(N.role, hired);
      doneItem(it.id);
      dsSay(`Firmato: ${hired.n} a ${eur(v)} all’anno.`);
      if (N.role==='coach' && marketOpen() && !pending('plan')) dsPlan(G.week > 3);
      G.neg = null; render(); return;
    }
    const cc = negCounter(N, v, N.wAsk, 'n:w', 'wage');
    if (cc===false){ it.d.c.splice(N.idx, 1); dsSay(`${c.n} ha accettato un’altra offerta.`); if (!it.d.c.length) doneItem(it.id); G.neg = null; render(); } else N.wAsk = cc;
    return;
  }
  dsSay('Mi dica, presidente.');
}

function loanOffers(p){
  const q = normQ(G.staff.gp), out = [], used = new Set();
  for (let i = 0; i < 3; i++){
    const lvD = clamp(G.lv - [0, 1, 2][i] + (Math.random() < 0.2 ? 1 : 0), 0, 8);
    let club = TIER[lvD] ? pick(G.world[TIER[lvD]].filter(t => t.id!=='me' && t.id!=='ng')).n : clubName(lvD);
    if (used.has(club)) club = clubName(lvD); used.add(club);
    const mins = clamp(0.35 + (p.o - LV[lvD].ovr)/12 + q*0.2 + gauss()*0.08, 0.05, 0.95);
    const share = clamp(0.35 + q*0.45 + (mins > 0.6 ? 0.1 : 0) + rnd(-0.1, 0.1), 0.2, 1);
    const fee = Math.random() < 0.3 + q*0.4 ? roundFee(valueOf(p)*rnd(0.02, 0.08)) : 0;
    out.push({club, lv: lvD, mins: Math.round(mins*100)/100, share: Math.round(share*100)/100, fee});
  }
  return out;
}
function loanLine(o){ return `${o.club} (${LV[o.lv].n}): ${o.mins > 0.7 ? 'titolare' : o.mins > 0.45 ? 'spazio importante' : o.mins > 0.25 ? 'alternanza' : 'poco spazio'} (minuti ~${Math.round(o.mins*100)}%), pagano il ${Math.round(o.share*100)}% dell’ingaggio${o.fee ? ', prestito oneroso da ' + eur(o.fee) : ''}`; }
function startLoan(pid, auto){
  const p = G.players.find(x => x.id===pid); if (!p || !G.staff.gp) return;
  let it = G.inbox.find(x => x.t==='loanout' && x.d.pid===p.id && !x.done);
  if (!it){
    it = addItem('loanout', 'Gestore prestiti', `Prestito: ${p.n}`, '', {pid: p.id}); if (!auto) G.newItems = Math.max(0, G.newItems - 1);
    const opts = loanOffers(p);
    if (auto && Math.max(...opts.map(o => o.mins)) < 0.3){ G.inbox = G.inbox.filter(x => x!==it); return; }
    negInit(it, {kind: 'loan', pid: p.id, opts});
    if (auto){ it.title = `Prestito consigliato: ${p.n}`; scheduleAuto(it); } else it.manual = true;
  }
  if (!auto){ it.manual = true; openModal(sheetCard(it)); sheetItem = it.id; scrollThreads(); }
  save(); renderNav();
}
function loanReport(){
  const lo = G.players.filter(p => p.loan==='x' && p.lo);
  if (!lo.length || !G.staff.gp) return;
  const it = addItem('info', 'Gestore prestiti', 'Resoconto dei prestiti', '', {}); it.chat = [];
  tSay(it.chat, 'ds', `Presidente, ecco com’è andata la stagione dei nostri in prestito:\n${lo.map(p => `• ${p.n} a ${p.lo.club}: ${p.lo.apps} presenze${p.lo.goals ? ', ' + p.lo.goals + ' gol' : ''}, valutazione ${p.lo.o0} → ${p.o}`).join('\n')}\nTornano tutti a disposizione.`);
  it.done = true; it.doneW = G.week + 2;
}

const ROLEPROM = {tit: 'Titolare', rot: 'Rotazione', ris: 'Riserva'}, RP = {tit: 2, rot: 1, ris: 0};
const stepOf = v => Math.max(10, roundFee(Math.max(v, 200)*0.05));
function expectedRole(p, mine){
  const style = G.coach ? G.coach.style : G.phil.style, form = FORMS[style];
  const rivals = squad().filter(x => x.r===p.r && (!mine || x.id!==p.id)).map(x => x.o).sort((a, b) => b - a);
  const lastStarter = rivals[form[p.r] - 1] ?? 0, lastRot = rivals[form[p.r] + 1] ?? 0;
  return p.o >= lastStarter ? 'tit' : p.o >= lastRot - 1 ? 'rot' : 'ris';
}
function setupContract(N, p, W, y){
  const yp = y || (p.a <= 23 ? 4 : p.a <= 28 ? 3 : p.a <= 31 ? 2 : 1);
  const cl = roundFee(Math.max(valueOf({...p, c: yp}), 1000)*(1.5 + Math.random()*0.6));
  N.dem = {w: W, y: yp, cl, role: expectedRole(p, N.kind==='renew')};
  N.cur = {w: roundFee(W*0.9), y: yp, cl: roundFee(cl*1.3), bonus: 0, role: N.dem.role};
  N.hasClause = true; N.hasRole = true;
}
function negInit(it, neg){
  const N = it.neg = {kind: neg.kind, pid: neg.pid, idx: neg.idx, role: neg.role, item: it.id, pat: 3, log: [], stage: 'contract'};
  it.chat = null;
  if (N.kind==='buy'){
    const m = findMarket(N.pid);
    if (!m){ N.stage = 'done'; N.res = 'Il giocatore non è più disponibile.'; return; }
    const p = m.p; N.src = m.src; N.name = p.n; N.club = p.club; N.ask = askPrice(p, m.src); N.dv = dsValue(p); N.pcl = p.cl || 0;
    N.fee = roundFee(Math.min(N.ask, Math.max(N.dv*0.95, N.ask*0.8))); N.sellOn = 0;
    if (N.ask > 0) N.stage = 'club'; else setupContract(N, p, demandWage(p));
  } else if (N.kind==='renew'){

function modsMonth(){

  book('manut', sum(Object.keys(MODS).map(k => MODS[k].cost[mod(k)]))*0.04/12*(fst('custode') ? 1 : 1.3));

  if (g < need && G.pitch < 40 && !G.ev.pitchWarn){ G.ev.pitchWarn = 1; news(`Il campo è in pessime condizioni: servono ${need} giardinieri, ne abbiamo ${g}.`, 'neg'); }

function buyMod(k){
  const m = MODS[k], l = mod(k);
  if (l >= m.lv.length - 1) return;
  if (m.f!=='sede' && m.f!=='stadio' && FAC[m.f] && l + 1 > G.fac[m.f].lv + 1){ toast(`Prima amplia ${FAC[m.f].n.toLowerCase()}`); return; }
  if (m.f==='stadio' && l + 1 > stadLv() + 1){ toast('Prima amplia lo stadio'); return; }
  const cost = m.cost[l + 1];
  if (G.fin.cash - cost < -fido()){ toast('Liquidità insufficiente'); return; }
  if (!budgetGuard('fac', cost, () => buyMod(k))) return;
  G.fin.cash -= cost; G.modVal = (G.modVal || 0) + cost; G.mods[k] = l + 1;
  news(`Lavori conclusi: ${m.n.toLowerCase()} → ${m.lv[l + 1].toLowerCase()} (${eur(cost)}).`, 'pos');

// ---- disegno isometrico
const ISO = {s: 13};
function ip(x, y, z = 0){ return [(x - y)*ISO.s + 210, (x + y)*ISO.s*0.5 - z*ISO.s + 30]; }
const pts = a => a.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = clamp(Math.round(r*f), 0, 255); g = clamp(Math.round(g*f), 0, 255); b = clamp(Math.round(b*f), 0, 255); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
const flat = (x, y, w, d, c, z = 0, extra = '') => `<polygon points="${pts([ip(x, y, z), ip(x + w, y, z), ip(x + w, y + d, z), ip(x, y + d, z)])}" fill="${c}" ${extra}/>`;
function pitchSVG(x, y, w, d, q = 70){
  const g1 = q > 55 ? '#3f9b4f' : q > 35 ? '#7a9b47' : '#9b8a4f', g2 = shade(g1, 0.88);
  let s = flat(x - 0.3, y - 0.3, w + 0.6, d + 0.6, shade(g1, 0.8));
  const n = 8; for (let i = 0; i < n; i++) s += flat(x + i*w/n, y, w/n, d, i % 2 ? g1 : g2);
  const L = (a, b) => `<line x1="${ip(...a)[0]}" y1="${ip(...a)[1]}" x2="${ip(...b)[0]}" y2="${ip(...b)[1]}" stroke="#fff" stroke-width="1" opacity=".85"/>`;
  s += `<polygon points="${pts([ip(x, y), ip(x + w, y), ip(x + w, y + d), ip(x, y + d)])}" fill="none" stroke="#fff" stroke-width="1" opacity=".85"/>`;
  s += L([x + w/2, y], [x + w/2, y + d]);
  const pb = d*0.5; s += `<polygon points="${pts([ip(x, y + d/2 - pb/2), ip(x + w*0.14, y + d/2 - pb/2), ip(x + w*0.14, y + d/2 + pb/2), ip(x, y + d/2 + pb/2)])}" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>`;
  s += `<polygon points="${pts([ip(x + w, y + d/2 - pb/2), ip(x + w*0.86, y + d/2 - pb/2), ip(x + w*0.86, y + d/2 + pb/2), ip(x + w, y + d/2 + pb/2)])}" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>`;
  return s;
}

function planMonth(){

    const i = P.res*P.rate/1200, cap = Math.min(P.res, P.rata - i);
    book('int', i); G.fin.cash -= cap + P.arrears; P.res -= cap; P.paid++; P.arrears = 0; P.missed = 0;
    if (P.res <= 1){ G.fin.plan = null; news('Piano di rientro concluso: la banca riapre il fido.', 'pos'); }

  }

}

function attrsOf(p, o){

const CLUBPFX = ['ASD','US','Pol.','GS','AC','SSD','FC'];
function lvForO(o){ let best = 0; LV.forEach((l, i) => { if (Math.abs(l.ovr - o) < Math.abs(LV[best].ovr - o)) best = i; }); return best; }
function genHist(p, lastClub){
  return withSeed(hash(String(p.nid || p.id) + 'hist'), () => {
    const seasons = Math.max(0, Math.min(10, p.a - 18)), out = []; if (!seasons) return out;
    let club = lastClub && lastClub!=='Svincolato' ? lastClub : pick(CLUBPFX) + ' ' + pick(TOWNS), left = ri(1, 3), o = p.o;
    for (let k = 1; k <= seasons; k++){
      const s = G.season - k, lv = p.nid ? Math.max(6, lvForO(o)) : Math.min(G.lv, lvForO(o)), pr = ri(14, 34);
      const g = p.r==='A' ? rnd(0.2, 0.55) : p.r==='C' ? rnd(0.04, 0.2) : p.r==='D' ? rnd(0, 0.07) : 0, as = p.r==='A' ? rnd(0.08, 0.22) : p.r==='C' ? rnd(0.08, 0.25) : p.r==='D' ? rnd(0.02, 0.08) : 0;
      out.push({s, club, lv, pr, gl: Math.round(pr*g), as: Math.round(pr*as)});
      if (--left <= 0){ club = p.nid ? pick((['A','B'].flatMap(k => (leagueOf(k) || {teams: []}).teams.map(t => t.n))).concat([pick(CLUBPFX) + ' ' + pick(TOWNS)])) : pick(CLUBPFX) + ' ' + pick(TOWNS); left = ri(1, 3); }
      o -= p.a - k <= 22 ? 2 : p.a - k <= 25 ? 1 : 0;
    }
    return out;
  });
}
function ensureHist(p, lastClub){ if (!p.hist) p.hist = genHist(p, lastClub); return p.hist; }
function careerHTML(p, mine){
  const hist = mine ? ensureHist(p) : genHist(p, p.club);
  const cur = mine ? [{s: G.season, club: p.loan==='x' ? p.lo.club : p.ng ? G.club.n + ' NG' : G.club.n, lv: p.loan==='x' ? p.lo.lv : G.lv, pr: p.pr || 0, gl: p.gl || 0, as: p.as || 0, live: true}] : [];
  const rows = [...cur, ...hist].sort((a, b) => b.s - a.s);
  const tot = rows.reduce((t, r) => ({pr: t.pr + r.pr, gl: t.gl + r.gl, as: t.as + r.as}), {pr: 0, gl: 0, as: 0});
  return `<div class="card car"><div class="carh"><span>Stagione</span><span>Squadra</span><span>Pres</span><span>Gol</span><span>Ass</span></div>
    ${rows.map(r => `<div class="carr ${r.live ? 'live' : ''}"><span class="cy">${seasonLab(r.s)}</span><span class="cc">${badge(r.club, 20)}<em>${esc(r.club)}<small>${LV[r.lv] ? LV[r.lv].n : ''}${r.live ? ' · in corso' : ''}</small></em></span><span>${r.pr}</span><span>${r.gl}</span><span>${r.as}</span></div>`).join('')}

function faceSVG(seed, o = {}){
