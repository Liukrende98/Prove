.ltab{padding:6px 12px}
.lth,.ltr{display:grid;grid-template-columns:26px 1fr 30px 38px 34px;align-items:center;gap:6px}
.lth{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);padding:8px 0 6px}
.lth span:nth-child(n+3),.ltr>span:nth-child(n+3),.ltr>b{text-align:right;font-variant-numeric:tabular-nums}
.ltr{min-height:46px;border-top:1px solid var(--line);font-size:14px;position:relative}
.ltr.tap{cursor:pointer}
.ltr .lp{font-weight:800;color:var(--muted);text-align:center}
.ltr .ln{display:flex;align-items:center;gap:8px;min-width:0}
.ltr .ln em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ltr.me{background:var(--soft);margin:0 -12px;padding:0 12px}
.ltr.me .ln em{font-weight:800}
.ltr.up::before,.ltr.down::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px}
.ltr.up::before{background:var(--pos)}.ltr.down::before{background:var(--neg)}
.ltr.me.up::before,.ltr.me.down::before{left:0}
.ltl{font-size:12px;color:var(--muted);padding:10px 0 6px;border-top:1px solid var(--line)}
.ltl i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 2px 0 6px}
.ltl i.up{background:var(--pos)}.ltl i.down{background:var(--neg)}
/* =================== TEMA POWER =================== */
:root{
  --bg:#edf1f8; --surface:#ffffff; --surface2:#f1f4fa; --ink:#0c1530; --muted:#5b6687; --line:#dce3ef;
  --accent:#2453ff; --accent2:#1435c9; --accent-ink:#ffffff; --gold:#e8a800; --gold2:#ffc53a; --navy:#0a1838; --pos:#11a36a; --neg:#e5414b; --warn:#e88a00; --soft:#e7edff;
  --font:"Inter",system-ui,-apple-system,"Helvetica Neue",sans-serif; --serif:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(12,21,48,.05),0 8px 24px rgba(12,21,48,.07);
  --hdr:linear-gradient(135deg,#0a1838 0%,#122b6b 55%,#1d47b8 100%);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1226; --surface:#121b36; --surface2:#182344; --ink:#eef2ff; --muted:#93a0c6; --line:#24315a;
  --accent:#3d6bff; --accent2:#2453ff; --accent-ink:#ffffff; --gold:#ffbf2e; --gold2:#ffd36b; --navy:#08112a; --pos:#2fd28a; --neg:#ff5f6b; --warn:#ffad33; --soft:#1b2a57;
  --shadow:0 8px 24px rgba(0,0,0,.25); --hdr:linear-gradient(135deg,#08112a 0%,#10265f 55%,#1b42ad 100%); } }
:root[data-theme="dark"]{ --bg:#0b1226; --surface:#121b36; --surface2:#182344; --ink:#eef2ff; --muted:#93a0c6; --line:#24315a; --accent:#3d6bff; --accent2:#2453ff; --accent-ink:#ffffff; --gold:#ffbf2e; --gold2:#ffd36b; --navy:#08112a; --pos:#2fd28a; --neg:#ff5f6b; --warn:#ffad33; --soft:#1b2a57; --shadow:0 8px 24px rgba(0,0,0,.25); --hdr:linear-gradient(135deg,#08112a 0%,#10265f 55%,#1b42ad 100%); }
body{font-family:var(--font);letter-spacing:-.01em}
/* titoli: condensato sportivo, maiuscolo */
h2,.sect h2,.sec-h h2{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h2::before,.sect h2::before,.sec-h h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--gold));flex:none}
.sheet h2::before,.thead h2::before,.pname h2::before,.bud h2::before{display:none}
/* testata */
#top{background:var(--hdr);border-bottom:0;position:relative;overflow:hidden}
#top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
#top>*{position:relative;z-index:1}
.club b{font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:.01em;text-transform:uppercase}
.cash b{font-family:var(--serif);font-weight:800;font-size:24px;color:var(--gold2)}
.adv{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.adv.main{background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838;box-shadow:0 6px 18px rgba(255,191,46,.35);font-weight:800}
/* navigazione */
#nav{background:var(--surface);box-shadow:0 -6px 20px rgba(12,21,48,.06)}
#nav button.on{color:var(--accent)}
#nav button.on::before{background:linear-gradient(90deg,var(--accent),var(--gold));height:3px;left:26%;right:26%}
.badge{background:var(--neg);color:#fff}
/* superfici */
.card,.rcard,.tile,.stats3 div,.td,.kpi{border-color:var(--line);background:var(--surface)}
.card{border-radius:20px}
.from,.flab,.rlab,.tile span,.stats3 span,.tstats span{color:var(--muted)}
/* bottoni e selettori: niente più nero */
.btn{border-radius:14px;font-weight:700}
.btn.pri{background:linear-gradient(180deg,var(--accent),var(--accent2));border:0;color:#fff;box-shadow:0 6px 16px rgba(36,83,255,.3)}
.btn.pri:disabled{box-shadow:none}
.chip.on,.subnav button.on,.segw button.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(36,83,255,.25)}
.soctabs button.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(36,83,255,.3)}
.soctabs button.on .ic{color:#fff}
.soctabs button .ic,.tile .ic,.ricon,.hint .ic{color:var(--accent)}
.ricon{background:var(--soft)}
.opt.pri{border-color:var(--accent);background:var(--soft)}
.meet.urgent{border-left-color:var(--accent)}
input[type=range]{accent-color:var(--accent)}
.card .bar i{background:linear-gradient(90deg,var(--accent),#6b8cff)}
/* numeri grandi in condensato */
.kpi b,.stats3 b,.tstats b,.tile b,.big b,.bres b,.bhead b,.stp-v b,.futo b,.ovbadge,.mrs,.ltr>b{font-family:var(--serif);font-weight:800;letter-spacing:0}
.stats3 b,.tile b{font-size:30px}
.tstats b{font-size:22px}
/* home */
.hero{background:var(--hdr);border:0;box-shadow:0 14px 30px rgba(10,24,56,.28)}
.hero::after{background:radial-gradient(circle,rgba(255,197,58,.28),transparent 70%)}
.hlab{opacity:.75;font-weight:700}
.vs{font-family:var(--serif);font-style:normal;font-weight:800;font-size:22px;color:var(--gold2);text-transform:uppercase}
.pbar i{background:linear-gradient(90deg,#ffd35a,#f2a900)}
.ocrest{font-family:var(--serif);font-weight:800}
.mteam span:last-child{font-weight:800}
.tdi{background:var(--soft);color:var(--accent)}
.td.hot{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.td.hot .tdi{background:linear-gradient(180deg,#ff6b74,#e5414b);color:#fff}
.sect>span{color:var(--accent)}
.more{color:var(--accent)}
.mr.me .mrp{color:var(--accent)}
.allok .ic{color:var(--pos)}
/* classifica */
.ltr.me{background:var(--soft)}
.tbadge{font-family:var(--serif);font-weight:800}
/* società e 3D */
.socht{background:linear-gradient(180deg,transparent,rgba(8,17,42,.82))}
.socht b{font-family:var(--serif);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em}
.l3d{background:rgba(10,24,56,.86);border-color:rgba(91,130,255,.55)}
.l3d::after{border-top-color:rgba(10,24,56,.86)}
.l3i{color:#ffd36b}
.l3d i{background:#ffc53a;color:#0a1838}
.ftitle2 b{font-family:var(--serif);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:32px}
.fti{background:rgba(10,24,56,.75);color:#ffd36b;border-color:rgba(91,130,255,.55)}
.fbackbar{background:var(--hdr)}
.uchip{background:#0a1838;color:#ffd36b}
.ucard b{font-family:var(--serif);font-weight:800;text-transform:uppercase;font-size:21px;letter-spacing:.01em}
.ubtn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff}
.ucard .pips i.on{background:var(--accent)}
.ucard.cur{box-shadow:0 12px 28px rgba(0,0,0,.3),0 0 0 2px var(--gold2)}
.ucard.main{box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 3px 0 var(--accent)}
.bres.good{background:linear-gradient(135deg,#0d7a52,#18b277)}
.bres.mid{background:linear-gradient(135deg,#b86a00,#f0a020)}
.bres.bad{background:linear-gradient(135deg,#a3202b,#e5414b)}
/* schede */
.thead h2,.pname h2{font-family:var(--serif);font-weight:800;text-transform:uppercase;font-size:26px;letter-spacing:.01em}
.futn{font-family:var(--serif);font-weight:800;font-size:22px}
.futa b{font-family:var(--serif);font-weight:800;font-size:19px}
.futface{font-family:var(--serif);font-weight:800}
.role{font-family:var(--serif);font-weight:800;font-size:15px}
.r-P{background:linear-gradient(160deg,#ffbf2e,#e08a00)}.r-D{background:linear-gradient(160deg,#3d6bff,#1f3fcf)}.r-C{background:linear-gradient(160deg,#18b277,#0d7a52)}.r-A{background:linear-gradient(160deg,#ff5f6b,#c92a36)}
.res.W{background:var(--pos)}.res.L{background:var(--neg)}

.isheet .meet{border:0;box-shadow:none;padding:16px 0 4px;margin:0;background:transparent}
.isheet .meet h3{font-family:var(--serif);font-weight:800;text-transform:uppercase;font-size:26px;letter-spacing:.01em;line-height:1.05;margin:4px 40px 8px 0}
.isheet .opt{min-height:56px;border-radius:16px;padding:14px 16px;margin-top:10px}
.isheet .opt b{font-size:16px}
.isheet .opt span{font-size:13.5px}
/* notifiche stile posta */
.mailbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.mail{display:flex;align-items:stretch;border-top:1px solid var(--line);position:relative}
.mail:first-child{border-top:0}
.mail.unread::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent)}
.mail.urg.unread::before{background:var(--neg)}
.mailmain{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;padding:14px 12px 14px 20px;color:var(--ink)}
.mav{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:inset 0 -6px 12px rgba(0,0,0,.15)}
.mav .ic{width:20px;height:20px}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mtop b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop em{font-style:normal;font-size:12px;color:var(--muted);flex:none}
.mail.unread .mtop em{color:var(--accent);font-weight:700}
.msub{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail.unread .msub{font-weight:800}
.mprev{font-size:13px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.march{flex:none;width:56px;border:0;border-left:1px solid var(--line);background:var(--surface2);color:var(--pos);display:flex;align-items:center;justify-content:center}
.march .ic{width:22px;height:22px}
/* carriera */
.car{padding:6px 12px}
.carh,.carr{display:grid;grid-template-columns:60px minmax(0,1fr) 30px 28px 28px;gap:8px;align-items:center}
.carh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0 6px}
.carh span:nth-child(n+3),.carr span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.carr{min-height:48px;border-top:1px solid var(--line);font-size:14px}
.carr .cy{font-family:var(--serif);font-weight:800;font-size:14.5px;white-space:nowrap}
.carr .cc{display:flex;align-items:center;gap:8px;min-width:0}
.carr .cc em{font-style:normal;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;line-height:1.2}
.carr .cc small{font-weight:500;font-size:11.5px;color:var(--muted)}
.carr.live{background:var(--soft);margin:0 -12px;padding:0 12px}
.carr.tot{font-weight:800}
.carr.tot span:nth-child(n+3){font-family:var(--serif);font-size:16px}

#modal{z-index:60}
.psum{background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:10px}
.pmeter{margin-bottom:10px}
.pmeter .meter small{font-weight:600;color:var(--muted);font-size:12px}
.psum .note{font-size:13px;margin-top:4px}
.bwarn{padding-top:8px}
.bwi{width:64px;height:64px;margin:4px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838;box-shadow:0 10px 24px rgba(242,169,0,.35)}
.bwi .ic{width:32px;height:32px;stroke-width:2}
.bwarn h2{justify-content:center;text-align:center}
.bwarn h2::before{display:none}
.bcmp{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px}
.bcmp>div:not(.arr){background:var(--surface2);border-radius:16px;padding:12px;text-align:center}
.bcmp .hi{background:var(--soft)!important;border:1px solid var(--accent)}
.bcmp span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bcmp b{display:block;font-family:var(--serif);font-weight:800;font-size:26px;margin-top:2px}
.bcmp .arr{display:flex;justify-content:center;color:var(--accent)}
.irow b{white-space:nowrap;text-align:right}

.futface{background:rgba(255,255,255,.18);overflow:hidden;opacity:1}
.futface .face{width:100%;height:100%;display:block}
.face{display:block}
.pav{position:relative;width:46px;height:46px;flex:none}
.pav .face{width:46px;height:46px;border-radius:50%;background:var(--surface2)}
.pav .role{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;font-size:12px;border-radius:7px;border:2px solid var(--surface)}
.pav.sm{width:40px;height:40px}.pav.sm .face{width:40px;height:40px}
.sface{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--soft);flex:none}
.sface .face{width:44px;height:44px}
.optface{display:inline-block;width:34px;height:34px;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:10px;background:var(--surface2)}
.optface .face{width:34px;height:34px}

.mini-stp{display:flex;align-items:center;gap:6px;flex:none}
.mini-stp button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700;color:var(--ink)}
.mini-stp b{min-width:22px;text-align:center;font-family:var(--serif);font-weight:800;font-size:20px}
.bsticky{position:sticky;top:-2px;z-index:3;margin:0 -2px 10px;padding-top:2px;background:var(--surface)}
.bsticky .bres{box-shadow:0 8px 20px rgba(0,0,0,.15)}
.adv1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;line-height:1;flex:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.adv1 b{font-family:var(--serif);font-weight:800;font-size:17px}
.adv1 span{font-size:9.5px;font-weight:700;opacity:.8;margin-top:1px}
.advgo{position:relative;width:58px;height:58px;border-radius:50%;border:0;flex:none;color:#0a1838;background:radial-gradient(circle at 35% 30%,#ffe9a3,#ffc53a 45%,#e89a00);box-shadow:0 0 0 4px rgba(255,197,58,.18),0 10px 24px rgba(232,154,0,.45),inset 0 -4px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.advgo svg{width:28px;height:28px;margin-left:3px}
.advgo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,197,58,.55);animation:advring 2.2s ease-out infinite}
.advgo:active{transform:scale(.92)}
@keyframes advring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){.advgo::after{animation:none;opacity:.4}}
.timerow{align-items:center}
.timerow .when{flex:1}

.soctabs{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:8px 8px 9px;background:var(--hdr);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 6px 16px rgba(10,24,56,.18)}
.soctabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;border:0;border-radius:14px;background:transparent;color:rgba(235,241,255,.72);font-weight:700;font-size:10.5px;letter-spacing:.01em;padding:0 2px;box-shadow:none}
.soctabs button i{width:34px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.soctabs button .ic{width:20px;height:20px;color:rgba(235,241,255,.8)}
.soctabs button span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.soctabs button.on{background:transparent;color:#fff;box-shadow:none}
.soctabs button.on i{background:linear-gradient(180deg,#ffd35a,#f2a900);box-shadow:0 6px 14px rgba(242,169,0,.4);transform:translateY(-1px)}
.soctabs button.on .ic{color:#0a1838}
.soctabs button.on::after{content:"";position:absolute;bottom:2px;left:30%;right:30%;height:3px;border-radius:2px;background:#ffc53a}
.soctabs button:active i{transform:scale(.92)}

.qbar{position:sticky;bottom:-20px;margin:16px -16px -20px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(180deg,transparent,var(--surface) 30%);display:flex;align-items:center;justify-content:space-between;gap:10px}
.qbar span{font-size:13px;font-weight:700;color:var(--muted)}
.qnext{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 18px 0 20px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(36,83,255,.35)}
.qnext .ic{width:18px;height:18px}
/* maglia */
.kited .kitprev{display:flex;justify-content:center;padding:6px 0 4px}
.kited .kit{width:210px}
.swr{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 -3px 6px rgba(0,0,0,.15)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.segw.three{grid-template-columns:1fr 1fr 1fr}
/* candidati */
.cand{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.cand.rec{border-color:var(--accent);box-shadow:0 10px 24px rgba(36,83,255,.18)}
.crec{position:absolute;top:-10px;left:16px;background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.ctop{display:flex;gap:12px;align-items:center}
.cface{width:62px;height:62px;border-radius:50%;overflow:hidden;background:var(--soft);flex:none;border:2px solid var(--line)}
.cface .face{width:62px;height:62px}
.cname{font-family:var(--serif);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.cstars{color:var(--gold);font-size:13px;letter-spacing:1px}
.ctag{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
.csal{text-align:right;flex:none}
.csal b{display:block;font-family:var(--serif);font-weight:800;font-size:20px}
.csal span{font-size:11px;color:var(--muted)}
.cskills{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0}
.cskills div{display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:12.5px;align-items:center}
.cskills b{font-family:var(--serif);font-weight:800;font-size:16px}
.cskills i{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;display:block}
.cskills u{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#6b8cff)}
.ccar{border-top:1px solid var(--line);padding-top:8px}
.ccar div{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.ccar em{font-style:normal;font-family:var(--serif);font-weight:800;font-size:14px;color:var(--muted)}
.ccar span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ccar b{font-size:12px;font-weight:700;color:var(--pos);text-align:right}
/* notizie */
.feed{display:flex;flex-direction:column;gap:10px}
.ncard{border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);overflow:hidden}
.ncard p{margin:8px 0 0;font-size:14.5px;line-height:1.4;font-weight:600}
.nch,.gzh,.lch{display:flex;align-items:center;gap:8px}
.nch em,.gzh em,.lch em{margin-left:auto;font-style:normal;font-size:11.5px;opacity:.7}
.ntag{font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:5px}
.o-sky{background:linear-gradient(135deg,#071a4a,#0d2f87);color:#fff}
.o-sky .ntag{background:#e31b23;color:#fff}
.ol-sky{display:inline-flex;align-items:center;gap:2px;background:linear-gradient(180deg,#fff,#dfe6f5);border-radius:7px;padding:2px 6px;font-family:var(--serif);font-weight:800;color:#0d2f87;font-size:16px}
.ol-sky i{font-style:normal;background:#e31b23;color:#fff;border-radius:4px;padding:0 4px;font-size:13px}
.o-dazm{background:#0c0c0c;color:#f2f2f2;border-left:4px solid #d4ff2a}
.o-dazm .ntag{background:#d4ff2a;color:#0c0c0c}
.ol-dazm{font-family:var(--serif);font-weight:800;font-size:20px;letter-spacing:.06em;color:#fff}
.ol-dazm b{color:#d4ff2a}
.o-tmw{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.o-tmw .ntag{background:#ff6a00;color:#fff}
.ol-tmw{font-family:var(--serif);font-weight:800;font-size:18px;color:#ff6a00;border:2px solid #ff6a00;border-radius:6px;padding:0 5px}
.ol-tmw b{color:var(--ink)}
.o-gaz{background:#fbe1ea;color:#2a1018;border:1px solid #f3c2d2}
.ol-gaz{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-style:italic;font-size:15px;color:#b3124a}
.o-gaz h4{margin:8px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.25;font-weight:700}
.o-loc{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.ol-loc{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.o-loc p{font-weight:500}
.o-fab{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.fbh{display:flex;align-items:center;gap:10px}
.fbav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#ffb347,#e1306c,#833ab4);padding:2px;flex:none}
.fbav .face{width:36px;height:36px;border-radius:50%;background:var(--surface)}
.fbh b{font-size:14.5px}.fbh span{display:block;font-size:12px;color:var(--muted)}
.vf{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#3d8bff;color:#fff;font-size:9px;font-style:normal;align-items:center;justify-content:center;font-weight:900}
.fbf{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:700}
/* budget: confronto immediato */
.bdelta{display:flex;gap:8px;margin-top:8px}
.bdelta span{flex:1;font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;text-align:center}
.bmini{margin-top:10px}
.bmini .bbar{margin:4px 0;grid-template-columns:54px 1fr auto;color:#fff;font-size:11.5px}
.bmini .bbt{height:12px;background:rgba(255,255,255,.2)}
.bmini b{color:#fff}
.beff{font-weight:800}
#main.socmode{padding-top:0}
#main.socmode .socpage{margin-top:0}
/* v34 */
.ptags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 0}
.ptags span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:800}
.ptags .ic{width:15px;height:15px;stroke-width:2}
.mood{width:22px;height:22px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.heat{width:100%;height:auto;border-radius:12px;display:block}
.abico .ic{width:18px;height:18px;color:var(--accent);stroke-width:2}
.ab{grid-template-columns:22px 92px 30px 1fr}
/* card rosa */
.pclist{display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);color:var(--ink);transition:transform .12s}
.pc:active{transform:scale(.985)}
.pcav{position:relative;width:52px;height:52px}
.pcav .face{width:52px;height:52px;border-radius:50%;background:var(--surface2)}
.pcav .role{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:8px;border:2px solid var(--surface);font-size:13px}
.pcm{min-width:0;display:flex;flex-direction:column;gap:4px}
.pcm>b{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcs{display:flex;flex-wrap:wrap;gap:4px}
.st{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.st.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}.st.info{background:var(--soft);color:var(--accent)}.st.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.st.neg{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.pci,.pcg{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.pci em,.pcg em{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.pcg .ic{width:14px;height:14px;stroke-width:2;color:var(--accent)}
.pcg .mood{width:20px;height:20px;margin-left:auto}
.pcr{width:54px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a2112;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.pcr b{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1}
.pcr small{font-size:10px;font-weight:800;opacity:.75}
.pcr.bronze{background:linear-gradient(160deg,#e4b183,#a8693b)}.pcr.silver{background:linear-gradient(160deg,#f4f5f7,#aab2ba)}.pcr.gold{background:linear-gradient(160deg,#f6e3a1,#c9a24a)}.pcr.elite{background:linear-gradient(160deg,#2b2b2b,#0a0a0a);color:#e7cf8f}
/* barre a icone */
.itabs{display:grid;gap:0;margin:-14px -14px 12px;padding:8px 6px 9px;background:var(--hdr);position:sticky;top:-14px;z-index:6;box-shadow:0 6px 16px rgba(10,24,56,.18)}
.itabs button{display:flex;flex-direction:column;align-items:center;gap:4px;height:58px;justify-content:center;border:0;background:none;color:rgba(235,241,255,.72);font-weight:700;font-size:10.5px;padding:0 2px}
.itabs button i{width:34px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.itabs .ic{width:20px;height:20px;color:rgba(235,241,255,.82)}
.itabs span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.itabs button.on{color:#fff}
.itabs button.on i{background:linear-gradient(180deg,#ffd35a,#f2a900);box-shadow:0 6px 14px rgba(242,169,0,.45);transform:translateY(-1px)}
.itabs button.on .ic{color:#0a1838}
.lic{font-family:var(--serif);font-weight:800;font-size:19px;color:rgba(235,241,255,.85);font-style:normal}
.itabs button.on .lic{color:#0a1838}
.soctabs button.on::after{display:none}
/* strutture: sei edifici in fila */
.fchips{display:grid!important;grid-template-columns:repeat(6,1fr)!important;gap:6px!important}
.fchip{flex-direction:column!important;height:78px;padding:6px 2px!important;gap:3px!important;border-radius:16px!important;position:relative;font-size:10.5px!important;justify-content:center!important;background:linear-gradient(180deg,var(--surface),var(--surface2))!important}
.fchip .ic{width:24px!important;height:24px!important;color:var(--accent)}
.fchip .lvb,.fchip>i:last-child{position:absolute;top:4px;right:4px;transform:scale(.85)}
/* avanza in basso a destra */
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:9;display:flex;align-items:center;gap:10px}
#fab .adv1{border-color:var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);backdrop-filter:none}
#fab .adv1 span{color:var(--muted)}
.topos{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:800}
/* finanze */
.stock{width:100%;height:auto;display:block}
.stock .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:drawl 1.2s ease-out forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
.stockleg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.stockleg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.saved{font-style:normal;font-size:12px;font-weight:700;color:var(--pos)}
.saved.ing{color:var(--muted)}
.bconfirm{background:var(--soft);border:1px solid var(--accent);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.bconfirm>div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600}
.bconfirm .ic{color:var(--accent);flex:none;margin-top:2px}
#finbud .bsticky{top:58px}
details.dsbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:12px}
details.dsbox>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
details.dsbox>summary::-webkit-details-marker{display:none}
details.dsbox>summary .grow b{display:block;font-size:15px}details.dsbox>summary .grow span{font-size:12.5px;color:var(--muted)}
details.dsbox>summary .chv{transition:transform .2s;color:var(--muted)}
details.dsbox[open]>summary .chv{transform:rotate(90deg)}
details.dsbox>.dsin{padding:0 16px 14px}
.tsub{margin:12px 0 6px}
.tsub .segw{margin:0}
.pcsel{display:flex;align-items:center;gap:10px}.pcsel .pc{flex:1}
.pmood{display:flex;align-items:center;gap:12px;margin-top:12px}.pmood .mood{width:38px;height:38px}.pmood b{display:block;font-size:15px}.pmood span{font-size:12.5px;color:var(--muted)}
#toast{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)!important}
#main{padding-bottom:110px}
/* avvio */
.start{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:radial-gradient(circle at 50% 20%,#1d47b8 0%,#0f2a6b 40%,#060d22 100%);color:#fff;overflow:hidden}
.sbg i{position:absolute;top:-30%;width:40%;height:160%;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 70%);filter:blur(6px);transform-origin:top center;animation:beam 6s ease-in-out infinite alternate}
.sbg i:nth-child(1){left:-5%;transform:rotate(18deg)}.sbg i:nth-child(2){left:30%;transform:rotate(-4deg);animation-delay:1s}.sbg i:nth-child(3){right:-8%;transform:rotate(-20deg);animation-delay:2s}
@keyframes beam{to{opacity:.4}}
.sball{position:relative;width:120px;height:150px;margin-bottom:6px}
.ballsvg{width:96px;height:96px;position:absolute;left:12px;top:0;animation:bdrop 1.6s cubic-bezier(.3,.6,.4,1) both,bfloat 2.4s 1.6s ease-in-out infinite}
.ballpat{transform-origin:50px 50px;animation:bspin 1.6s ease-out both}
.sshadow{position:absolute;left:28px;bottom:6px;width:64px;height:12px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);animation:bshadow 1.6s cubic-bezier(.3,.6,.4,1) both,bshf 2.4s 1.6s ease-in-out infinite}
@keyframes bdrop{0%{transform:translateY(-320px)}45%{transform:translateY(40px) scale(1.08,.9)}60%{transform:translateY(-30px)}75%{transform:translateY(40px) scale(1.04,.95)}88%{transform:translateY(20px)}100%{transform:translateY(30px)}}
@keyframes bspin{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
@keyframes bfloat{0%,100%{transform:translateY(30px)}50%{transform:translateY(18px)}}
@keyframes bshadow{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1)}100%{opacity:.9}}
@keyframes bshf{0%,100%{transform:scale(1)}50%{transform:scale(.85);opacity:.7}}
.stitle{margin:0;font-family:var(--serif);font-weight:800;font-size:64px;letter-spacing:.06em;line-height:1;display:flex}
.stitle span{display:inline-block;opacity:0;transform:translateY(30px) scale(.6);animation:letter .5s cubic-bezier(.2,1.6,.4,1) forwards;background:linear-gradient(180deg,#fff,#ffd35a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 30px rgba(255,197,58,.25)}
@keyframes letter{to{opacity:1;transform:none}}
.ssub{margin:8px 0 22px;font-size:15px;font-weight:600;opacity:0;animation:fadeup .6s 1.3s forwards;letter-spacing:.04em;color:rgba(235,241,255,.85)}
.sbtns{width:100%;max-width:380px;opacity:0;animation:fadeup .6s 1.6s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sgo{width:100%;display:flex;align-items:center;gap:12px;min-height:66px;border:0;border-radius:20px;padding:10px 16px;background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838;text-align:left;box-shadow:0 12px 30px rgba(242,169,0,.4)}
.sgo span{flex:1;display:flex;flex-direction:column}.sgo b{font-family:var(--serif);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}.sgo em{font-style:normal;font-size:13px;font-weight:700;opacity:.8}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.slot{display:flex;align-items:center;gap:12px;min-height:62px;border-radius:18px;padding:8px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.slot .grow{display:flex;flex-direction:column}.slot b{font-size:15px}.slot em{font-style:normal;font-size:12.5px;opacity:.75}.slot small{font-size:11px;opacity:.55}
.slot.empty{border-style:dashed}.splus{width:42px;height:42px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:24px}
.sdel{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:13px}
/* fine stagione */
#recap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.rcbg{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.06) 0 10deg,transparent 10deg 20deg),radial-gradient(circle,#1d47b8,#060d22 70%);animation:rays 30s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.rconf{position:absolute;inset:0;pointer-events:none}
.rconf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.rcin{position:relative;width:100%;max-width:400px;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center}
.rclab{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75;animation:fadeup .5s .2s both}
.rccup{animation:cupin 1s .3s cubic-bezier(.2,1.4,.4,1) both}
.cup{width:70px}.cup.big{width:150px;filter:drop-shadow(0 16px 30px rgba(255,197,58,.5))}
@keyframes cupin{from{opacity:0;transform:translateY(-80px) scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
.rcpos{font-family:var(--serif);font-weight:800;line-height:1;margin-top:8px}
.rcpos b{font-size:120px;background:linear-gradient(180deg,#fff,#ffd35a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rcpos span{font-size:50px;color:#ffd35a;vertical-align:top}
.rcpos.hit{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{50%{transform:scale(1.18)}}
.rcout{display:inline-block;margin-top:4px;font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:.06em;padding:4px 18px;border-radius:12px;animation:fadeup .5s 1.4s both}
.rcout.gold{background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838}.rcout.pos{background:#11a36a}.rcout.neg{background:#e5414b}.rcout.info{background:rgba(255,255,255,.14)}
.rcnext{margin-top:10px;font-size:15px;animation:fadeup .5s 1.6s both}
.rcstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 10px;animation:fadeup .5s 1.8s both}
.rcstats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 4px}
.rcstats span{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.rcstats b{display:block;font-family:var(--serif);font-weight:800;font-size:20px}
.rcstats .pos{color:#2fd28a}.rcstats .neg{color:#ff7a84}
.rctop{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;margin-bottom:16px;animation:fadeup .5s 2s both}
.rctop .ic{color:#ffd35a}
#recap .btn{animation:fadeup .5s 2.2s both}
/* storia */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--accent),var(--gold))}
.tl{position:relative;margin-bottom:12px;animation:tlin .5s both}
@keyframes tlin{from{opacity:0;transform:translateX(-14px)}}
.tldot{position:absolute;left:-22px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tldot .ic{width:14px;height:14px;stroke-width:2.4}
.tldot.gold{background:linear-gradient(180deg,#ffd35a,#f2a900);color:#0a1838;border:0}.tldot.pos{background:var(--pos);color:#fff;border:0}.tldot.neg{background:var(--neg);color:#fff;border:0}
.tlc{margin-left:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.tlh{display:flex;align-items:baseline;gap:8px}.tlh b{font-family:var(--serif);font-weight:800;font-size:20px}.tlh span{font-size:13px;color:var(--muted);flex:1}
.tlp{font-style:normal;font-family:var(--serif);font-weight:800;font-size:22px;width:44px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.tlp.p1{background:linear-gradient(160deg,#f6e3a1,#c9a24a);color:#2a2112}.tlp.p2{background:linear-gradient(160deg,#f4f5f7,#aab2ba)}.tlp.p3{background:linear-gradient(160deg,#e4b183,#a8693b)}
.tlr{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tlg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:6px}
.tlg div{background:var(--surface2);border-radius:10px;padding:6px 8px}.tlg span{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.tlg b{font-family:var(--serif);font-weight:800;font-size:16px}
.tlt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:8px}.tlt .ic{width:14px;height:14px;color:var(--accent)}
/* sala trofei */
.troom{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trc{background:radial-gradient(circle at 50% 30%,#2a3a6b,#0a1838);border-radius:18px;padding:12px 6px;text-align:center;color:#fff;box-shadow:var(--shadow)}
.trc b{display:block;font-size:12px;margin-top:4px}.trc span{font-size:11px;opacity:.7}
.trempty{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:12px;font-size:13.5px;color:var(--muted)}
.trempty .cup{width:46px;opacity:.35;filter:grayscale(1)}
/* notizie aperte */

function todoList(){
  const t = [], st = G.staff, L = lvl();
  if (pending('budget')) t.push(['chart', 'Approva il budget della stagione', 'Senza budget la stagione non parte.', 'budopen', '', 'hot']);
  if (pending('rientro')) t.push(['bank', 'La banca aspetta un piano di rientro', 'Il conto ha sforato il fido: scegli come rientrare.', 'openit', G.inbox.find(x => x.t==='rientro').id, 'hot']);
  const open = G.inbox.filter(x => !x.done && !['budget','rientro'].includes(x.t)).length;
  if (open) t.push(['inbox', `${open} ${open===1 ? 'decisione ti aspetta' : 'decisioni ti aspettano'}`, 'Se non rispondi, decide il dirigente responsabile.', 'tab', 'riunioni', '']);
  for (const [k, l] of [['coach', 'un allenatore'], ['ds', 'un direttore sportivo'], ['dg', 'un direttore generale']]){ const has = k==='coach' ? G.coach : st[k]; if (!has && !G.inbox.some(x => (x.t==='coach' && k==='coach') || (x.t==='staff' && x.d.role===k))) t.push(['users', `Manca ${l}`, 'Assumilo dalla Dirigenza.', 'gosub', 'club:dirigenza', 'hot']); }
  const style = G.coach ? G.coach.style : G.phil.style, form = FORMS[style], need = {P: 2, D: form.D + 1, C: form.C + 1, A: form.A + 1};
  const miss = 'PDCA'.split('').map(r => [r, need[r] - squad().filter(p => p.r===r).length]).filter(([, n]) => n > 0);
  if (miss.length) t.push(['shirt', 'Rosa incompleta', `Mancano ${miss.map(([r, n]) => n + ' ' + ({P:'portieri', D:'difensori', C:'centrocampisti', A:'attaccanti'})[r]).join(', ')}.`, st.ds ? 'rebuild' : 'gosub', st.ds ? '' : 'squadra:mercato', 'hot']);
  if (monte() > G.budget.w*1.02) t.push(['coins', 'Monte ingaggi sopra il tetto', `${eur(monte())} contro ${eur(G.budget.w)}: alza il tetto o fai intervenire il DS.`, 'gosub', 'squadra:mercato', '']);
  if (fst('giard') < giardNeed()) t.push(['grass', 'Mancano giardinieri', `Ne servono ${giardNeed()}, ne hai ${fst('giard')}: il campo si rovina.`, 'gosub', 'club:strutture', '']);
  if (fst('istr') < istrNeed()) t.push(['clipboard', 'Mancano istruttori del vivaio', `Ne servono ${istrNeed()}, ne hai ${fst('istr')}.`, 'gosub', 'club:strutture', '']);
  if (stadLv() < L.minStad) t.push(['stadium', 'Stadio sotto il minimo di categoria', `Serve almeno: ${FAC.stadio.lv[L.minStad]}.`, 'gosub', 'club:strutture', 'hot']);
  if (marketOpen() && G.staff.ds && !G.inbox.some(x => x.t==='plan')){ const left = G.week < 4 ? 4 - G.week : winterStart() + 3 - G.week; if (left > 0 && left <= 2) t.push(['calendar', `Il mercato chiude tra ${left} ${left===1 ? 'settimana' : 'settimane'}`, 'Ultimi giorni per acquisti e cessioni.', 'gosub', 'squadra:mercato', '']); }
  try { const c = budCalc({w: G.budget.w, t: 0, fac: 0, ev: 0, cap: 0}); if (c.cashEnd < -fido()) t.push(['alert', 'A fine stagione sforeremo il fido', `Cassa prevista ${eur(c.cashEnd)}: vedi dove tagliare.`, 'gosub', 'club:finanze', 'hot']); } catch(e){}
  return t;
}

function dropFromMarket(p, src){

function sellPlayer(pid, f, to){

// ---- Piano del direttore sportivo
const DS_TRAITS = {

const dsTrait = () => (G.staff.ds && G.staff.ds.trait) || 'equilibrato';
const DIR0 = {eta: 'auto', zero: false, clOwn: true, clPay: true, keepXI: true, plusv: false, vivaio: true, maxSal: 0};
const dsDir = () => (G.dsDir = Object.assign({}, DIR0, G.dsDir || {}));
function dsPlan(winter){

  const off = !marketOpen(), D = dsDir(), TR = dsTrait(), L = lvl();
  if (off){ const fr = G.pool.filter(p => p.free).length; for (let i = fr; i < 14; i++){ const p = mkPlayer(G.lv, {o: L.ovr - 3 + gauss()*3, a: ri(20, 34), r: 'PDDCCAA'[i % 7]}); p.free = true; p.club = 'Svincolato'; G.pool.push(p); } }
  const style = G.coach ? G.coach.style : G.phil.style, form = FORMS[style];
  const ideal = {P: G.lv >= 6 ? 3 : 2, D: form.D + 2, C: form.C + 2, A: Math.max(3, form.A + 2)};
  const minR = {P: 2, D: form.D + 1, C: form.C + 1, A: form.A + 1};
  const others = G.league.teams.filter(t => t.id!=='me' && t.id!=='ng');
  const target = (TIER[G.lv] ? mean(others.map(t => t.str)) : L.ovr) + {salvezza: -2, meta: 0, promozione: 3}[G.budget.goal];
  const eta = D.eta!=='auto' ? D.eta : TR==='giovani' ? 'giovani' : TR==='vincente' ? 'esperti' : G.phil.pol==='giovani' ? 'giovani' : G.phil.pol==='esperienza' ? 'esperti' : 'auto';
  const val = (p, o = p.o) => o + (PREF[style][p.prof] ?? -1) + (eta==='giovani' && p.a <= 23 ? 1.5 + Math.max(0, p.p - p.o)*0.08 : 0) + (eta==='esperti' && p.a >= 26 && p.a <= 31 ? 1.2 : 0) - (p.a >= 31 ? (p.a - 30)*0.8 : 0);
  const sq = squad(), xi = new Set(bestXI().map(x => x.id));
  const byRole = r => sq.filter(p => p.r===r && !sellSet.has(p.id)).sort((a, b) => val(b) - val(a));
  // ---------- uscite
  let sellSet = new Set(), sells = [];
  const addSell = (p, why) => { if (sellSet.has(p.id)) return; if (D.keepXI && xi.has(p.id) && why!=='list') return; if (why!=='list' && why!=='tetto' && p.a <= 22 && p.p >= p.o + 5) return; sellSet.add(p.id); sells.push({p, why}); };
  sq.filter(p => p.list).forEach(p => addSell(p, 'list'));
  if (G.budget.mode!=='buy'){
    for (const r of 'PDCA'){ const list = byRole(r); list.slice(ideal[r]).reverse().forEach(p => addSell(p, 'esubero')); list.slice(form[r], ideal[r]).forEach(p => { if ((val(p) < target - 8 || p.a >= 33) && byRole(r).length > minR[r]) addSell(p, 'rendimento'); }); }
    if (TR==='plusvalenze' || D.plusv) sq.filter(p => !xi.has(p.id) && p.a >= 23 && p.a <= 28 && valueOf(p) > Math.max(1000, (p.paid || p.bk || 0)*1.8)).slice(0, 2).forEach(p => { if (byRole(p.r).length > minR[p.r]) addSell(p, 'plusvalenza'); });
  }
  // ---------- budget
  const rient = rientroActive();
  const saleVal = p => off ? 0 : quickSale(p);
  const feeReq = Math.max(0, (G.budget.t || 0) - (G.budget.spentT || 0)), feeCash = Math.max(0, G.fin.cash + fido()*0.5), feeBase = off ? 0 : Math.min(feeReq, G.fin.plan ? Math.max(0, G.fin.cash - G.fin.plan.rata*3) : rient ? 0 : feeCash);
  const feeBudget = () => feeBase + sum(sells.map(x => saleVal(x.p)))*0.6 - spentF;
  const soldWages = () => sum(sells.map(x => wageOfP(x.p)));
  let spentF = 0, addW = 0;
  const wageRoom = () => G.budget.w - (monte() - soldWages()) - addW;
  // ---------- candidati
  const errMul = TR==='scout' ? 0.55 : 1;
  const eO = p => p.o + p.e*errScale()*(1 - dsQ()*0.6)*0.8*errMul;
  let cands = G.budget.mode==='sell' ? [] : marketList().filter(({p}) => (!off || p.free) && (D.eta!=='giovani' || p.a <= 23) && (D.eta!=='esperti' || p.a >= 26) && (!D.maxSal || demandWage(p) <= D.maxSal))
    .map(({p, src}) => ({p, src, ev: val(p, eO(p)), f: askPrice(p, src), s: demandWage(p)}));
  if (!off && feeBase > 0 && G.budget.mode!=='sell'){ const fees = cands.map(c => c.f).filter(f => f > 0), avgF = fees.length ? mean(fees) : L.feeScale; const key = G.season*10 + (winter ? 1 : 0);
    if (feeBase > avgF*5 && G.poolUp!==key){ G.poolUp = key; for (let i = 0; i < 12; i++){ const lvU = Math.min(8, G.lv + 1 + (i % 2)), p = mkPlayer(lvU, {r: 'PDDCCCAA'[i % 8]}); p.up = true; p.club = clubName(lvU); G.pool.push(p); } }
    cands = G.budget.mode==='sell' ? [] : marketList().filter(({p}) => (D.eta!=='giovani' || p.a <= 23) && (D.eta!=='esperti' || p.a >= 26) && (!D.maxSal || demandWage(p) <= D.maxSal)).map(({p, src}) => ({p, src, ev: val(p, eO(p)), f: askPrice(p, src), s: demandWage(p)*(p.up ? 1.25 : 1)})); }
  const freeAgent = (r, wMax) => { const p = mkPlayer(G.lv, {r, o: L.ovr - 5 + gauss()*2, a: ri(D.eta==='giovani' ? 19 : 24, D.eta==='giovani' ? 22 : 33)}); p.free = true; p.club = 'Svincolato'; const s0 = demandWage(p); if (s0 > wMax) return null; G.pool.push(p); const c = {p, src: 'pool', ev: val(p, eO(p)), f: 0, s: s0}; cands.push(c); return c; };
  const cheapW = r => { const ws = cands.filter(c => c.p.r===r && c.f===0).map(c => c.s); return Math.min(...ws, wageOf(L.ovr - 5, G.lv)); };
  const score = c => { let sc = c.ev*(TR==='vincente' ? 1.3 : 1) - c.f/Math.max(1, L.feeScale)*(TR==='risparmio' ? 4 : TR==='vincente' ? 1 : 2) - c.s/Math.max(1, L.salFloor*4)*(TR==='risparmio' ? 1.2 : 0.6);
    if (c.f===0 && (D.zero || TR==='risparmio')) sc += 3; if (TR==='plusvalenze') sc += clamp((valueOf(c.p) - c.f)/Math.max(1, c.f + 500), 0, 3); if (TR==='giovani' && c.p.a <= 23) sc += 1.5 + Math.max(0, c.p.p - c.p.o)*0.1; return sc + gauss()*(1 - dsQ())*1.2; };
  const buys = [], used = new Set(), promos = [];
  const bought = {P: [], D: [], C: [], A: []};
  const take = c => { buys.push({pid: c.p.id, src: c.src, f: c.f, s: c.s}); used.add(c.p.id); spentF += c.f; addW += c.s; bought[c.p.r].push(c.ev); };
  // ---------- 0) risanamento: se col tetto non ci stiamo, via chi pesa troppo, poi lo si rimpiazza con ricambi economici
  { const fillCost = () => sum('PDCA'.split('').map(r => Math.max(0, minR[r] - byRole(r).length)*cheapW(r)));
    let proj = monte() - soldWages();
    if (proj + fillCost() > G.budget.w){
      const dc = sq.filter(p => !sellSet.has(p.id) && !(D.keepXI && xi.has(p.id)) && p.s > cheapW(p.r)*1.3).sort((a, b) => b.s - a.s);
      for (const p of dc){ if (proj + fillCost() <= G.budget.w*0.97) break; addSell(p, 'tetto'); proj -= wageOfP(p); }
    } }
  // ---------- 1) ruoli scoperti: prima il vivaio, poi i ricambi, riservando lo stipendio per gli altri buchi
  const count = r => byRole(r).length + bought[r].length + promos.filter(k => k.r===r).length;
  const roleVals = r => byRole(r).map(p => val(p)).concat(bought[r], promos.filter(k => k.r===r).map(k => k.o)).sort((a, b) => b - a);
  const missingAll = () => 'PDCA'.split('').reduce((s2, r) => s2 + Math.max(0, minR[r] - count(r)), 0);
  const shortfall = [];
  const order = 'PDCA'.split('').sort((a, b) => (count(a) - minR[a]) - (count(b) - minR[b]));
  for (const r of order){
    while (count(r) < minR[r]){
      if (D.vivaio || TR==='giovani'){ const k = G.youth.filter(y => y.r===r && y.a >= 16 && !promos.includes(y)).sort((a, b) => b.o - a.o)[0]; if (k && k.o >= target - 12){ promos.push(k); continue; } }
      const reserve = sum('PDCA'.split('').filter(x => x!==r).map(x => Math.max(0, minR[x] - count(x))*cheapW(x)));
      const wMax = wageRoom() - reserve;
      let pool = cands.filter(c => c.p.r===r && !used.has(c.p.id) && c.s <= wMax && c.f <= feeBudget() && c.ev >= target - 14 && (c.p.up || !(c.p.o > L.ovr + 12)));
      let c = pool.sort((a, b) => score(b) - score(a))[0] || freeAgent(r, wMax);
      if (!c){ shortfall.push([r, minR[r] - count(r), cheapW(r)]); break; }
      take(c);
    }
  }
  // ---------- 2) profondità e rinforzi, nei limiti del budget
  const maxBuys = winter ? 5 : 9;
  for (const r of 'PDCA'.split('').sort((a, b) => (count(a) - ideal[a]) - (count(b) - ideal[b]))){
    let guard = 0;
    while (buys.length < maxBuys && guard++ < 3){
      const rv = roleVals(r), weakest = rv.length >= form[r] ? rv[form[r] - 1] : target - 10;
      if (count(r) >= ideal[r] + 1 || squad().length - sells.length + buys.length >= 26) break;
      const rich = feeBase > 0 && feeBudget() > feeBase*0.2;
      const wantDepth = count(r) < ideal[r], wantUp = weakest < target || rich;
      if (!wantDepth && !wantUp) break;
      const bar = wantUp ? weakest + (rich && weakest >= target ? 2.5 : 1.5) : target - 8;
      const pool = cands.filter(c => c.p.r===r && !used.has(c.p.id) && c.s <= wageRoom() && c.f <= feeBudget() && c.ev > bar && (c.p.up || !(c.p.o > L.ovr + 12)));
      const room = Math.max(1, feeBudget());
      const sUp = c => rich ? c.ev*1.4 - c.f/room*3 - c.s/Math.max(1, wageRoom())*2 + (TR==='giovani' && c.p.a <= 23 ? 1.5 : 0) + (TR==='plusvalenze' ? clamp((valueOf(c.p) - c.f)/Math.max(1, c.f + 500), 0, 2) : 0) : score(c);
      const c = pool.sort((a, b) => sUp(b) - sUp(a))[0]; if (!c) break;
      take(c);
      if (!wantDepth){ const w = byRole(r).slice(form[r]).sort((a, b) => val(a) - val(b))[0]; if (w && count(r) > ideal[r]) addSell(w, 'esubero'); }
    }
  }
  const sellRows = sells.map(({p, why}) => { const f = saleVal(p); return {pid: p.id, f, rel: off || f < 100, why, dump: why==='tetto'}; });
  // ---------- 3) se il monte supera ancora il tetto, cede chi pesa di più e non è indispensabile
  let over = (monte() - soldWages() + addW) - G.budget.w;

    const dc = sq.filter(p => !sellSet.has(p.id) && !(D.keepXI && xi.has(p.id)) && byRole(p.r).length > minR[p.r]).sort((a, b) => (b.s - a.s));
    for (const p of dc){ if (over <= 0) break; addSell(p, 'tetto'); sellRows.push({pid: p.id, f: saleVal(p), rel: off || saleVal(p) < 100, why: 'tetto', dump: true}); over -= wageOfP(p); }
  }
  if (!buys.length && !sellRows.length && !promos.length){ news(shortfall.length ? `Il DS segnala: rosa corta, ma il tetto ingaggi di ${eur(G.budget.w)} non permette nuovi innesti.` : 'Il DS non vede operazioni utili in questa finestra.', shortfall.length ? 'neg' : ''); return; }
  const sel = {}; buys.forEach((b, i) => sel['b' + i] = true); sellRows.forEach((s, i) => sel['s' + i] = true);
  const pit = addItem('plan', 'Direttore sportivo', off ? 'Piano di risanamento (mercato chiuso)' : winter ? 'Piano di mercato di gennaio' : 'Piano di mercato estivo',
    `Modulo ${form.m} · obiettivo ${{salvezza:'salvezza', meta:'metà classifica', promozione:'vertice'}[G.budget.goal]} · cartellini ${eur(G.budget.t)} · tetto ingaggi ${eur(G.budget.w)}.`,
    {buys, sells: sellRows, sel, promos: promos.map(k => k.id), feeReq, feeBase, feeCash, wcap: G.budget.w}, 0, true);
  pit.chat = []; pit.autoAt = G.week + 1; pit.d.off = off; const pS = SAY; SAY = pit.chat;
  const cov = 'PDCA'.split('').map(r => `${count(r)} ${({P:'P', D:'D', C:'C', A:'A'})[r]}`).join(' · ');
  dsSay(`Presidente, ecco il ${off ? 'piano di risanamento' : winter ? 'piano di gennaio' : 'piano estivo'} (${DS_TRAITS[TR].n.toLowerCase()}): ${buys.length} ${buys.length===1 ? 'acquisto' : 'acquisti'}, ${sellRows.length} ${sellRows.length===1 ? 'uscita' : 'uscite'}${promos.length ? ', ' + promos.length + ' dal vivaio' : ''}. Copertura ruoli dopo il piano: ${cov}. Spesa cartellini ${eur(spentF)}, monte ingaggi previsto ${eur(monte() - soldWages() + addW)} su ${eur(G.budget.w)}.`);
  if (off) dsSay('Il mercato è chiuso: posso solo svincolare e tesserare svincolati. Il resto alla prossima finestra.');
  if (G.fin.plan) dsSay(`Col piano di rientro posso spendere solo la cassa oltre la riserva per le rate: al massimo ${eur(Math.max(0, G.fin.cash - G.fin.plan.rata*3))}.`);

  if (shortfall.length) dsSay(`Con il tetto attuale la rosa resta corta: mancano ${shortfall.map(([r, n]) => n + ' ' + ({P:'portieri', D:'difensori', C:'centrocampisti', A:'attaccanti'})[r]).join(' e ')}. Servirebbero circa ${eur(sum(shortfall.map(([r, n, w]) => n*w)))} in più di tetto o qualche cessione.`, [['bw+','Alza il tetto ingaggi del 15%'],['ok','Va bene così']]);

}

  if (it){ it.read = true; openItemHere(it); }

function execPlan(d, all){
  let done = 0; const failed = [], capped = [];
  (d.promos || []).forEach(id => { const k = G.youth.find(y => y.id===id); if (k){ G.youth = G.youth.filter(y => y!==k); G.players.push(kidToPlayer(k)); news(`${k.n} promosso in prima squadra dal vivaio.`, 'pos'); done++; } });
  let feeLeft = (rientroActive() ? 0 : Math.max(0, Math.min(G.budget.t, G.fin.cash + fido()*0.5)));
  d.sells.forEach((s, i) => { if (!all && !d.sel['s' + i]) return; if (!G.players.find(p => p.id===s.pid)) return; if (s.rel) releasePlayer(s.pid); else { sellPlayer(s.pid, s.f); feeLeft += s.f*0.6; } done++; });
  d.buys.forEach((b, i) => {
    if (!all && !d.sel['b' + i]) return;
    const m = findMarket(b.pid); if (!m){ return; }
    if (monte() + demandWage(m.p) > G.budget.w){ capped.push(m.p.n); return; }
    if (b.f > feeLeft){ capped.push(m.p.n + ' (budget cartellini)'); return; }
    if (buyPlayer(m.p, m.src, b.f)){ done++; feeLeft -= b.f; G.budget.spentT = (G.budget.spentT || 0) + b.f; } else failed.push(m.p.n);
  });
  if (capped.length) dsSay(`Non ho preso ${capped.join(', ')}: avremmo sforato il budget approvato.`);
  toast(`${done} operazioni concluse`);
  if (failed.length) dsSay(`Non sono riuscito a chiudere ${failed.join(', ')}: ${G.fin.cash < 0 ? 'manca liquidità' : 'qualcuno ha rifiutato'}. Se vuole rifaccio il piano.`, marketOpen() ? [['replan','Rifai il piano'],['ok','Va bene così']] : null);
}

function offerFor(){
  const sq = G.players.filter(p => valueOf(p) > 0);
  if (!sq.length) return;
  const listed = sq.filter(p => p.list);
  const pool = listed.length && Math.random() < .6 ? listed : sq;
  const w = pool.map(p => Math.sqrt(valueOf(p)) + (p.o > lvl().ovr + 4 ? 50 : 0));
  let r = Math.random()*sum(w), j = 0; while (r > w[j]){ r -= w[j]; j++; }
  const p = pool[Math.min(j, pool.length-1)];
  if (G.inbox.some(x => x.t==='offer' && x.d.pid===p.id)) return;
  const up = p.o > lvl().ovr + 3 && G.lv < 8;
  const tlv = clamp(G.lv + (up ? 1 : 0), 0, 8);
  const club = TIER[tlv] ? pick(G.world[TIER[tlv]].filter(t => t.id!=='me' && t.id!=='ng')).n : clubName(tlv);
  const f = roundFee(valueOf(p)*rnd(0.75, 1.3)*(up ? 1.15 : 1));
  addItem('offer', 'Direttore sportivo', `Offerta per ${p.n}`, `${club} offre ${eur(f)} per il cartellino.`, {pid: p.id, f, club, op: offerAdvice(p, f).txt}, G.week + 2);
  startItemNeg(G.inbox[G.inbox.length - 1], {kind: 'offer', pid: p.id}); scheduleAuto(G.inbox[G.inbox.length - 1]);
}

function decide(id, key){
  const it = G.inbox.find(x => x.id===id); if (!it) return;
  if (key==='arch'){ G.inbox = G.inbox.filter(x => x!==it); save(); render(); return; }
  const d = it.d; let keep = false;
  switch (it.t){
    case 'staff':
      if (key==='keep'){ news(`${G.staff[d.role].n} resta ${STAFF_ROLES[d.role].toLowerCase()}.`); break; }
      if (key==='altri'){ d.c = [mkStaff(d.role, G.lv), mkStaff(d.role, G.lv), mkStaff(d.role, G.lv)]; d.rr = true; keep = true; break; }
      if (d.role!=='ds' && (G.staff.dg || G.staff.ds) && !G.auto){ keep = true; startItemNeg(it, {kind: 'staff', idx: +key, role: d.role}); if (d.manual) it.manual = true; else { negAuto(it); if (it.neg && it.neg.stage!=='done') it.manual = true; } break; }
      hireStaff(d.role, d.c[+key]); break;
    case 'coach':
      if (key==='altri'){ d.c = [mkCoach(G.lv), mkCoach(G.lv), mkCoach(G.lv)]; d.rr = true; keep = true; break; }
      if (G.staff.ds && !G.auto){ keep = true; startItemNeg(it, {kind: 'staff', idx: +key, role: 'coach'}); if (d.manual) it.manual = true; else { negAuto(it); if (it.neg && it.neg.stage!=='done') it.manual = true; } break; }
      G.coach = d.c[+key]; G.coach.mood = 70;
      news(`${G.coach.n} è il nuovo allenatore (${STYLES[G.coach.style].toLowerCase()}).`, 'pos');
      if (marketOpen() && !pending('plan')) dsPlan(G.week > 3);
      break;
    case 'plan':
      if (key==='no') news('Hai bocciato il piano di mercato del DS.');
      else execPlan(d, key==='all');
      break;
    case 'budget': keep = true; setTimeout(() => ACT.budopen(), 30); break;
    case 'kit': if (key==='open'){ G.inbox = G.inbox.filter(x => x!==it); setTimeout(openKit, 30); return; } break;
    case 'offer': if (key==='chat'){ keep = true; startItemNeg(it, {kind: 'offer', pid: d.pid}); break; } if (key==='si') sellPlayer(d.pid, d.f); break;
    case 'rientro':
      if (key==='p12' || key==='p24' || key==='p36') acceptPlan(+key.slice(1));
      else if (key==='cap'){ const need = roundFee(-G.fin.cash + fido()*0.2 + lvl().salFloor*4); if (G.pres.wealth < need){ toast('Il tuo patrimonio non basta: servono ' + eur(need)); keep = true; break; } G.pres.wealth -= need; G.fin.cash += need; G.fin.capIn += need; news(`Il presidente ricapitalizza la società con ${eur(need)}: lo scoperto è coperto.`, 'pos'); }
      else if (key==='sell'){
        const xi = new Set(bestXI().map(p => p.id));
        const list = squad().filter(p => valueOf(p) > 0).sort((a, b) => (xi.has(a.id) - xi.has(b.id)) || valueOf(b) - valueOf(a));
        let got = 0; for (const p of list){ if (G.fin.cash >= 0) break; const f2 = roundFee(valueOf(p)*0.75); sellPlayer(p.id, f2); got += f2; }
        news(`Cessioni concordate con la banca per ${eur(got)}.`, got ? 'neg' : '');
        if (G.fin.cash < -fido()){ toast('Le cessioni non bastano: serve anche il piano o il capitale'); G.inbox = G.inbox.filter(x => x!==it); rientroItem(); keep = true; }
      }
      if (!keep) G.fin.unpaid = 0;
      break;
    case 'phil':
      if (key==='si') setPhil('style', d.style, true);
      else if (G.coach){ G.coach.mood -= 20; G.players.forEach(p => p.m = clamp(p.m - 3, 0, 100)); news('Hai respinto la richiesta dell’allenatore. Non l’ha presa bene.'); }
      break;
    case 'sponsor':
      if (key!=='no'){ const o = d.o[+key]; G.sponsors[d.kind] = o; news(`Firmato lo sponsor ${d.kind==='maglia' ? 'di maglia' : 'tecnico'}: ${o.n}, ${eur(o.v)} all’anno.`, 'pos'); }
      break;
    case 'ads':
      if (key==='si'){ const free = boards() - G.ads.boards.length; d.o.slice(0, free).forEach(o => G.ads.boards.push(o)); news(`Venduti ${Math.min(free, d.o.length)} cartelloni pubblicitari.`, 'pos'); }
      break;
    case 'naming':
      if (key==='si'){ G.ads.naming = {n: d.n, v: d.v, y: d.y}; news(`Lo stadio si chiamerà ${d.n}: ${eur(d.v)} all’anno.`, 'pos'); }
      break;
    case 'affil':
      if (key==='si'){ G.affil.push(d.club); book('affil', d.club.cost); news(`Accordo di affiliazione con ${d.club.n}.`, 'pos'); }
      break;
    case 'talent':
      if (key==='si'){
        const k = d.k;
        if (G.fin.cash - d.fee < -fido()){ toast('Liquidità insufficiente'); keep = true; break; }
        if (k.a >= 18){
          G.fin.cash -= d.fee; const p = kidToPlayer(k); p.bk = d.fee; p.am = d.fee/3; G.players.push(p);
          news(`${k.n} arriva in prima squadra.`, 'pos');
        } else {
          const c = catOf(k.a);
          if (G.youth.filter(x => catOf(x.a)===c).length >= catCap(c)){ toast(`Categoria ${c.n} al completo: amplia il centro giovanile o libera un posto`); keep = true; break; }
          G.fin.cash -= d.fee; G.youth.push(k); news(`${k.n} (${k.a} anni) entra nei ${c.n.toLowerCase()}.`, 'pos');
        }
      }
      break;
    case 'fire':
      if (key==='si' && G.coach){ book('svinc', G.coach.s*0.3); news(`${G.coach.n} è stato esonerato.`, 'neg'); G.coach = null; coachItem(''); }
      else if (G.coach) G.coach.mood = clamp(G.coach.mood + 10, 0, 100);
      break;
    case 'renew': {
      const p = G.players.find(x => x.id===d.pid);
      if (key==='chat'){ keep = true; startItemNeg(it, {kind: 'renew', pid: d.pid}); break; }
      if (key==='no' && p) p.noRenew = true;
      if (p && key==='si'){ p.c += d.y; p.s = d.sal; p.m = clamp(p.m + 8, 0, 100); news(`${p.n} rinnova per ${d.y} ${d.y===1 ? 'anno' : 'anni'}.`); }
      break; }
    case 'promote':
      if (key==='si'){ G.players.push(kidToPlayer(d.k)); news(`${d.k.n} promosso in prima squadra dal vivaio.`, 'pos'); }
      else news(`${d.k.n} lascia il vivaio.`);
      break;
  }
  if (!keep) G.inbox = G.inbox.filter(x => x!==it);
  save(); render();
}
function kidToPlayer(k){
  const p = {id: k.id, n: k.n, a: k.a, r: k.r, o: k.o, p: k.p, e: k.e, ep: k.ep, m: 75, s: 0, c: 3, bk: 0, am: 0, al: k.al, inj: 0, gl: 0, as: 0, pr: 0, viv: true, hist: [], prof: k.prof || pick(Object.keys(PROFILES))};
  if (G.players) logTrf({d: 'in', type: 'vivaio', n: k.n, r: k.r, o: k.o, a: k.a, fee: 0});
  p.s = r50(Math.max(lvl().salFloor*0.5, wageOf(p.o, G.lv)*0.6));
  return p;
}
function hireStaff(role, c){
  if (role==='os'){ G.staff.os.push(c); news(`${c.n} entra nella rete degli osservatori.`); return; }
  const old = G.staff[role];
  if (old) book('svinc', old.s*0.25);
  G.staff[role] = c;
  news(`${c.n} è il nuovo ${STAFF_ROLES[role].toLowerCase()}.`, 'pos');
  if (role==='ds' && !G.coach && !pending('coach')) coachItem('Per prima cosa serve un allenatore.');
  if (role==='dg'){ if (!G.sponsors.maglia && !pending('sponsor')) sponsorItem('maglia'); else if (!G.sponsors.tecnico && !pending('sponsor')) sponsorItem('tecnico'); }
}
function setPhil(k, v, fromCoach){
  if (G.phil[k]===v) return;
  G.phil[k] = v;
  G.players.forEach(p => p.al = Math.round(p.al*0.65));
  G.youth.forEach(p => p.al = Math.round(p.al*0.8));
  if (G.coach){
    if (fromCoach) G.coach.mood = clamp(G.coach.mood + 20, 0, 100);
    else if (k==='style' && v!==G.coach.style && COMPAT[G.coach.style]!==v) G.coach.mood -= 25;
  }
  news(`Nuova filosofia: ${k==='style' ? STYLES[v] : POLICIES[v]}. L’identità costruita in parte si perde.`);
}

function playRound(lg, md, kind){
  const L = LV[lg.lv];
  const ob = 0.5 + (lg.lv >= 6 ? 1.5 : 0);
  const S = id => id==='me' ? myStrength() : id==='ng' ? ngStrength() : teamById(id, lg).str + ob;
  for (const [h, a] of lg.sched[md-1]){
    const th = teamById(h, lg), ta = teamById(a, lg);
    const sh = S(h) + (h==='me' && kind==='main' && shareLv('stadio')===2 ? 0.6 : 1.2) + (h==='me' && kind==='main' ? ((G.pitch ?? 60) - 60)/40 + mod('manto')*0.1 : 0), sa = S(a);
    const dv = lg.lv >= 6 ? 11 : 9, gh = poisson(Math.min(3.3, 1.35*Math.exp((sh - sa)/dv))), ga = poisson(Math.min(3, 1.1*Math.exp((sa - sh)/dv)));
    for (const [t, gf, gs] of [[th, gh, ga], [ta, ga, gh]]){
      t.gf += gf; t.ga += gs;
      if (gf > gs){ t.w++; t.pts += 3; } else if (gf===gs){ t.d++; t.pts++; } else t.l++;
    }
    if (lg.lv >= 6){
      const sh2 = recordGoals(lg, h, gh), sa2 = recordGoals(lg, a, ga);
      (lg.lastRound = lg.lastRoundMd===md ? lg.lastRound : []).push({h: th.n, a: ta.n, gh, ga, s: (th.str || 75) + (ta.str || 75), sc: sh2.concat(sa2).slice(0, 4)}); lg.lastRoundMd = md;
    }
    const mine = kind==='main' ? 'me' : kind==='ng' ? 'ng' : '__';
    if (h!==mine && a!==mine) continue;
    const home = h===mine, gf = home ? gh : ga, gs = home ? ga : gh, opp = home ? ta : th;
    if (kind==='ng'){
      G.ng.results.push({md, opp: opp.n, home, gf, ga: gs});
      G.players.filter(p => p.ng).forEach(p => { p.pr++; p.m = clamp(p.m + (gf > gs ? 3 : gf===gs ? 0 : -3), 0, 100); });
      continue;
    }
    const R = {md, opp: opp.n, oppId: opp.id, home, gf, ga: gs, sc: [], st: null, att: home ? attendance(opp.str) : null};
    { const s1 = matchStats(sh, sa, gh, ga); R.st = home ? s1 : {ph: 100 - s1.ph, th: s1.ta, ta: s1.th, oh: s1.oa, oa: s1.oh, ch: s1.ca, ca: s1.ch, fh: s1.fa, fa: s1.fh}; if (!home){ const t = R.st; [t.ph, t.th, t.ta, t.oh, t.oa, t.ch, t.ca, t.fh, t.fa] = [100 - s1.ph, s1.ta, s1.th, s1.oa, s1.oh, s1.ca, s1.ch, s1.fa, s1.fh]; } }
    G.results.push(R);
    const xi = bestXI(); R.mvp = (xi.slice().sort((a, b) => (b.o + Math.random()*8) - (a.o + Math.random()*8))[0] || {}).n;
    const injP = 0.02*(1.4 - paQ()*0.4 - G.fac.centro.lv*0.06)*Math.max(0.4, 1 - mod('palestra')*0.08 - fst('fisio')*0.05 - mod('recupero')*0.04)*(home ? 1.3 - (G.pitch ?? 60)/250 : 1);
    xi.forEach(x => { const p = G.players.find(y => y.id===x.id); if (!p) return; p.pr++; p.m = clamp(p.m + (gf > gs ? 5 : gf===gs ? 1 : -5), 0, 100);
      if (Math.random() < injP){ p.inj = Math.max(1, Math.round(ri(1, 6)*Math.max(0.35, 1 - mod('medico')*0.18 - fst('fisio')*0.08))); news(`${p.n} si è infortunato: fuori ${p.inj} settimane.`, 'neg'); } });
    for (let i = 0; i < gf; i++){
      const w = xi.map(p => (p.r==='A' ? 5 : p.r==='C' ? 2.5 : p.r==='D' ? 0.8 : 0.05)*Math.max(1, p.o - 20));
      let r = Math.random()*sum(w), j = 0; while (j < w.length - 1 && r > w[j]){ r -= w[j]; j++; }
      const sc = G.players.find(y => y.id===xi[j]?.id); if (sc){ sc.gl++; R.sc.push(sc.n);
        if (Math.random() < 0.78){ const cand = xi.filter(x => x.id!==sc.id), aw = cand.map(p => (p.r==='C' ? 4 : p.r==='A' ? 3 : p.r==='D' ? 1.2 : 0.05)*Math.max(1, p.o - 20)); let r2 = Math.random()*sum(aw), k2 = 0; while (k2 < aw.length - 1 && r2 > aw[k2]){ r2 -= aw[k2]; k2++; } const asP = G.players.find(y => y.id===cand[k2]?.id); if (asP) asP.as = (asP.as || 0) + 1; }
        if (lg.lv >= 6){ const k = {8:'A',7:'B',6:'C'}[lg.lv], e = G.scorers[k]['m' + sc.id] || (G.scorers[k]['m' + sc.id] = {n: sc.n, t: G.club.n, g: 0}); e.g++; } }
    }
    if (home){
      const att = attendance(opp.str);
      book('bigl', Math.max(0, att - G.fans.abb)*G.ticket);
      const gross = att*SPEND[G.fac.ristoro.lv]*(0.8 + G.fans.loy/250)*(1 + G.lv*0.12)*(1 + fst('comm')*0.08);
      if (mod('skybox')) book('vip', [0, 20, 120, 500][mod('skybox')]*G.ticket*6*(1 + G.lv*0.1));
      if (mod('parcheggi')) book('servizi', att*0.25*mod('parcheggi')*(1 + G.lv*0.1));
      book('ristoro', gross); book('cogs', gross*0.4);
      book('gest', (L.match + att*0.25*(1 + G.lv*0.15))*(1 - assetCut('gestione')));
      G.fans.lastAtt = att;
    } else book('trasf', L.travel*(1 - assetCut('trasferte')));
    news(home ? `${G.club.n} ${gf}–${gs} ${opp.n}` : `${opp.n} ${gs}–${gf} ${G.club.n}`, gf > gs ? 'pos' : gf < gs ? 'neg' : '');
  }
  for (const t of lg.teams) if (t.id!=='me' && t.id!=='ng') t.str += rnd(-0.2, 0.2);
}

let seasonEnd = false;
function advanceWeek(){
  if (G.over) return;
  const prevM = monthOf(G.week);
  G.week++;
  G.players.forEach(p => { if (p.inj > 0) p.inj--; if (mod('recupero') && p.m < 70) p.m = Math.min(70, p.m + mod('recupero')*0.4); });
  if (G.week===winterStart()){ G.pool = mkPool(); news('Si apre il mercato di gennaio.'); }
  if ((G.week===1 && G.budget.approved===G.season) || G.week===winterStart()) dsPlan(G.week!==1);
  if ((G.week===2 || G.week===winterStart() + 1) && G.staff.gp){
    const xi = new Set(bestXI().map(x => x.id));
    const form = FORMS[G.coach ? G.coach.style : G.phil.style], keep = new Set();
    'PDCA'.split('').forEach(r => squad().filter(p => p.r===r).sort((a, b) => b.o - a.o).slice(0, (r==='P' ? 1 : form[r]) + 1).forEach(p => keep.add(p.id)));
    squad().filter(p => p.a <= 22 && !xi.has(p.id) && !keep.has(p.id) && !p.list && p.p >= p.o + 5 && squad().filter(q => q.r===p.r).length > (p.r==='P' ? 2 : form[p.r] + 1)).sort((a, b) => (b.p - b.o) - (a.p - a.o)).slice(0, 2).forEach(p => startLoan(p.id, true));
  }
  for (const it of G.inbox.slice()){
    if (it.neg && !it.manual && !it.done && it.autoAt!==undefined && G.week >= it.autoAt) negAuto(it);
    else if (it.t==='plan' && !it.manual && it.autoAt!==undefined && G.week >= it.autoAt && (marketOpen() || it.d.off)){ news('Il DS ha eseguito il piano di mercato.'); decide(it.id, 'all'); }
  }
  const md = matchdayOf(G.week);
  if (md){
    playRound(G.league, md, 'main');
  }
  paceWorld(false);
  mediaWeek();
  weeklyEvents();
  const m = monthOf(G.week);
  if (m!==prevM) settleMonth(prevM);
  if (G.week >= G.W){ settleMonth(11); seasonEnd = true; }
}
function advance(toDecision){
  if (!G || G.over) return;
  if (pending('rientro')){ toast('Prima serve il piano di rientro con la banca'); openItemHere(G.inbox.find(x => x.t==='rientro')); return; }
  if (pending('budget')){ toast('Prima conferma il budget della stagione'); ACT.budopen(); return; }
  if (seasonEnd){ endSeason(); return; }
  G.newItems = 0;
  let n = 0;
  do { advanceWeek(); n++; } while (toDecision && !seasonEnd && !G.over && G.newItems===0 && !pending('rientro') && n < 8 && !pending('budget'));
  save(); render();
  if (G.over) gameOver();
  else if (seasonEnd) endSeason();
  else if (G.newItems) toast(`${G.newItems} ${G.newItems===1 ? 'nuova notifica' : 'nuove notifiche'}`);
}

function mkNgLeague(){

}
function seasonStart(){
  const L = lvl();
  G.md = ((TIER[G.lv] ? 20 : L.teams) - 1)*2; G.W = 3 + G.md + 1; G.week = 0;
  G.league = mkLeague(G.lv); G.results = []; G.taken = {};
  G.fin.ce = emptyCE(); G.fin.capIn = 0; G.fans.shirts = 0;
  G.pen = 0;
  if (G.penNext){ if (equity() < 0){ teamById('me').pts -= G.penNext; G.pen = G.penNext; news(`Patrimonio netto ancora negativo: ${G.penNext} punti di penalizzazione.`, 'neg'); } G.penNext = 0; }
  const st = G.fac.stadio; st.tmp = 0;

    else { st.lv = L.minStad; news(`La ${L.n} impone almeno uno ${FAC.stadio.lv[L.minStad].toLowerCase()}: il contratto d’affitto passa a ${eur(FAC.stadio.rent[L.minStad])} all’anno.`, 'neg'); }
  }

  G.budget.spentFac = 0; G.budget.spentEv = 0; G.budget.spentT = 0; G.budget.approved = 0; if (G.staff && G.staff.dg){ if (!G.sponsors.maglia && !pending('sponsor')) sponsorItem('maglia'); else if (!G.sponsors.tecnico && !pending('sponsor')) sponsorItem('tecnico'); } if (G.season > 1 || G.players.length) kitItem('start'); budgetItem();
  book('iscr', L.fee);

  book('abbo', G.fans.abb*abbPrice);

  G.players.forEach(p => { p.gl = 0; p.pr = 0; p.as = 0; p.renewAsked = false; });
  news(`Inizia la stagione ${G.season}: ${L.n}. ${G.fans.abb} abbonati. Il mercato è aperto per 3 settimane.`);
