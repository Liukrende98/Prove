<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Il Presidente</title>
<script src="lib/three.min.js"></script>
<script src="lib/CopyShader.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/EffectComposer.js"></script>
<script src="lib/RenderPass.js"></script>
<script src="lib/ShaderPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efec; --surface:#ffffff; --surface2:#f3f6f4; --ink:#10231c; --muted:#5b6d66; --line:#d3ddd8;
  --accent:#1d7a4f; --accent-ink:#ffffff; --navy:#18324d; --pos:#1d7a4f; --neg:#c23a2e; --warn:#b7791f;
  --soft:#dcebe3;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1512; --surface:#15211d; --surface2:#1b2a25; --ink:#e6efeb; --muted:#93a8a0; --line:#2a3b35;
    --accent:#3fb27f; --accent-ink:#06130d; --navy:#9cc3ea; --pos:#4cc48c; --neg:#ff7a6b; --warn:#e3b04b; --soft:#1f3a2e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1512; --surface:#15211d; --surface2:#1b2a25; --ink:#e6efeb; --muted:#93a8a0; --line:#2a3b35;
  --accent:#3fb27f; --accent-ink:#06130d; --navy:#9cc3ea; --pos:#4cc48c; --neg:#ff7a6b; --warn:#e3b04b; --soft:#1f3a2e;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* Testata */
#top{background:var(--navy);color:#fff;padding:10px 14px 10px}
:root[data-theme="dark"] #top{color:#0c1512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #top{color:#0c1512}}
.toprow{display:flex;align-items:center;gap:10px}
.crest{width:34px;height:34px;border-radius:50% 50% 46% 46%;border:3px solid;flex:none}
.club{flex:1;min-width:0}
.club b{display:block;font-stretch:80%;font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club span{font-size:13px;opacity:.8}
.cash{text-align:right}
.cash b{display:block;font-stretch:80%;font-weight:800;font-size:19px}
.cash span{font-size:12px;opacity:.8}
.timerow{display:flex;align-items:center;gap:8px;margin-top:10px}
.when{flex:1;font-size:13px;opacity:.9;line-height:1.2}
.when b{font-size:15px;display:block}
.adv{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:rgba(255,255,255,.16);color:inherit}
.adv.main{background:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .adv{background:rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .adv{background:rgba(0,0,0,.14)}}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
#nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line)}
#nav button{border:0;background:none;padding:7px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nav button i{font-style:normal;font-size:20px;line-height:1}
#nav button.on{color:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--neg);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}

/* Blocchi */
h2{font-stretch:80%;font-weight:800;font-size:22px;margin:18px 2px 8px;line-height:1.1}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-stretch:80%;font-size:22px;font-weight:800}

/* Tabelle e liste */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:4px 4px}
td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;width:26px;color:var(--muted)}
tr.me td{background:var(--soft);font-weight:700}
tr.zone-up td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
tr.zone-down td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
.ledger td{border-top:1px dashed var(--line)}
.ledger td:first-child{color:var(--ink);width:auto}
.ledger tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.role{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.r-P{background:#b7791f}.r-D{background:#2f6db5}.r-C{background:#1d7a4f}.r-A{background:#c23a2e}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted)}
.ovr{font-stretch:80%;font-weight:800;font-size:20px;min-width:44px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.stars{color:var(--warn);letter-spacing:1px;font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);margin-left:4px}
.tag.red{color:var(--neg)}
.res{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 6px;border-radius:7px;font-weight:700;font-size:13px;color:#fff;margin:0 4px 4px 0}
.res.W{background:var(--pos)}.res.D{background:#7a8a84}.res.L{background:var(--neg)}
.news p{margin:0;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.news p:first-child{border-top:0}
.news em{font-style:normal;color:var(--muted);font-size:12px;margin-right:6px}

/* Riunioni */
.meet{border-left:4px solid var(--accent)}
.meet.urgent{border-left-color:var(--neg)}
.from{font-size:12px;font-weight:700;color:var(--muted)}
.meet h3{font-size:17px;margin:2px 0 6px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.opt.pri{border-color:var(--accent);background:var(--soft)}

/* Modali */
#modal{position:fixed;inset:0;background:rgba(5,12,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  padding:16px 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#modal.hidden{display:none}
.sheet{background:var(--surface);border-radius:18px;padding:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.sheet h2{margin-top:0}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1}
.splash{max-width:440px;margin:0 auto;padding:30px 6px}
.splash h1{font-stretch:75%;font-weight:800;font-size:56px;line-height:.95;margin:0 0 10px}
.chart{width:100%;height:150px;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--muted)}
.subnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{font-stretch:80%;font-weight:800;font-size:17px;margin:14px 2px 6px;display:flex;justify-content:space-between;align-items:baseline}
.cat span{font-family:var(--font);font-stretch:100%;font-size:12.5px;font-weight:600;color:var(--muted)}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent-ink)}
.ck.on{background:var(--accent);border-color:var(--accent)}
.selbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.pot{font-size:12px;color:var(--muted);text-align:right;font-weight:600}
.fac h3{font-size:16px;margin:0}
.lvl{display:flex;gap:4px;margin:8px 0}
.lvl i{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.lvl i.on{background:var(--accent);border-color:var(--accent)}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:20px}
.planrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.planrow:first-child{border-top:0}
.fitp{color:var(--pos);font-weight:700}.fitn{color:var(--neg);font-weight:700}
tr.click{cursor:pointer}

#nav{grid-template-columns:repeat(7,1fr)}
#nav button{font-size:10.5px}
.chatb{position:relative;padding:9px 10px}
.cdot{position:absolute;top:-5px;right:-5px;background:var(--neg);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
#chat{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;background:var(--chatbg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#chat.hidden{display:none}
:root{--chatbg:#e4ddd3;--bubme:#d4f5c4;--bubds:#ffffff}
:root[data-theme="dark"]{--chatbg:#0b141a;--bubme:#144d37;--bubds:#1f2c33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chatbg:#0b141a;--bubme:#144d37;--bubds:#1f2c33}}
#chathead{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:10px 12px}
:root[data-theme="dark"] #chathead{color:#0c1512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #chathead{color:#0c1512}}
#chathead b{display:block;font-size:16px}
#chathead span{font-size:12.5px;opacity:.85}
.cback{border:0;background:none;color:inherit;font-size:30px;line-height:1;padding:0 6px}
.cav{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
#chatbody{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:84%;padding:8px 10px 6px;border-radius:12px;font-size:15px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.08);color:var(--ink)}
.bub.ds{align-self:flex-start;background:var(--bubds);border-top-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--bubme);border-top-right-radius:4px}
.bt{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.bopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bopts button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-weight:700;color:var(--accent);text-align:center}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#chatqr{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 10px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
#chatqr::-webkit-scrollbar{display:none}
#chatqr button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:9px 13px;font-weight:700;font-size:14px}
#chatqr button:disabled{opacity:.5}
.mnews{padding:9px 0;border-top:1px solid var(--line)}
.mnews:first-child{border-top:0}
.mnews p{margin:4px 0 2px;font-size:14.5px}
.mnews em{font-style:normal;font-size:12px;color:var(--muted)}
.msrc{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:5px;color:#fff}
.s-sky{background:#0b3d91}.s-dazm{background:#111}.s-fab{background:#6a2c91}.s-gaz{background:#d6336c}.s-tmw{background:#1d7a4f}
@media (prefers-reduced-motion: reduce){.typing i{animation:none}}

.thread{background:var(--chatbg);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto;margin-top:10px}
.thread .bub{max-width:88%;font-size:14.5px;white-space:pre-line}
.qr{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px}
.qr button:disabled{opacity:.5}
.meet.done{opacity:.72;border-left-color:var(--line)}

.ngp{margin-top:8px}
.nhead b{display:block;font-size:17px}
.nhead span{font-size:13px;color:var(--muted)}
.nsteps{display:flex;gap:6px;margin:10px 0 4px}
.nsteps span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:6px;border-radius:8px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.nsteps span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nsteps span.ok{color:var(--pos)}
.npat{font-size:12.5px;color:var(--warn);font-weight:700;margin:6px 0;letter-spacing:.5px}
.nds{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13.5px;margin:6px 0 4px}
.nf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.nl{font-weight:700;font-size:14.5px;min-width:130px}
.nl span{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:800}
.stp b{min-width:90px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.nch{display:flex;gap:5px;flex-wrap:wrap}
.nch button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}
.nch button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nlog{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.nlog p{margin:3px 0;font-size:13.5px}
.ltab{margin-top:8px}
.ltab td,.ltab th{text-align:left;vertical-align:middle}
.ltab td:first-child,.ltab th:first-child{width:auto;color:var(--ink)}

.ngp .nhead b{font-size:16px}
.ngp .nhead span{font-size:12.5px}
.nrow{display:flex;align-items:center;gap:6px;margin:8px 0 4px}
.nst{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.nst.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nst.ok{color:var(--pos)}
.npat{margin-left:auto;font-size:12px;color:var(--warn);letter-spacing:1px}
.ngp .nds{font-size:13px;padding:7px 9px}
.ngp .nf{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px;padding:7px 0;flex-wrap:nowrap}
.ngp .nl{font-size:13.5px;min-width:0}
.ngp .nl span{font-size:11.5px}
.nfx{grid-column:1/-1;display:flex;justify-content:flex-end}
.ngp .stp{gap:4px}
.ngp .stp button{width:34px;height:34px;font-size:18px;border-radius:9px}
.ngp .stp b{min-width:74px;font-size:15px}
.ngp .nch{gap:4px;flex-wrap:nowrap}
.ngp .nch button{padding:6px 9px;font-size:12.5px;min-width:30px}
.ngp .nlog p{font-size:12.5px}
.nbar{position:sticky;bottom:-16px;background:var(--surface);display:flex;gap:6px;padding:10px 0 4px;margin-top:6px;border-top:1px solid var(--line);z-index:1}
.nbar .btn{flex:1;padding:11px 6px;margin:0}
.nbar .btn.x{flex:0 0 44px}

.shr{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.shopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 11px;margin-top:6px}
.shopt.on{border-color:var(--accent);background:var(--soft)}
.shopt b{display:block;font-size:14px}
.shopt span{display:block;font-size:12.5px;color:var(--muted)}
.shopt span.pos{color:var(--pos)} .shopt span.neg{color:var(--neg)}

.campuscard{padding:6px;background:linear-gradient(180deg,#bfe3f5 0%,#d8efe0 30%,var(--surface) 100%)}
:root[data-theme="dark"] .campuscard{background:linear-gradient(180deg,#0e2a3a 0%,#123326 40%,var(--surface) 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .campuscard{background:linear-gradient(180deg,#0e2a3a 0%,#123326 40%,var(--surface) 100%)}}
.campus{width:100%;height:auto;display:block}
.campus .bld{cursor:pointer;transition:filter .15s}
.campus .bld:active{filter:brightness(1.15)}
.mod{padding:10px 0;border-top:1px solid var(--line)}
.mod .btn{padding:8px 10px;font-size:13px;text-align:right;max-width:58%}
.mod .lvl{margin:6px 0 2px}
.pitchbar{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:13px}
.pitchbar .bar{flex:1;margin:0;height:8px}

.campuscard{border-radius:18px;overflow:hidden;margin:0 -4px 10px;background:linear-gradient(180deg,#a9daf2 0%,#cdeccf 45%,#a7d48a 100%);box-shadow:0 6px 18px rgba(0,0,0,.12)}
:root[data-theme="dark"] .campuscard{background:linear-gradient(180deg,#0f2f45 0%,#16402c 60%,#1c4a2e 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .campuscard{background:linear-gradient(180deg,#0f2f45 0%,#16402c 60%,#1c4a2e 100%)}}
.campuscard .campus{padding:6px 0}
.fchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.fchip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 9px;text-align:left;min-height:48px}
.fchip span{font-size:20px}
.fchip b{flex:1;font-size:13px;line-height:1.1}
.fchip i{font-style:normal;font-weight:800;font-size:12px;background:var(--gold, #f2c200);color:#10231c;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.fchip i.w{background:#e5484d;color:#fff}
.fsum{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fsum div{padding:9px 6px;text-align:center;border-left:1px solid var(--line)}
.fsum div:first-child{border-left:0}
.fsum span{display:block;font-size:11px;color:var(--muted)}
.fsum b{font-size:14px;font-variant-numeric:tabular-nums}
#fview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .18s,visibility 0s .2s}
#fview.on{visibility:visible;opacity:1;transition:opacity .18s}
.fhero{position:relative;height:44vh;min-height:250px;max-height:380px;flex:none;background:linear-gradient(180deg,#a9daf2 0%,#cdeccf 55%,#a7d48a 100%);overflow:hidden}
:root[data-theme="dark"] .fhero{background:linear-gradient(180deg,#0f2f45 0%,#16402c 60%,#1c4a2e 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fhero{background:linear-gradient(180deg,#0f2f45 0%,#16402c 60%,#1c4a2e 100%)}}
.fhero svg{position:absolute;inset:0;width:100%;height:100%}
.fhero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(8,20,15,.65));pointer-events:none}
.fback{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(16,35,28,.72);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ftitle{position:absolute;z-index:2;left:16px;right:16px;bottom:28px;display:flex;align-items:center;gap:10px;color:#fff}
.ftitle span{font-size:30px}
.ftitle b{display:block;font-stretch:80%;font-weight:800;font-size:26px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.ftitle small{font-size:13.5px;opacity:.92}
.fbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:20px 20px 0 0;margin-top:-18px;position:relative;z-index:3;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 96px);animation:fup .4s .25s both cubic-bezier(.2,.8,.2,1)}
.fbody.nofx{animation:none}
@keyframes fup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.fseg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.fseg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.fseg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.frow:first-child{border-top:0}
.frow span{color:var(--muted)}
.frow b{text-align:right}
.fpitch{display:flex;align-items:center;gap:8px;width:55%}
.fpitch .bar{flex:1;margin:0;height:8px}
.flinks{padding:0 4px}
.flink{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:13px 8px;border-top:1px solid var(--line);font-size:14px;text-align:left}
.flink:first-child{border-top:0}
.flink.neg span{color:var(--neg)}
.fsec{font-weight:700;font-size:13px;color:var(--muted);margin:6px 2px 6px}
.fnote{font-size:13px;color:var(--muted);margin:4px 2px 10px;line-height:1.45}
.mtile{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:9px}
.mic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px}
.mtx b{display:block;font-size:14.5px}
.mtx span{display:block;font-size:12.5px;color:var(--muted)}
.mtx em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.mbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 10px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;min-width:76px;line-height:1.15}
.mbtn small{font-weight:600;font-size:10.5px;opacity:.9;max-width:84px;text-align:center}
.mmax{font-weight:800;font-size:12px;color:var(--pos);padding:0 6px}
.stp.vert{flex-direction:column;gap:2px}
.stp.vert button{width:36px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:18px;font-weight:800}
.stp.vert b{min-width:0;font-size:16px;text-align:center}
.fbar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06)}
.fbar .btn{width:100%;padding:14px;font-size:15px;border-radius:14px}
@media (prefers-reduced-motion: reduce){.fbody{animation:none}}

.campuscard{background:#9fd07c}
.campuscard .campus{height:min(62vh,560px);padding:0}
#fview{background:#0c1512}
.fscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
.fscene{position:relative;height:min(66vh,600px);overflow:hidden;background:#9fd07c}
.fscene .fmap{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s}
.fscene .fint{position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
.fscene .fint svg{width:100%;height:100%;display:block}
.fscene.in .fint{opacity:1;transform:none}
.fscene.in .fmap{opacity:0}
.ftitle2{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;display:flex;align-items:center;gap:10px;color:#fff;opacity:0;transform:translateY(-8px);transition:.35s .15s}
.fscene.in .ftitle2{opacity:1;transform:none}
.fti{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ftitle2 b{display:block;font-stretch:75%;font-weight:900;font-style:italic;font-size:30px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.ftitle2 small{font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.fcar{position:absolute;z-index:2;left:0;right:0;bottom:14px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none;opacity:0;transform:translateY(24px);transition:.4s .25s cubic-bezier(.2,.8,.2,1)}
.fcar::-webkit-scrollbar{display:none}
.fscene.in .fcar{opacity:1;transform:none}
.ucard{flex:0 0 74%;max-width:300px;scroll-snap-align:center;background:#f7f9f8;color:#10231c;border-radius:6px;padding:12px 14px 12px;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.28);display:grid;grid-template-columns:1fr auto;grid-template-areas:"chip chip" "t btn" "s btn" "p btn";column-gap:10px;row-gap:2px;align-items:center}
.ucard.main{border-top:4px solid #f2c200}
.uchip{grid-area:chip;justify-self:start;background:#123a2e;color:#fff;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:4px;margin-bottom:6px}
.ucard b{grid-area:t;font-stretch:80%;font-weight:900;font-size:19px;line-height:1.05;text-transform:uppercase}
.ucard small{grid-area:s;font-size:12.5px;color:#4b5d56}
.ucard .pips{grid-area:p;margin-top:6px}
.ucard .pips i{background:#d3ddd8}.ucard .pips i.on{background:#1d7a4f}
.ubtn{grid-area:btn;border:0;background:#10231c;color:#f2c200;border-radius:6px;padding:10px 10px;font-weight:900;font-size:14px;min-width:84px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ubtn small{color:#fff;font-weight:600;font-size:10.5px;max-width:90px;text-align:center;grid-area:auto}
.udone{grid-area:btn;color:#1d7a4f;font-weight:900;font-size:12.5px}
.fbody2{background:var(--bg);padding:14px 14px 20px;min-height:40vh}
.fbackbar{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#0c1512;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center}
.fbackbar button{border:0;background:none;color:#fff;font-weight:900;font-style:italic;font-size:19px;letter-spacing:.5px;padding:8px 20px}
@media (prefers-reduced-motion: reduce){.fscene .fint,.ftitle2,.fcar{transition:none}}

.map3d{position:relative;height:min(64vh,580px);overflow:hidden;touch-action:none}
.map3d canvas{display:block}
.m3hint{position:absolute;z-index:2;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,25,20,.62);color:#fff;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:hintfade 6s 2s forwards}
@keyframes hintfade{to{opacity:0}}
.l3wrap{position:absolute;inset:0;pointer-events:none}
.l3d{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.94);color:#10231c;border-radius:12px;padding:4px 8px 4px 4px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:opacity .25s;font-family:var(--font);will-change:transform}
.l3d::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,255,255,.94);border-bottom:0}
.l3i{width:26px;height:26px;border-radius:8px;background:#10231c;display:flex;align-items:center;justify-content:center;font-size:15px}
.l3d b{font-weight:900;font-style:italic;font-size:12.5px;letter-spacing:.3px}
.l3d i{font-style:normal;font-weight:900;font-size:11.5px;background:#f2c200;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.l3d i.w{background:#e5484d;color:#fff}
.f3d{position:absolute;inset:0}
.f3d canvas{display:block}
.campuscard:has(.map3d){background:#9fd3f2;padding:0}

.ucard{transition:transform .25s, box-shadow .25s}
.ucard.cur{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.35), 0 0 0 3px #f2c200}

.bud .bcard{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bhead span{font-weight:800;font-size:14px}
.bhead b{font-stretch:80%;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.bdn{display:flex;gap:12px;align-items:center}
.bdn svg{flex:none}
.lgd{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.lgd div{display:grid;grid-template-columns:10px 1fr auto auto;gap:6px;align-items:center;font-size:12.5px}
.lgd i{width:10px;height:10px;border-radius:3px}
.lgd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgd b{font-variant-numeric:tabular-nums}
.lgd em{font-style:normal;color:var(--muted);min-width:30px;text-align:right}
.lgd.mini{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.lgd.mini div{grid-template-columns:10px 1fr auto}
.bsl{padding:8px 0;border-top:1px solid var(--line)}
.bsl:first-of-type{border-top:0}
.bslh{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.bslh b{font-variant-numeric:tabular-nums;font-size:16px}
.bslr{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
.bslr input[type=range]{flex:1;accent-color:var(--accent);height:28px;padding:0;border:0;background:none}
.bsub{font-size:12px;color:var(--muted)}
.bbar{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.bbt{height:16px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bbt i{display:block;height:100%}
.bbar b{font-variant-numeric:tabular-nums}
.bres{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:14px;padding:12px;color:#fff}
.bres span{display:block;font-size:12px;opacity:.9}
.bres b{font-stretch:80%;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.bres.good{background:linear-gradient(135deg,#1d7a4f,#2aa36a)}
.bres.mid{background:linear-gradient(135deg,#b7791f,#e0a63a)}
.bres.bad{background:linear-gradient(135deg,#a32a20,#d6493b)}
.dirg{padding:8px 0;border-top:1px solid var(--line)}
.dirg>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.dirg .chips{margin:0}
/* =================== TEMA LUXURY =================== */
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface2:#f1ece2; --ink:#16181c; --muted:#76716a; --line:#e6dfd1;
  --accent:#16181c; --accent-ink:#f6f2ea; --gold:#a8843f; --gold2:#c9a75e; --navy:#121417; --pos:#2f7a55; --neg:#b0392f; --warn:#a97a22; --soft:#efe7d6;
  --font:"Manrope",system-ui,-apple-system,"Helvetica Neue",sans-serif; --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --shadow:0 1px 2px rgba(22,24,28,.04),0 6px 18px rgba(22,24,28,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0e10; --surface:#16181b; --surface2:#1d2024; --ink:#efe9dd; --muted:#948e83; --line:#272a2f;
  --accent:#c9a75e; --accent-ink:#141210; --gold:#c9a75e; --gold2:#e0c283; --navy:#08090a; --pos:#62b98c; --neg:#e2695e; --warn:#d8a94c; --soft:#2a2519; --shadow:none; } }
:root[data-theme="dark"]{ --bg:#0d0e10; --surface:#16181b; --surface2:#1d2024; --ink:#efe9dd; --muted:#948e83; --line:#272a2f; --accent:#c9a75e; --accent-ink:#141210; --gold:#c9a75e; --gold2:#e0c283; --navy:#08090a; --pos:#62b98c; --neg:#e2695e; --warn:#d8a94c; --soft:#2a2519; --shadow:none; }
body{font-family:var(--font);font-size:15px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
/* testata */
#top{background:var(--navy);color:#f3eee4;padding:12px 16px 12px;border-bottom:1px solid rgba(201,167,94,.35)}
:root[data-theme="dark"] #top{color:#f3eee4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #top{color:#f3eee4}}
.toprow{gap:12px}
.crestsvg{flex:none;display:block}
.club b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em;font-stretch:100%}
.club span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.cash b{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--gold2);font-stretch:100%}
.cash span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.timerow{margin-top:12px;gap:10px}
.when{font-size:12.5px;opacity:.75}
.when b{font-size:15px;opacity:1;color:#fff;font-weight:700;letter-spacing:0}
.adv{min-height:40px;border-radius:12px;padding:0 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:6px}
.adv.main{background:linear-gradient(180deg,#d4b46f,#b8944f);color:#17140e;border:0;box-shadow:0 4px 14px rgba(201,167,94,.25)}
/* navigazione */
#nav{grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:2px}
#nav button{padding:9px 2px 7px;font-size:10.5px;font-weight:600;letter-spacing:.02em;gap:4px;color:var(--muted)}
#nav button .ic{width:23px;height:23px;stroke-width:1.5}
#nav button.on{color:var(--ink)}
#nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
.badge{background:var(--gold);color:#17140e;font-weight:800}
/* tipografia e blocchi */
#main{padding:14px 14px 28px}
h2{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em;font-stretch:100%;margin:22px 2px 10px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sect h2{margin:0}
.sect>span{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.card{border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.from{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:44px;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border-color:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{min-height:36px;padding:0 14px;font-size:13px;border-radius:999px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi{border-radius:16px;box-shadow:var(--shadow)}
.kpi b{font-family:var(--serif);font-weight:600;font-stretch:100%}
.subnav{margin:0 -14px 6px;padding:0 14px 4px;gap:8px}
.subnav button{min-height:38px;padding:0 15px;font-size:13.5px;border-radius:999px;font-weight:700}
.subnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:4px 2px 14px;line-height:1.4}
.hint .ic{color:var(--gold);margin-top:1px}
.opt{border-radius:14px;padding:12px 14px;min-height:48px}
.opt.pri{border-color:var(--gold);background:var(--soft)}
.meet.urgent{border-left:3px solid var(--gold)}
.role{border-radius:10px;font-weight:800;font-size:12.5px}
.r-P{background:#a8843f}.r-D{background:#3b5a7a}.r-C{background:#2f6b52}.r-A{background:#8f3a35}
.res{border-radius:8px;font-weight:700}
/* home */

.todo{display:flex;flex-direction:column;gap:8px}
.td{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 12px 12px 12px;box-shadow:var(--shadow);min-height:60px}

.tdc{color:var(--muted)}
.allok{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}

.stats3 em{font-style:normal;font-size:11.5px;color:var(--muted)}
.resrow{display:flex;gap:6px;flex-wrap:wrap}
.mini{padding:6px 14px}
.mr{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}

.mrp{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.mrs{font-weight:800;font-variant-numeric:tabular-nums}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px 0 8px;font-weight:700;font-size:13px;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:4px}
.news p{font-size:13.5px}
/* 3D e strutture */

.fti{background:rgba(18,20,23,.75);color:#e0c283;border:1px solid rgba(201,167,94,.5)}

.udone{color:var(--gold)}

.bres b{font-family:var(--serif);font-weight:600;font-stretch:100%}
.bhead b{font-family:var(--serif);font-weight:600;font-stretch:100%}
input[type=range]{accent-color:var(--gold)}
/* Società in 3D */
#main.full{padding:0;overflow:hidden;position:relative}
.soc{position:absolute;inset:0;overflow:hidden;background:#9fd3f2}
.soc3d{position:absolute;inset:0}
.soc3d canvas{display:block}

.socdock::-webkit-scrollbar{display:none}
.socdock button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px 0 11px;border-radius:999px;border:1px solid rgba(201,167,94,.35);background:rgba(18,20,23,.78);color:#e9e3d6;font-weight:700;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,color .2s}

.socdock button.on .ic{color:#17140e}
.socsheet{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;transition:height .38s cubic-bezier(.2,.8,.2,1);border-top:1px solid rgba(201,167,94,.35)}
.socsheet.det-peek{height:26%}.socsheet.det-half{height:52%}.socsheet.det-full{height:92%}
.sheethead{flex:none;position:relative;display:flex;align-items:center;gap:10px;padding:16px 16px 10px;touch-action:none;cursor:grab}

.shtitle{flex:1;min-width:0}
.shtitle b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em}
.shtitle span{font-size:12.5px;color:var(--muted)}
.shtog{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ic.rot90{transform:rotate(90deg)}.ic.rot180{transform:rotate(180deg)}

.soc{touch-action:none;overscroll-behavior:none}
